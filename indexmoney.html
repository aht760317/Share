<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧德補習班 - 系統化繳費作業</title>
    <style>
        :root { --primary: #0F172A; --accent: #3B82F6; --bg: #F8FAFC; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .app-container { max-width: 1000px; margin: auto; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; display: flex; flex-direction: column; }
        
        /* 頂部導覽 */
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        
        .tabs { display: flex; background: #1E293B; }
        .tab-btn { flex: 1; padding: 15px; background: transparent; border: none; color: #94A3B8; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: white; border-bottom: 4px solid var(--accent); background: #0F172A; }
        .tab-btn:hover { color: white; }
        
        .content-area { padding: 30px; display: none; }
        .content-area.active { display: block; }

        /* 系統設定區 */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #475569; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        
        /* 開單作業區 - 步驟佈局 */
        .step-container { display: flex; gap: 30px; }
        .selector-panel { flex: 1; border-right: 2px dashed #E2E8F0; padding-right: 20px; }
        .fee-panel { flex: 2; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .fee-panel.active { opacity: 1; pointer-events: auto; }
        
        h3.section-title { color: var(--primary); margin-top: 0; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #E2E8F0; padding-bottom: 10px; }
        
        /* 按鈕網格 */
        .btn-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        .btn-item { padding: 10px 16px; background: #F1F5F9; border: 2px solid transparent; border-radius: 8px; cursor: pointer; font-size: 15px; color: #334155; font-weight: 500; transition: 0.2s; }
        .btn-item:hover { background: #E2E8F0; }
        .btn-item.active { background: #EFF6FF; border-color: var(--accent); color: var(--accent); font-weight: bold; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1); }
        
        /* 費用輸入列表 */
        .fee-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .fee-row { display: flex; align-items: center; gap: 15px; background: #F8FAFC; padding: 10px 15px; border-radius: 8px; border: 1px solid #E2E8F0; }
        .fee-label { width: 120px; font-weight: bold; color: #334155; font-size: 15px; }
        .fee-input { flex: 1; padding: 8px 12px; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 15px; }
        
        /* 特殊費用 (餐費/交通車) */
        .special-fee { background: #FFFBEB; border-color: #FDE68A; }
        .special-fee .month-input { width: 100px; }
        
        /* 動作按鈕 */
        .action-btns { display: flex; gap: 15px; margin-top: 30px; }
        .btn-print { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-notice { background: #10B981; }
        .btn-notice:hover { background: #059669; }
        .btn-receipt { background: #F59E0B; }
        .btn-receipt:hover { background: #D97706; }

        /* 列印樣式 */
        @media screen { .print-only { display: none; } }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; padding: 0; margin: 0; }
            .receipt-box { border: 2px solid #000; padding: 30px; width: 100%; max-width: 18cm; margin: 0 auto; box-sizing: border-box; position: relative; }
            .receipt-title { text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
            .receipt-header { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #000; }
            .receipt-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
            .receipt-table th, .receipt-table td { border: 1px solid #000; padding: 12px; font-size: 16px; }
            .receipt-table th { background: #f0f0f0 !important; -webkit-print-color-adjust: exact; }
            .receipt-total { text-align: right; font-size: 22px; font-weight: bold; padding-top: 10px; }
            .stamp-area { display: flex; justify-content: space-between; margin-top: 40px; font-size: 18px; align-items: flex-end; }
            .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 100px; color: rgba(0, 0, 0, 0.05); border: 8px solid rgba(0, 0, 0, 0.05); padding: 20px; font-weight: bold; z-index: -1; pointer-events: none; }
        }
    </style>
</head>
<body>

<div class="app-container no-print">
    <div class="header">
        <h1>顧德補習班 繳費系統</h1>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('billing')">開單作業</button>
        <button class="tab-btn" onclick="switchTab('settings')">⚙️ 系統設定</button>
    </div>

    <!-- 開單作業區 -->
    <div id="billing" class="content-area active">
        <div class="step-container">
            <!-- 左側：選擇對象 -->
            <div class="selector-panel">
                <h3 class="section-title">1. 本期繳費月份</h3>
                <div class="form-group">
                    <input type="text" id="globalMonth" placeholder="例如：9月" style="font-size: 18px; font-weight: bold; color: var(--accent);">
                </div>

                <h3 class="section-title">2. 選擇年級</h3>
                <div id="gradeGrid" class="btn-grid"></div>

                <div id="studentSection" style="display: none;">
                    <h3 class="section-title">3. 選擇學生</h3>
                    <div id="studentGrid" class="btn-grid"></div>
                </div>
            </div>

            <!-- 右側：輸入費用 -->
            <div class="fee-panel" id="feePanel">
                <h3 class="section-title" id="feeTitle">4. 輸入費用 (有上的課直接打金額)</h3>
                
                <div class="fee-list">
                    <!-- 特殊費用：交通車與餐費 -->
                    <div class="fee-row special-fee">
                        <div class="fee-label">🚌 交通車費用</div>
                        <input type="text" class="fee-input month-input" id="transMonth" placeholder="填寫月份(例:9月)">
                        <input type="number" class="fee-input amount-input" id="transAmt" placeholder="輸入金額">
                    </div>
                    <div class="fee-row special-fee">
                        <div class="fee-label">🍱 餐費</div>
                        <input type="text" class="fee-input month-input" id="mealMonth" placeholder="填寫月份(例:9月)">
                        <input type="number" class="fee-input amount-input" id="mealAmt" placeholder="輸入金額">
                    </div>
                    
                    <hr style="border: 0; border-top: 1px dashed #CBD5E1; margin: 10px 0; width: 100%;">
                    
                    <!-- 常規科目會動態產生在這裡 -->
                    <div id="regularSubjects"></div>
                    
                    <!-- 備用欄位 -->
                    <div class="fee-row" style="margin-top: 10px;">
                        <input type="text" class="fee-input" id="otherSubName" placeholder="其他自訂項目 (如教材費)">
                        <input type="number" class="fee-input amount-input" id="otherSubAmt" placeholder="輸入金額">
                    </div>
                </div>

                <div class="action-btns">
                    <button class="btn-print btn-notice" onclick="printDocument('notice')">🖨️ 印繳費通知單</button>
                    <button class="btn-print btn-receipt" onclick="printDocument('receipt')">💰 印已繳費收據</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 系統設定區 -->
    <div id="settings" class="content-area">
        <div class="settings-grid">
            <div>
                <div class="form-group">
                    <label>收款經手人 (印製在收據上)：</label>
                    <input type="text" id="setHandler" onchange="saveSettings()" placeholder="例如：雅鴻">
                </div>
                <div class="form-group">
                    <label>常規收費項目 (半形逗號分隔)：</label>
                    <textarea id="setSubjects" rows="4" onchange="saveSettings()" placeholder="國小數學, 國小作文, 國中國文, 國中數學..."></textarea>
                    <small style="color:#64748B;">* 交通車與餐費已獨立固定，不需寫在此處。</small>
                </div>
            </div>
            <div>
                <div class="form-group">
                    <label>年級與學生名單設定：</label>
                    <textarea id="setClassStudents" rows="10" onchange="saveSettings()" placeholder="國一：王小明, 林小華&#10;國二：陳大頭, 張美麗&#10;國三：吳大強"></textarea>
                    <small style="color:#64748B;">* 格式「年級：學生1, 學生2」 一行一個年級</small>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 列印畫面區 -->
<div id="printArea" class="print-only"></div>

<script>
    let classData = {};
    let subjectList = [];
    let currentGrade = '';
    let currentStudent = '';

    function switchTab(tabId) {
        document.querySelectorAll('.content-area').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
        if(tabId === 'billing') renderGradeButtons();
    }

    function init() {
        const defaultClasses = "國一：\n國二：\n國三：\n國小安親：";
        const defaultSubjects = "國小數學, 國小作文, 國中國文, 國中數學, 國中自然, 國中英文, 國中社會";
        
        document.getElementById('setHandler').value = localStorage.getItem('gude_handler') || "雅鴻";
        document.getElementById('setClassStudents').value = localStorage.getItem('gude_class_students') || defaultClasses;
        document.getElementById('setSubjects').value = localStorage.getItem('gude_subjects') || defaultSubjects;
        
        const m = new Date().getMonth() + 1;
        document.getElementById('globalMonth').value = m + "月";
        document.getElementById('transMonth').value = m + "月";
        document.getElementById('mealMonth').value = m + "月";

        loadSettings();
    }

    function saveSettings() {
        localStorage.setItem('gude_handler', document.getElementById('setHandler').value);
        localStorage.setItem('gude_class_students', document.getElementById('setClassStudents').value);
        localStorage.setItem('gude_subjects', document.getElementById('setSubjects').value);
        loadSettings();
        alert('設定已自動儲存！');
    }

    function loadSettings() {
        const rawClasses = document.getElementById('setClassStudents').value;
        classData = {};
        rawClasses.split('\n').forEach(line => {
            if(!line.trim()) return;
            const parts = line.split(/[:：]/);
            if(parts.length > 0 && parts[0].trim()) {
                classData[parts[0].trim()] = parts.length > 1 ? parts[1].split(',').map(s => s.trim()).filter(s => s) : [];
            }
        });

        subjectList = document.getElementById('setSubjects').value.split(',').map(s => s.trim()).filter(s => s);
        renderGradeButtons();
        buildSubjectInputs();
    }

    function renderGradeButtons() {
        const grid = document.getElementById('gradeGrid');
        grid.innerHTML = '';
        Object.keys(classData).forEach(grade => {
            const btn = document.createElement('button');
            btn.className = `btn-item ${grade === currentGrade ? 'active' : ''}`;
            btn.innerText = grade;
            btn.onclick = () => selectGrade(grade);
            grid.appendChild(btn);
        });
    }

    function selectGrade(grade) {
        currentGrade = grade;
        currentStudent = '';
        renderGradeButtons();
        
        document.getElementById('studentSection').style.display = 'block';
        document.getElementById('feePanel').classList.remove('active');
        
        const grid = document.getElementById('studentGrid');
        grid.innerHTML = '';
        classData[grade].forEach(student => {
            const btn = document.createElement('button');
            btn.className = `btn-item`;
            btn.innerText = student;
            btn.onclick = (e) => selectStudent(student, e.target);
            grid.appendChild(btn);
        });
        
        // 自訂學生按鈕
        const customBtn = document.createElement('button');
        customBtn.className = 'btn-item';
        customBtn.style.background = '#FEF3C7';
        customBtn.innerText = '＋手動輸入學生';
        customBtn.onclick = () => {
            const name = prompt('請輸入學生姓名：');
            if(name) selectStudent(name.trim(), customBtn);
        };
        grid.appendChild(customBtn);
    }

    function selectStudent(student, btnElement) {
        currentStudent = student;
        
        // 更新按鈕樣式
        document.querySelectorAll('#studentGrid .btn-item').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        
        document.getElementById('feeTitle').innerHTML = `4. 輸入 <span style="color:#E11D48;">${student}</span> 的費用明細`;
        document.getElementById('feePanel').classList.add('active');
        
        // 帶入同月份，並清空金額
        clearFeeInputs();
    }

    function buildSubjectInputs() {
        const container = document.getElementById('regularSubjects');
        container.innerHTML = subjectList.map((sub, i) => `
            <div class="fee-row">
                <div class="fee-label">${sub}</div>
                <input type="hidden" id="subName${i}" value="${sub}">
                <input type="number" class="fee-input amount-input" id="subAmt${i}" placeholder="輸入金額">
            </div>
        `).join('');
    }

    function clearFeeInputs() {
        document.querySelectorAll('.amount-input').forEach(input => input.value = '');
        document.getElementById('otherSubName').value = '';
        const m = document.getElementById('globalMonth').value;
        document.getElementById('transMonth').value = m;
        document.getElementById('mealMonth').value = m;
    }

    function printDocument(type) {
        const mainMonth = document.getElementById('globalMonth').value.trim();
        const handler = document.getElementById('setHandler').value.trim();
        
        if(!currentGrade || !currentStudent) { alert('請先選擇年級與學生！'); return; }

        let items = [];
        let total = 0;

        // 檢查交通車
        const transAmt = parseInt(document.getElementById('transAmt').value) || 0;
        if(transAmt > 0) {
            const m = document.getElementById('transMonth').value.trim();
            items.push({ sub: `交通車費用 ${m ? '('+m+')' : ''}`, amt: transAmt });
            total += transAmt;
        }

        // 檢查餐費
        const mealAmt = parseInt(document.getElementById('mealAmt').value) || 0;
        if(mealAmt > 0) {
            const m = document.getElementById('mealMonth').value.trim();
            items.push({ sub: `餐費 ${m ? '('+m+')' : ''}`, amt: mealAmt });
            total += mealAmt;
        }

        // 檢查常規科目
        subjectList.forEach((sub, i) => {
            const amt = parseInt(document.getElementById('subAmt'+i).value) || 0;
            if(amt > 0) {
                items.push({ sub: sub, amt: amt });
                total += amt;
            }
        });

        // 檢查自訂項目
        const otherAmt = parseInt(document.getElementById('otherSubAmt').value) || 0;
        if(otherAmt > 0) {
            const name = document.getElementById('otherSubName').value.trim() || '其他費用';
            items.push({ sub: name, amt: otherAmt });
            total += otherAmt;
        }

        if(items.length === 0) { alert('請至少輸入一項金額！'); return; }

        const d = new Date();
        const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        const isReceipt = type === 'receipt';
        
        let tableRows = items.map((item, idx) => `
            <tr>
                <td style="text-align:center;">${idx + 1}</td>
                <td>${item.sub}</td>
                <td style="text-align:right;">${item.amt.toLocaleString()}</td>
            </tr>
        `).join('');

        let html = `
            <div class="receipt-box">
                ${isReceipt ? '<div class="watermark">已結清</div>' : ''}
                <div class="receipt-title">顧德補習班 ${mainMonth} ${isReceipt ? '已繳費收據' : '繳費通知單'}</div>
                <div class="receipt-header">
                    <div>年級：<strong>${currentGrade}</strong></div>
                    <div>姓名：<strong>${currentStudent}</strong></div>
                    <div>日期：${dateStr}</div>
                </div>
                <table class="receipt-table">
                    <thead>
                        <tr><th style="width:10%;">項次</th><th style="width:60%;">項目名稱</th><th style="width:30%;">金額 (新台幣)</th></tr>
                    </thead>
                    <tbody>${tableRows}</tbody>
                </table>
                <div class="receipt-total">總計： $ ${total.toLocaleString()} 元</div>
        `;

        if(isReceipt) {
            html += `<div class="stamp-area"><div>家長簽名：___________________</div><div>經手人：<strong>${handler}</strong></div></div>`;
        } else {
            html += `<div style="margin-top: 30px; font-size: 16px;">備註：請家長確認明細無誤後，將費用交由學生帶回補習班，謝謝您的配合。</div>`;
        }

        document.getElementById('printArea').innerHTML = html + `</div>`;
        window.print();
    }

    init();
</script>
</body>
</html>
