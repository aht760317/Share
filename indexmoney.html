<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧德補習班 - 快速繳費單系統</title>
    <style>
        :root { --primary: #2563EB; --bg: #F3F4F6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: var(--primary); text-align: center; margin-top: 0; }
        
        /* 設定區塊樣式 */
        .settings-box { background: #E0E7FF; padding: 15px; border-radius: 8px; margin-bottom: 25px; font-size: 14px; }
        .settings-box label { font-weight: bold; display: block; margin-top: 10px; margin-bottom: 5px; color: #3730A3; }
        .settings-box input[type="text"] { width: 100%; padding: 8px; border: 1px solid #A5B4FC; border-radius: 4px; box-sizing: border-box; }
        
        /* 表單區塊樣式 */
        .form-group { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group > div { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input.input-field { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        
        /* 科目列表樣式 */
        .subject-row { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; }
        .subject-row span { font-weight: bold; width: 60px; color: #555; }
        .subject-row input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        
        .btn-print { width: 100%; background: #059669; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; transition: background 0.2s; }
        .btn-print:hover { background: #047857; }
        
        /* 列印與螢幕顯示控制 */
        @media screen {
            .print-only { display: none; }
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; padding: 0; margin: 0; }
            .receipt-box { border: 2px solid #000; padding: 30px; width: 100%; max-width: 18cm; margin: 0 auto; box-sizing: border-box; page-break-inside: avoid; }
            .receipt-title { text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
            .receipt-header { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #000; }
            .receipt-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
            .receipt-table th, .receipt-table td { border: 1px solid #000; padding: 12px; font-size: 16px; }
            .receipt-table th { background: #f0f0f0 !important; -webkit-print-color-adjust: exact; }
            .receipt-total { text-align: right; font-size: 22px; font-weight: bold; padding-top: 10px; }
        }
    </style>
</head>
<body>

<!-- 資料選單 (Datalists)，供 input 自動完成使用 -->
<datalist id="classData"></datalist>
<datalist id="studentData"></datalist>
<datalist id="subjectData"></datalist>

<div class="container no-print">
    <h1>顧德補習班 - 繳費單產生系統</h1>

    <div class="settings-box">
        <h3 style="margin-top: 0; color: #3730A3;">⚙️ 預設資料設定 (先打好，下方就會出現選單讓你點)</h3>
        <p style="margin: 0 0 10px 0; color: #666;">請用「半形逗號」分隔。系統會自動儲存，下次打開還在。</p>
        
        <label>常用班級：</label>
        <input type="text" id="setClasses" onchange="updateSettings()" placeholder="例如：國小安親班, 國一先修班, 國三衝刺班">
        
        <label>所有學生姓名：</label>
        <input type="text" id="setStudents" onchange="updateSettings()" placeholder="例如：王大明, 陳小華, 林漂亮">
        
        <label>常用科目：</label>
        <input type="text" id="setSubjects" onchange="updateSettings()" placeholder="例如：國小數學, 國小作文, 國中國文, 國中英文, 國中自然, 國中社會">
    </div>

    <div class="form-group">
        <div>
            <label>班級</label>
            <input type="text" id="className" class="input-field" list="classData" placeholder="請選擇或輸入班級">
        </div>
        <div>
            <label>學生姓名</label>
            <input type="text" id="studentName" class="input-field" list="studentData" placeholder="請選擇或輸入姓名">
        </div>
    </div>

    <h3 style="border-bottom: 2px solid var(--primary); padding-bottom: 5px;">輸入繳費科目與金額 (最多 10 科，沒上的留白即可)</h3>
    
    <div id="subjectsContainer">
        <!-- JS 會動態產生 10 個輸入列 -->
    </div>

    <button class="btn-print" onclick="generateAndPrint()">🖨️ 產生並輸出一整張繳費單</button>
</div>

<!-- 這裡是列印出來的畫面 -->
<div id="printArea" class="print-only"></div>

<script>
    // 初始化設定資料
    function initSettings() {
        // 讀取 LocalStorage 或使用預設值
        const defaultClasses = "國小安親班, 國小課輔班, 國一班, 國二班, 國三班";
        const defaultStudents = "";
        const defaultSubjects = "國小安親, 國小數學, 國小作文, 國中國文, 國中數學, 國中自然, 國中英文, 國中社會";

        document.getElementById('setClasses').value = localStorage.getItem('gude_classes') || defaultClasses;
        document.getElementById('setStudents').value = localStorage.getItem('gude_students') || defaultStudents;
        document.getElementById('setSubjects').value = localStorage.getItem('gude_subjects') || defaultSubjects;
        
        updateSettings();
        buildSubjectInputs();
    }

    // 更新 Datalist 選單
    function updateSettings() {
        const classes = document.getElementById('setClasses').value;
        const students = document.getElementById('setStudents').value;
        const subjects = document.getElementById('setSubjects').value;

        // 儲存至瀏覽器
        localStorage.setItem('gude_classes', classes);
        localStorage.setItem('gude_students', students);
        localStorage.setItem('gude_subjects', subjects);

        // 轉換為選單選項
        const makeOptions = (str) => str.split(',').map(item => item.trim()).filter(item => item !== '').map(item => `<option value="${item}">`).join('');
        
        document.getElementById('classData').innerHTML = makeOptions(classes);
        document.getElementById('studentData').innerHTML = makeOptions(students);
        document.getElementById('subjectData').innerHTML = makeOptions(subjects);
    }

    // 產生 10 個科目的輸入框
    function buildSubjectInputs() {
        const container = document.getElementById('subjectsContainer');
        let html = '';
        for(let i = 1; i <= 10; i++) {
            html += `
                <div class="subject-row">
                    <span>第 ${i} 科</span>
                    <input type="text" id="sub${i}" list="subjectData" placeholder="請選擇或輸入科目">
                    <input type="number" id="amt${i}" placeholder="請輸入金額 (數字)">
                </div>
            `;
        }
        container.innerHTML = html;
    }

    // 產生繳費單並呼叫列印
    function generateAndPrint() {
        const className = document.getElementById('className').value.trim();
        const studentName = document.getElementById('studentName').value.trim();
        
        if(!className || !studentName) {
            alert('請至少填寫「班級」與「學生姓名」！');
            return;
        }

        let items = [];
        let total = 0;

        // 抓取 10 個欄位的資料
        for(let i = 1; i <= 10; i++) {
            const sub = document.getElementById('sub'+i).value.trim();
            const amtVal = document.getElementById('amt'+i).value.trim();
            const amt = parseInt(amtVal) || 0;
            
            // 只要科目有寫，或者金額大於 0，就列入清單
            if(sub !== '' || amt > 0) {
                items.push({ sub: sub || '未命名科目', amt: amt });
                total += amt;
            }
        }

        if(items.length === 0) {
            alert('請至少輸入一個科目與金額！');
            return;
        }

        // 取得今日日期
        const d = new Date();
        const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        const monthTitle = `${d.getFullYear()}年${d.getMonth()+1}月`;

        // 組合列印用的 HTML
        let tableRows = items.map((item, idx) => `
            <tr>
                <td style="text-align:center;">${idx + 1}</td>
                <td>${item.sub}</td>
                <td style="text-align:right;">${item.amt.toLocaleString()}</td>
            </tr>
        `).join('');

        const printHtml = `
            <div class="receipt-box">
                <div class="receipt-title">顧德補習班 ${monthTitle}繳費單</div>
                <div class="receipt-header">
                    <div>班級：<strong>${className}</strong></div>
                    <div>姓名：<strong>${studentName}</strong></div>
                    <div>製表日期：${dateStr}</div>
                </div>
                <table class="receipt-table">
                    <thead>
                        <tr>
                            <th style="width:10%;">項次</th>
                            <th style="width:60%;">科目名稱</th>
                            <th style="width:30%;">金額 (新台幣)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
                <div class="receipt-total">
                    本期總計應繳： $ ${total.toLocaleString()} 元
                </div>
            </div>
        `;

        // 寫入列印區塊並觸發列印
        document.getElementById('printArea').innerHTML = printHtml;
        window.print();
    }

    // 啟動系統
    initSettings();
</script>
</body>
</html>
