<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲林第三選區 - 村里拜訪追蹤系統</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-gray: #f3f4f6;
            --text-main: #1f2937;
            --visit-1: #bfdbfe;
            --visit-2: #60a5fa;
            --visit-3: #1d4ed8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9fafb;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            border-bottom: 2px solid var(--bg-gray);
            padding-bottom: 10px;
            position: relative;
        }
        /* 按鈕樣式 */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }
        .btn-save { background-color: var(--primary); color: white; }
        .btn-cancel { background-color: #9ca3af; color: white; }
        .btn-clear { background-color: #ef4444; color: white; width: 100%; margin-top: 15px; }
        .btn-export { background-color: #10b981; color: white; margin-bottom: 15px; }
        
        /* 文宣品計算機區塊 */
        .calc-section {
            background-color: #e0f2fe;
            border: 1px solid #bae6fd;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .calc-section h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #0369a1;
        }
        .calc-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .calc-input-group input {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 16px;
            width: 150px;
        }
        .calc-result table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 4px;
            overflow: hidden;
        }
        .calc-result th, .calc-result td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }
        .calc-result th { background-color: #f8fafc; font-weight: bold; color: #475569; }
        
        /* 頁籤與進度條 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background-color: var(--bg-gray);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .progress-container {
            background-color: var(--bg-gray);
            border-radius: 10px;
            height: 20px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background-color: #10b981;
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            left: 0;
            font-size: 12px;
            line-height: 20px;
            font-weight: bold;
            color: #333;
        }
        
        /* 村里卡片網格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        .card {
            background-color: var(--bg-gray);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            border: 1px solid #e5e7eb;
            transition: transform 0.1s;
            min-height: 100px;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h3 { margin: 0 0 10px 0; font-size: 18px; display: flex; justify-content: space-between; }
        .visit-count { font-size: 14px; background: rgba(255,255,255,0.5); padding: 2px 8px; border-radius: 12px; }
        .date-list { list-style: none; padding: 0; margin: 0; font-size: 12px; }
        .date-list li { margin-bottom: 4px; border-bottom: 1px dashed rgba(0,0,0,0.1); }
        .visits-1 { background-color: var(--visit-1); color: #1e3a8a; }
        .visits-2 { background-color: var(--visit-2); color: #ffffff; }
        .visits-3 { background-color: var(--visit-3); color: #ffffff; }
        
        /* 彈出視窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }
        .modal input[type="date"] { width: 90%; padding: 8px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📍 雲林第三選區 宣傳進度追蹤</h1>
    
    <!-- 匯出按鈕 -->
    <div style="text-align: right;">
        <button class="btn btn-export" onclick="exportToCSV()">📥 匯出紀錄 (Excel/CSV)</button>
    </div>

    <!-- 🎯 新增：文宣品分配計算機 -->
    <div class="calc-section">
        <h2>🧮 依人口比例分配文宣品計算機</h2>
        <div class="calc-input-group">
            <label for="totalMerch">這批印製總數量：</label>
            <input type="number" id="totalMerch" placeholder="例如：10000" min="1">
            <button class="btn btn-save" onclick="calculateMerch()">開始計算</button>
        </div>
        <div class="calc-result" id="merchResult" style="display: none;">
            <!-- 計算結果表單將產生於此 -->
        </div>
    </div>

    <div class="tabs" id="regionTabs">
        <!-- 頁籤會由 JS 動態生成 -->
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">0% (0 / 0 覆蓋率)</div>
    </div>

    <div class="grid" id="villageGrid">
        <!-- 村里卡片會由 JS 動態生成 -->
    </div>
</div>

<!-- 彈出視窗：新增拜訪日期 -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2 id="modalTitle">村里名稱</h2>
        <p>新增拜訪日期：</p>
        <input type="date" id="visitDate">
        <br>
        <button class="btn btn-save" onclick="saveVisit()">儲存紀錄</button>
        <button class="btn btn-cancel" onclick="closeModal()">取消</button>
        <hr style="margin-top:20px; border:0; border-top:1px solid #eee;">
        <button class="btn btn-clear" onclick="clearVillage()">清除此里所有紀錄</button>
    </div>
</div>

<script>
    // --- 【1. 人口與文宣分配設定】 ---
    const populationData = {
        '虎尾鎮': { pop: 70000, items: '濕紙巾、環保袋、設計摺頁 (空戰/都會型)' },
        '土庫鎮': { pop: 28000, items: '菜瓜布、口罩、農民曆 (生活實用型)' },
        '元長鄉': { pop: 24000, items: '痠痛貼布、扇子、大字體文宣 (長輩適用型)' },
        '褒忠鄉': { pop: 12000, items: '精緻小紀念品、伴手禮 (一對一深度型)' }
    };
    const totalPopulation = 70000 + 28000 + 24000 + 12000;

    function calculateMerch() {
        const totalItems = parseInt(document.getElementById('totalMerch').value);
        if (!totalItems || totalItems <= 0) return alert('請輸入有效的文宣品總數！');

        let resultHTML = `
            <table>
                <tr>
                    <th>鄉鎮</th>
                    <th>人口比例</th>
                    <th>建議發送數量</th>
                    <th>適合品項參考</th>
                </tr>
        `;

        for (let region in populationData) {
            const ratio = populationData[region].pop / totalPopulation;
            const allocated = Math.round(totalItems * ratio);
            const percent = (ratio * 100).toFixed(1);
            
            resultHTML += `
                <tr>
                    <td><strong>${region}</strong></td>
                    <td>${percent}%</td>
                    <td style="color: #c2410c; font-weight: bold; font-size: 16px;">${allocated.toLocaleString()} 份</td>
                    <td style="font-size: 13px; color: #555;">${populationData[region].items}</td>
                </tr>
            `;
        }
        resultHTML += '</table>';
        
        const resultDiv = document.getElementById('merchResult');
        resultDiv.innerHTML = resultHTML;
        resultDiv.style.display = 'block';
    }


    // --- 【2. 區域與村里拜訪追蹤邏輯】 ---
    const regions = {
        '虎尾鎮': ['東仁里', '公安里', '平和里', '中山里', '西安里', '安慶里', '建國里', '光復里', '新興里', '穎川里', '延平里', '頂溪里', '中溪里', '下溪里', '三合里', '芳草里', '埒內里', '堀頭里', '安溪里', '興南里', '北溪里', '西屯里', '墾地里', '過溪里', '廉使里', '惠來里', '新吉里', '立仁里', '建興里'],
        '土庫鎮': ['忠正里', '順天里', '宮北里', '越港里', '石廟里', '大荖里', '奮起里', '埤腳里', '東平里', '南平里', '西平里', '北平里', '崙內里', '後埔里', '新庄里', '溪邊里', '興新里'],
        '元長鄉': ['長南村', '長北村', '子茂村', '後湖村', '山內村', '合和村', '五塊村', '潭西村', '潭東村', '客厝村', '卓運村', '頂寮村', '下寮村', '龍岩村', '西莊村', '鹿北村', '鹿南村', '瓦磘村', '內寮村', '新吉村', '崙仔村'],
        '褒忠鄉': ['中民村', '中勝村', '埔姜村', '馬鳴村', '新湖村', '有才村', '田洋村', '潮厝村', '龍岩村']
    };

    let currentRegion = '虎尾鎮';
    let currentVillageSelect = '';
    
    // 讀取 Local Storage
    let visitsData = JSON.parse(localStorage.getItem('yunlinCampaignVisits')) || {};
    for (let region in regions) {
        if (!visitsData[region]) visitsData[region] = {};
        regions[region].forEach(village => {
            if (!visitsData[region][village]) visitsData[region][village] = [];
        });
    }

    function init() {
        renderTabs();
        renderGrid();
        document.getElementById('visitDate').valueAsDate = new Date(); // 預設今天日期
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('regionTabs');
        tabsContainer.innerHTML = '';
        Object.keys(regions).forEach(region => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${region === currentRegion ? 'active' : ''}`;
            btn.innerText = region;
            btn.onclick = () => { currentRegion = region; renderTabs(); renderGrid(); };
            tabsContainer.appendChild(btn);
        });
    }

    function renderGrid() {
        const grid = document.getElementById('villageGrid');
        grid.innerHTML = '';
        const villages = regions[currentRegion];
        let visitedCount = 0;

        villages.forEach(village => {
            const dates = visitsData[currentRegion][village];
            const visitNum = dates.length;
            if (visitNum > 0) visitedCount++;

            let colorClass = '';
            if (visitNum === 1) colorClass = 'visits-1';
            else if (visitNum === 2) colorClass = 'visits-2';
            else if (visitNum >= 3) colorClass = 'visits-3';

            let dateListHTML = '';
            dates.forEach((date, index) => {
                dateListHTML += `<li>${index + 1}訪: ${date}</li>`;
            });

            const card = document.createElement('div');
            card.className = `card ${colorClass}`;
            card.onclick = () => openModal(village);
            card.innerHTML = `
                <h3>${village} <span class="visit-count">${visitNum}次</span></h3>
                <ul class="date-list">${dateListHTML}</ul>
            `;
            grid.appendChild(card);
        });

        const percent = Math.round((visitedCount / villages.length) * 100) || 0;
        document.getElementById('progressBar').style.width = `${percent}%`;
        document.getElementById('progressText').innerText = `本區覆蓋率: ${percent}% (${visitedCount} / ${villages.length})`;
    }

    function openModal(village) {
        currentVillageSelect = village;
        document.getElementById('modalTitle').innerText = `${currentRegion} - ${village}`;
        document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function saveVisit() {
        const dateVal = document.getElementById('visitDate').value;
        if (!dateVal) return alert('請選擇日期！');
        visitsData[currentRegion][currentVillageSelect].push(dateVal);
        visitsData[currentRegion][currentVillageSelect].sort();
        saveData();
        closeModal();
        renderGrid();
    }

    function clearVillage() {
        if (confirm(`確定要清除 ${currentVillageSelect} 的所有拜訪紀錄嗎？`)) {
            visitsData[currentRegion][currentVillageSelect] = [];
            saveData();
            closeModal();
            renderGrid();
        }
    }
    function saveData() { localStorage.setItem('yunlinCampaignVisits', JSON.stringify(visitsData)); }

    // --- 【3. 匯出 CSV 邏輯】 ---
    function exportToCSV() {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "鄉鎮,村里,拜訪總數,詳細拜訪日期\n";

        for (let region in visitsData) {
            for (let village in visitsData[region]) {
                let dates = visitsData[region][village];
                let visitCount = dates.length;
                let datesString = dates.join(" / ");
                if (visitCount > 0) {
                    csvContent += `${region},${village},${visitCount},${datesString}\n`;
                }
            }
        }
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "雲林第三選區_宣傳進度.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // 執行初始化
    init();
</script>
</body>
</html>
