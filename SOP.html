<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>補習班櫃台時段任務與設定看板</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .current-time { font-size: 22px; font-weight: bold; color: #2c3e50; }
        
        .main-layout { display: flex; gap: 20px; }
        .left-panel { flex: 2; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .right-panel { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
        
        h2 { font-size: 18px; color: #2980b9; margin-top: 0; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 14px; }
        th { background-color: #f8f9fa; color: #555; }
        .done { text-decoration: line-through; color: #95a5a6; background-color: #f9f9f9; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-routine { background-color: #e8f4fd; color: #3498db; }
        .badge-facility { background-color: #eafaf1; color: #27ae60; }
        .badge-urgent { background-color: #fadbd8; color: #c0392b; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn-add { background-color: #27ae60; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .btn-add:hover { background-color: #219653; }
        .btn-del { background-color: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        .timestamp { font-size: 12px; color: #7f8c8d; }
        .time-alert { color: #c0392b; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1 style="margin: 0; font-size: 20px; color: #2c3e50;">🔔 櫃台時段任務與排程看板</h1>
        <div class="current-time" id="clock">00:00:00</div>
    </div>

    <div class="main-layout">
        <!-- 左側：今日任務執行清單 -->
        <div class="left-panel">
            <h2>📋 今日櫃台時段任務執行表</h2>
            <table>
                <thead>
                    <tr>
                        <th width="50">完成</th>
                        <th width="80">時間</th>
                        <th width="90">類別</th>
                        <th>SOP 任務內容</th>
                        <th width="140">執行紀錄</th>
                        <th width="50">刪除</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <!-- 動態載入項目 -->
                </tbody>
            </table>
        </div>

        <!-- 右側：時間與 SOP 設定面板 -->
        <div class="right-panel">
            <h2>⚙️ 新增／設定時段 SOP</h2>
            <form id="taskForm" onsubmit="addNewTask(event)">
                <div class="form-group">
                    <label for="taskTime">執行時間 (HH:MM)</label>
                    <input type="time" id="taskTime" required value="14:00">
                </div>
                <div class="form-group">
                    <label for="taskCategory">任務類別</label>
                    <select id="taskCategory">
                        <option value="routine">例行行政</option>
                        <option value="facility">環境設備</option>
                        <option value="urgent">主任交辦</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskDesc">SOP 事項說明</label>
                    <textarea id="taskDesc" rows="3" placeholder="例如：開啟教室冷氣、確認點名表..." required></textarea>
                </div>
                <button type="submit" class="btn-add">＋ 新增至任務清單</button>
            </form>
        </div>
    </div>
</div>

<script>
    // 預設初始任務清單
    let tasks = [
        { id: 1, time: "13:30", category: "facility", desc: "開啟櫃台與教室冷氣、檢查多媒體設備", done: false, record: "未完成" },
        { id: 2, time: "16:00", category: "routine", desc: "確認各班點名表狀態並留意家長接送動態", done: false, record: "未完成" },
        { id: 3, time: "18:30", category: "urgent", desc: "影印國三數學複習考卷 40 份並分發至講義櫃", done: false, record: "未完成" },
        { id: 4, time: "21:30", category: "routine", desc: "清點現金收支、關閉所有電源與門窗上鎖", done: false, record: "未完成" }
    ];

    // 即時時鐘
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        
        checkTaskTime(`${hours}:${minutes}`);
    }
    setInterval(updateClock, 1000);

    // 渲染表格
    function renderTable() {
        const tbody = document.getElementById('taskTableBody');
        tbody.innerHTML = '';

        // 依時間排序
        tasks.sort((a, b) => a.time.localeCompare(b.time));

        tasks.forEach(task => {
            const tr = document.createElement('tr');
            if (task.done) tr.classList.add('done');
            
            let badgeClass = 'badge-routine';
            let badgeText = '例行行政';
            if (task.category === 'facility') { badgeClass = 'badge-facility'; badgeText = '環境設備'; }
            if (task.category === 'urgent') { badgeClass = 'badge-urgent'; badgeText = '主任交辦'; }

            tr.innerHTML = `
                <td><input type="checkbox" style="transform: scale(1.3);" ${task.done ? 'checked' : ''} onclick="toggleTask(${task.id}, this)"></td>
                <td><span class="task-time">${task.time}</span></td>
                <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                <td>${task.desc}</td>
                <td><span id="rec-${task.id}" class="timestamp ${task.isAlert ? 'time-alert' : ''}">${task.record}</span></td>
                <td><button class="btn-del" onclick="deleteTask(${task.id})">刪</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 新增任務
    function addNewTask(event) {
        event.preventDefault();
        const time = document.getElementById('taskTime').value;
        const category = document.getElementById('taskCategory').value;
        const desc = document.getElementById('taskDesc').value;

        const newTask = {
            id: Date.now(),
            time: time,
            category: category,
            desc: desc,
            done: false,
            record: "未完成",
            isAlert: false
        };

        tasks.push(newTask);
        renderTable();
        document.getElementById('taskDesc').value = ''; // 清空輸入框
    }

    // 勾選完成
    function toggleTask(id, checkbox) {
        const task = tasks.find(t => t.id === id);
        if (task) {
            task.done = checkbox.checked;
            if (task.done) {
                const now = new Date();
                const timeString = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
                task.record = `已完成 (${timeString})`;
                task.isAlert = false;
            } else {
                task.record = "未完成";
            }
            renderTable();
        }
    }

    // 刪除任務
    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        renderTable();
    }

    // 檢查時間是否逾時
    function checkTaskTime(currentHM) {
        let updated = false;
        tasks.forEach(task => {
            if (!task.done && currentHM >= task.time) {
                if (!task.isAlert) {
                    task.isAlert = true;
                    task.record = "⚠️ 時間已到，請執行！";
                    updated = true;
                }
            }
        });
        if (updated) renderTable();
    }

    // 初始化渲染
    renderTable();
</script>

</body>
</html>
