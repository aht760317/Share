<!-- Firebase 10.8.0 模組 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD9RSb0rQzuo0nELR6CvLE06jyktS8YI2s",
        authDomain: "my-project-9999-479215.firebaseapp.com",
        projectId: "my-project-9999-479215",
        storageBucket: "my-project-9999-479215.firebasestorage.app",
        messagingSenderId: "1020162825898",
        appId: "1:1020162825898:web:681a7825a197f34e713ad3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DIRECTOR_PASSWORD = "0000";
    let isDirectorUnlocked = false;

    let pendingConfirmation = {};

    const defaultGuidelines = {
        logRules: "每日課後 22:00 前 須完成當日各班進度、作業與聯絡簿登載。\n隔日 13:30 櫃台人員將覆核日誌並統一推播至家長端。\n若學員於課堂有特殊違紀、受傷或心理狀況，請主動通報櫃台登記於「安心橋」。",
        makeupRules: "任課老師上課 15 分鐘內落實點名，未到學生由櫃台立即電話聯繫家長。\n學員請假之補課安排，須於 3 日內 敲定輔導老師時段。\n補課完成後，輔導老師於系統直接勾選結案。"
    };

    let cachedGuidelines = { ...defaultGuidelines };

    const defaultTasks = [
        { id: "task_1", role: "counter", date: "fixed", time: "12:30", timeEnd: "", category: "clean", desc: "到補習班：打掃一樓公共區域、擦拭玻璃門窗、洗手間全面檢查與耗材補充", done: false, record: "未完成" },
        { id: "task_2", role: "counter", date: "fixed", time: "12:30", timeEnd: "13:20", category: "elem", desc: "打開官方 Line 統整放學接送名單，主動提醒老師接送國小部學生相關事項", done: false, record: "未完成" },
        { id: "task_3", role: "counter", date: "fixed", time: "13:30", timeEnd: "15:30", category: "cram", desc: "① 整理昨天學生出缺席資料，聯繫昨日補習課程未到同學通知安排補課<br>② 檢查昨日老師的日誌，尚未填寫日誌的老師主動提醒盡速補登<br>③ 老師日誌打了尚未傳出去先幫老師傳給家長", done: false, record: "未完成" },
        { id: "task_4", role: "counter", date: "fixed", time: "15:30", timeEnd: "15:50", category: "elem", desc: "再次查看官方 Line，核對並整理下午等等要接送的國小部學生名單", done: false, record: "未完成" },
        { id: "task_5", role: "counter", date: "fixed", time: "16:00", timeEnd: "16:30", category: "elem", desc: "提醒搭車上佳音英語的同學，並至大門口導護國小學生進班與出班動線", done: false, record: "未完成" },
        { id: "task_6", role: "counter", date: "fixed", time: "16:30", timeEnd: "16:50", category: "cram", desc: "訂餐、學生點名、通知各補習班老師點名、查詢未到同學趕快致電連絡", done: false, record: "未完成" },
        { id: "task_7", role: "counter", date: "fixed", time: "17:30", timeEnd: "", category: "clean", desc: "發餐：依照訂膳名冊發放學生晚餐，巡視用餐秩序與餐後桌面清潔", done: false, record: "未完成" },
        { id: "task_8", role: "teacher", date: "fixed", time: "18:15", timeEnd: "", category: "mid", desc: "國中生開始到班：確認教室設備與空調，提醒任課老師國中學生上課與點名", done: false, record: "未完成" },
        { id: "task_9", role: "teacher", date: "fixed", time: "18:30", timeEnd: "", category: "mid", desc: "國中各班任課老師正式點名：核對到班名冊與實際人數", done: false, record: "未完成" },
        { id: "task_10", role: "counter", date: "fixed", time: "18:45", timeEnd: "", category: "mid", desc: "國中部缺席追蹤：尚未到班同學必須打電話與 Line 詢問為什麼未到班", done: false, record: "未完成" }
    ];

    let cachedScheduleTasks = [];

    function getTodayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    const currentDateInput = document.getElementById('currentDate');
    currentDateInput.value = getTodayStr();

    async function saveScheduleCloud() {
        try {
            await setDoc(doc(db, "settings", "counterScheduleData"), { 
                tasks: cachedScheduleTasks,
                guidelines: cachedGuidelines
            });
        } catch (e) {
            console.error("雲端儲存失敗：", e);
        }
    }

    function initRealtimeSync() {
        const scheduleDocRef = doc(db, "settings", "counterScheduleData");
        onSnapshot(scheduleDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.tasks) {
                    cachedScheduleTasks = data.tasks.map(t => ({
                        ...t,
                        timeEnd: t.timeEnd || '',
                        role: t.role || 'counter',
                        category: t.category || 'elem'
                    }));
                }
                if (data.guidelines) {
                    cachedGuidelines = data.guidelines;
                }
            } else {
                cachedScheduleTasks = [...defaultTasks];
                cachedGuidelines = { ...defaultGuidelines };
                saveScheduleCloud();
            }
            renderAllViews();
        }, (error) => {
            console.error("即時監聽異常：", error);
        });
    }

    function renderAllViews() {
        renderCounterViews();
        renderTeacherViews();
        renderDirectorViews();
        renderGuidelinesView();
    }

    function renderGuidelinesView() {
        document.getElementById('displayLogRules').innerText = cachedGuidelines.logRules || defaultGuidelines.logRules;
        document.getElementById('displayMakeupRules').innerText = cachedGuidelines.makeupRules || defaultGuidelines.makeupRules;
    }

    function getThemeConfig(category) {
        if (category === 'mid') return { blockClass: 'block-mid', badgeClass: 'badge-mid', badgeText: '國中部' };
        if (category === 'cram') return { blockClass: 'block-cram', badgeClass: 'badge-cram', badgeText: '補習課程' };
        if (category === 'clean') return { blockClass: 'block-clean', badgeClass: 'badge-clean', badgeText: '環境清潔' };
        if (category === 'urgent') return { blockClass: 'block-urgent', badgeClass: 'badge-urgent', badgeText: '重要交辦' };
        return { blockClass: 'block-elem', badgeClass: 'badge-elem', badgeText: '國小部' };
    }

    function formatTaskTime(task) {
        if (task.timeEnd && task.timeEnd.trim() !== '') return `${task.time} - ${task.timeEnd}`;
        return task.time;
    }

    function renderCardSection(containerId, targetRole) {
        const selectedDate = currentDateInput.value;
        let currentTasks = cachedScheduleTasks.filter(t => (t.date === 'fixed' || t.date === selectedDate) && t.role === targetRole);
        currentTasks.sort((a, b) => a.time.localeCompare(b.time));

        const container = document.getElementById(containerId);
        container.innerHTML = '';

        if (currentTasks.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:25px; font-size:1rem;">當日無此對象排程任務。</div>`;
            return;
        }

        const isMobile = window.innerWidth <= 768;

        currentTasks.forEach(task => {
            const { blockClass, badgeClass, badgeText } = getThemeConfig(task.category);
            const fixedTag = task.date === 'fixed' ? '<span class="badge-fixed">固定</span>' : '';
            const displayTime = formatTaskTime(task);

            // 【修改核心】針對固定排程，依據「當前選擇的日期」讀取專屬狀態
            const isFixed = task.date === 'fixed';
            const dayData = (isFixed && task.history && task.history[selectedDate]) ? task.history[selectedDate] : null;
            
            const actualDone = isFixed ? (dayData ? dayData.done : false) : task.done;
            const actualRecord = isFixed ? (dayData ? dayData.record : '未完成') : (task.record || '未完成');
            const actualAlert = isFixed ? (dayData ? dayData.isAlert : false) : task.isAlert;

            const isPending = pendingConfirmation[task.id] !== undefined;
            const targetDoneState = isPending ? pendingConfirmation[task.id] : actualDone;

            const block = document.createElement('div');
            block.className = `task-block ${blockClass} ${actualDone ? 'is-done' : ''} ${actualAlert ? 'is-alert' : ''}`;
            
            let actionAreaHtml = '';
            if (isPending) {
                actionAreaHtml = `
                    <div class="confirm-actions">
                        <button class="btn-confirm" onclick="window.commitTask('${task.id}')">✓ 確定</button>
                        <button class="btn-cancel-action" onclick="window.cancelTaskPrompt('${task.id}')">✕ 取消</button>
                    </div>
                `;
            } else {
                actionAreaHtml = `<span class="task-status-text ${actualAlert ? 'time-alert' : ''}">${actualRecord}</span>`;
            }

            if (isMobile) {
                block.innerHTML = `
                    <div class="task-mobile-header">
                        <div style="display:flex; align-items:center; gap: 0.6rem;">
                            <input type="checkbox" class="huge-checkbox" ${targetDoneState ? 'checked' : ''} onchange="window.triggerTaskPrompt('${task.id}', this.checked)">
                            <span class="task-time-text">${displayTime}</span>
                        </div>
                        <div class="task-badge-wrap">
                            <span class="badge ${badgeClass}">${badgeText}</span>${fixedTag}
                        </div>
                    </div>
                    <div class="task-desc-text">${task.desc}</div>
                    <div class="task-status-side">
                        <span style="font-size:0.75rem; color:var(--text-muted);">${actualDone ? '狀態：已完成' : '狀態：待處理'}</span>
                        <div>${actionAreaHtml}</div>
                    </div>
                `;
            } else {
                block.innerHTML = `
                    <div class="task-check-side">
                        <input type="checkbox" class="huge-checkbox" ${targetDoneState ? 'checked' : ''} onchange="window.triggerTaskPrompt('${task.id}', this.checked)">
                    </div>
                    <div class="task-time-side">
                        <div class="task-time-text">${displayTime}</div>
                        <div class="task-badge-wrap">
                            <span class="badge ${badgeClass}">${badgeText}</span>${fixedTag}
                        </div>
                    </div>
                    <div class="task-content-side">
                        <div class="task-desc-text">${task.desc}</div>
                    </div>
                    <div class="task-status-side">
                        ${actionAreaHtml}
                    </div>
                `;
            }
            container.appendChild(block);
        });
    }

    function renderCounterViews() {
        document.getElementById('displayDateTitleCounter').textContent = currentDateInput.value;
        renderCardSection('counterCardContainer', 'counter');
    }

    function renderTeacherViews() {
        renderCardSection('teacherCardContainer', 'teacher');
    }

    window.triggerTaskPrompt = function(id, targetState) {
        pendingConfirmation[id] = targetState;
        renderCounterViews();
        renderTeacherViews();
    };

    window.commitTask = async function(id) {
        const isDone = pendingConfirmation[id];
        delete pendingConfirmation[id];

        const task = cachedScheduleTasks.find(t => t.id === id);
        if (task) {
            const now = new Date();
            const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const selectedDate = currentDateInput.value;
            const newRecord = isDone ? `已完成 (${timeString})` : "未完成";

            // 【修改核心】將固定任務的完成狀態存進專屬的日期紀錄(history)中
            if (task.date === 'fixed') {
                if (!task.history) task.history = {};
                task.history[selectedDate] = {
                    done: isDone,
                    record: newRecord,
                    isAlert: false
                };
            } else {
                task.done = isDone;
                task.record = newRecord;
                task.isAlert = false;
            }
            await saveScheduleCloud();
        }
    };

    window.cancelTaskPrompt = function(id) {
        delete pendingConfirmation[id];
        renderCounterViews();
        renderTeacherViews();
    };

    window.renderDirectorViews = function() {
        const selectedDate = currentDateInput.value;
        const filterRole = document.getElementById('filterDirectorRole') ? document.getElementById('filterDirectorRole').value : 'all';

        let currentTasks = cachedScheduleTasks.filter(t => (t.date === 'fixed' || t.date === selectedDate));
        if (filterRole !== 'all') {
            currentTasks = currentTasks.filter(t => t.role === filterRole);
        }
        currentTasks.sort((a, b) => a.time.localeCompare(b.time));

        const container = document.getElementById('directorCardContainer');
        container.innerHTML = '';

        if (currentTasks.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px; font-size: 0.95rem;">尚無設定排程。</div>`;
            return;
        }

        currentTasks.forEach(task => {
            const { blockClass, badgeClass, badgeText } = getThemeConfig(task.category);
            const roleBadge = task.role === 'teacher' 
                ? `<span class="badge badge-role-teacher">👩‍🏫 老師</span>` 
                : `<span class="badge badge-role-counter">🏫 櫃台</span>`;
            const displayTime = formatTaskTime(task);

            const block = document.createElement('div');
            block.className = `task-block ${blockClass}`;
            block.style.padding = '0.9rem 1.1rem';
            
            block.innerHTML = `
                <div class="task-time-side" style="min-width: 155px;">
                    <div class="task-time-text" style="font-size: 1.2rem;">${displayTime}</div>
                    <div class="task-badge-wrap">
                        ${roleBadge}
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <span class="badge badge-fixed">${task.date === 'fixed' ? '固定' : '單日'}</span>
                    </div>
                </div>
                <div class="task-content-side">
                    <div class="task-desc-text" style="font-size: 1.05rem;">${task.desc}</div>
                </div>
                <div style="flex-shrink: 0; display: flex; gap: 0.4rem; align-items: center;">
                    <button class="btn btn-warning" onclick="window.openEditModal('${task.id}')" style="padding: 0.35rem 0.65rem; font-size: 0.85rem;">✏️ 編輯</button>
                    <button class="btn btn-danger" onclick="window.deleteDirectorTask('${task.id}')" style="padding: 0.35rem 0.65rem; font-size: 0.85rem;">🗑️ 刪除</button>
                </div>
            `;
            container.appendChild(block);
        });
    };

    window.deleteDirectorTask = async function(id) {
        if (confirm("確定要刪除這筆 SOP 項目嗎？（畫面將即時同步移除）")) {
            cachedScheduleTasks = cachedScheduleTasks.filter(t => t.id !== id);
            await saveScheduleCloud();
        }
    };

    window.openEditModal = function(id) {
        const task = cachedScheduleTasks.find(t => t.id === id);
        if (!task) return;

        document.getElementById('editSopId').value = task.id;
        document.getElementById('editSopTime').value = task.time;
        document.getElementById('editSopTimeEnd').value = task.timeEnd || '';
        document.getElementById('editSopRole').value = task.role || 'counter';
        document.getElementById('editSopCategory').value = task.category || 'elem';
        document.getElementById('editIsFixedRoutine').checked = (task.date === 'fixed');
        document.getElementById('editSopDesc').value = task.desc.replace(/<br\s*[\/]?>/gi, '\n');

        document.getElementById('editSopModal').style.display = 'flex';
    };

    window.closeEditModal = function() {
        document.getElementById('editSopModal').style.display = 'none';
        document.getElementById('editSopForm').reset();
    };

    document.getElementById('editSopForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editSopId').value;
        const task = cachedScheduleTasks.find(t => t.id === id);
        if (!task) return;

        task.time = document.getElementById('editSopTime').value;
        task.timeEnd = document.getElementById('editSopTimeEnd').value;
        task.role = document.getElementById('editSopRole').value;
        task.category = document.getElementById('editSopCategory').value;
        task.date = document.getElementById('editIsFixedRoutine').checked ? 'fixed' : currentDateInput.value;
        task.desc = document.getElementById('editSopDesc').value.replace(/\n/g, '<br>');

        await saveScheduleCloud();
        closeEditModal();
        alert("✅ SOP 項目修改成功並已推播同步！");
    });

    window.openEditGuidelinesModal = function() {
        const pwd = prompt("🔒 請輸入主任權限驗證密碼：");
        if (pwd === null) return;
        if (pwd.trim() !== DIRECTOR_PASSWORD) {
            alert("❌ 密碼錯誤！");
            return;
        }
        document.getElementById('editLogRulesInput').value = cachedGuidelines.logRules || defaultGuidelines.logRules;
        document.getElementById('editMakeupRulesInput').value = cachedGuidelines.makeupRules || defaultGuidelines.makeupRules;
        document.getElementById('editGuidelinesModal').style.display = 'flex';
    };

    window.closeEditGuidelinesModal = function() {
        document.getElementById('editGuidelinesModal').style.display = 'none';
        document.getElementById('editGuidelinesForm').reset();
    };

    document.getElementById('editGuidelinesForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        cachedGuidelines.logRules = document.getElementById('editLogRulesInput').value.trim();
        cachedGuidelines.makeupRules = document.getElementById('editMakeupRulesInput').value.trim();
        await saveScheduleCloud();
        closeEditGuidelinesModal();
        renderGuidelinesView();
        alert("✅ 老師行政準則已成功儲存並同步！");
    });

    document.getElementById('directorTaskForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const time = document.getElementById('taskTime').value;
        const timeEnd = document.getElementById('taskTimeEnd').value;
        const role = document.getElementById('taskRole').value;
        const category = document.getElementById('taskCategory').value;
        const desc = document.getElementById('taskDesc').value.replace(/\n/g, '<br>');
        const isFixed = document.getElementById('isFixedRoutine').checked;
        const selectedDate = currentDateInput.value;

        const newTask = {
            id: 'task_' + Date.now(),
            role: role,
            date: isFixed ? 'fixed' : selectedDate,
            time: time,
            timeEnd: timeEnd,
            category: category,
            desc: desc,
            done: false,
            record: "未完成",
            isAlert: false
        };

        cachedScheduleTasks.push(newTask);
        await saveScheduleCloud();
        document.getElementById('taskDesc').value = '';
        document.getElementById('taskTimeEnd').value = '';
        alert("✅ 新排程已發布並同步推播！");
    });

    document.getElementById('btnResetDefault').addEventListener('click', async () => {
        if (confirm("確定要將所有排程重置回預設的標準 5 大分類 SOP 嗎？")) {
            cachedScheduleTasks = [...defaultTasks];
            cachedGuidelines = { ...defaultGuidelines };
            await saveScheduleCloud();
            alert("✅ 已成功重設！");
        }
    });

    window.switchMainTab = function(tabId, btnEl) {
        if (tabId === 'tabDirector' && !isDirectorUnlocked) {
            const pwd = prompt("🔒 此為主任私下專屬設定區，請輸入驗證密碼：");
            if (pwd === null) return;
            if (pwd.trim() === DIRECTOR_PASSWORD) {
                isDirectorUnlocked = true;
            } else {
                alert("❌ 密碼錯誤！");
                return;
            }
        }
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btnEl.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    currentDateInput.addEventListener('change', renderAllViews);
    window.addEventListener('resize', () => { renderCounterViews(); renderTeacherViews(); });

    function checkTaskTimeBackground() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const currentHM = `${hours}:${minutes}`;

        const selectedDate = currentDateInput.value;
        if (selectedDate !== getTodayStr()) return;

        let updated = false;
        cachedScheduleTasks.forEach(task => {
            const targetTriggerTime = (task.timeEnd && task.timeEnd.trim() !== '') ? task.timeEnd : task.time;
            
            // 【修改核心】背景定時檢查時，也需要分日期驗證
            const isFixed = task.date === 'fixed';
            const dayData = (isFixed && task.history && task.history[selectedDate]) ? task.history[selectedDate] : null;
            const actualDone = isFixed ? (dayData ? dayData.done : false) : task.done;
            const actualAlert = isFixed ? (dayData ? dayData.isAlert : false) : task.isAlert;

            if ((task.date === 'fixed' || task.date === selectedDate) && !actualDone && currentHM >= targetTriggerTime) {
                if (!actualAlert) {
                    if (isFixed) {
                        if (!task.history) task.history = {};
                        if (!task.history[selectedDate]) {
                            task.history[selectedDate] = { done: false, record: "未完成", isAlert: false };
                        }
                        task.history[selectedDate].isAlert = true;
                        task.history[selectedDate].record = "⚠️ 時間已到，請執行！";
                    } else {
                        task.isAlert = true;
                        task.record = "⚠️ 時間已到，請執行！";
                    }
                    updated = true;
                }
            }
        });

        if (updated) {
            renderCounterViews();
            renderTeacherViews();
        }
    }
    setInterval(checkTaskTimeBackground, 5000);

    initRealtimeSync();
</script>
