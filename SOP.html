<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>補習班櫃台時段任務與提醒系統</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .current-time { font-size: 22px; font-weight: bold; color: #2c3e50; }
        .section-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2 { font-size: 18px; color: #2980b9; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 15px; }
        th { background-color: #f8f9fa; color: #555; }
        .done { text-decoration: line-through; color: #95a5a6; background-color: #f9f9f9; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-routine { background-color: #e8f4fd; color: #3498db; }
        .badge-urgent { background-color: #fadbd8; color: #c0392b; }
        .btn { background-color: #3498db; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:hover { background-color: #2980b9; }
        .timestamp { font-size: 13px; color: #7f8c8d; }
        /* 時間快到或超過時的閃爍提醒樣式 */
        .time-alert { color: #c0392b; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div>
            <h1 style="margin: 0; font-size: 20px; color: #2c3e50;">🔔 櫃台時段工作與提醒看板</h1>
        </div>
        <div class="current-time" id="clock">00:00:00</div>
    </div>

    <div class="section-box">
        <h2>
            <span>今日櫃台時段任務清單</span>
            <button class="btn" onclick="addNewTask()">＋ 主任新增交辦事項</button>
        </h2>
        <table>
            <thead>
                <tr>
                    <th width="60">完成</th>
                    <th width="100">預定時間</th>
                    <th width="100">類別</th>
                    <th>任務內容與細節說明</th>
                    <th width="180">執行紀錄</th>
                </tr>
            </thead>
            <tbody id="taskTable">
                <!-- 預設範例任務 -->
                <tr id="task-1" data-time="13:30">
                    <td><input type="checkbox" style="transform: scale(1.3);" onclick="toggleTask(this, 'time-1')"></td>
                    <td><span class="task-time">13:30</span></td>
                    <td><span class="badge badge-routine">環境設備</span></td>
                    <td>開啟櫃台與教室冷氣、檢查多媒體投影機與麥克風是否正常</td>
                    <td><span id="time-1" class="timestamp">未完成</span></td>
                </tr>
                <tr id="task-2" data-time="16:00">
                    <td><input type="checkbox" style="transform: scale(1.3);" onclick="toggleTask(this, 'time-2')"></td>
                    <td><span class="task-time">16:00</span></td>
                    <td><span class="badge badge-routine">行政作業</span></td>
                    <td>準備下午班教材、確認各班點名表狀態並留意家長接送動態</td>
                    <td><span id="time-2" class="timestamp">未完成</span></td>
                </tr>
                <tr id="task-3" data-time="18:30">
                    <td><input type="checkbox" style="transform: scale(1.3);" onclick="toggleTask(this, 'time-3')"></td>
                    <td><span class="task-time">18:30</span></td>
                    <td><span class="badge badge-urgent">主任交辦</span></td>
                    <td>影印國三數學複習考卷 40 份並分發至各班講義櫃</td>
                    <td><span id="time-3" class="timestamp">未完成</span></td>
                </tr>
                <tr id="task-4" data-time="21:30">
                    <td><input type="checkbox" style="transform: scale(1.3);" onclick="toggleTask(this, 'time-4')"></td>
                    <td><span class="task-time">21:30</span></td>
                    <td><span class="badge badge-routine">結帳交接</span></td>
                    <td>清點當日現金收支、關閉所有教室電源與冷氣、巡視門窗並鎖門</td>
                    <td><span id="time-4" class="timestamp">未完成</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. 即時時鐘更新
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const currentTimeStr = `${hours}:${minutes}:${seconds}`;
        const currentHM = `${hours}:${minutes}`;
        
        document.getElementById('clock').textContent = currentTimeStr;

        // 檢查是否有任務時間已到但尚未完成
        checkTaskTime(currentHM);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 勾選任務完成與記錄時間
    function toggleTask(checkbox, timeId) {
        const row = checkbox.closest('tr');
        const timeSpan = document.getElementById(timeId);
        
        if (checkbox.checked) {
            row.classList.add('done');
            const now = new Date();
            const timeString = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            timeSpan.textContent = `已完成 (${timeString})`;
            timeSpan.classList.remove('time-alert');
        } else {
            row.classList.remove('done');
            timeSpan.textContent = '未完成';
        }
    }

    // 3. 時間比對提醒（當前時間大於或等於預定時間，且未打勾時閃爍提醒）
    function checkTaskTime(currentHM) {
        const rows = document.querySelectorAll('#taskTable tr');
        rows.forEach(row => {
            const checkbox = row.querySelector('input[type="checkbox"]');
            const timeSpanElement = row.querySelector('.task-time');
            const taskTime = row.getAttribute('data-time');
            const recordSpan = row.querySelector('.timestamp');

            if (checkbox && !checkbox.checked && taskTime) {
                if (currentHM >= taskTime) {
                    timeSpanElement.classList.add('time-alert');
                    if (recordSpan.textContent === '未完成') {
                        recordSpan.textContent = '⚠️ 時間已到，請執行！';
                        recordSpan.classList.add('time-alert');
                    }
                }
            }
        });
    }

    // 4. 主任新增交辦事項
    function addNewTask() {
        const taskContent = prompt("請輸入主任交辦事項內容：");
        const taskTime = prompt("請輸入預定執行時間（格式 HH:MM，例如 19:00）：", "18:00");
        
        if (taskContent && taskTime) {
            const tbody = document.getElementById('taskTable');
            const index = tbody.children.length + 1;
            const newRowId = 'task-' + index;
            const timeSpanId = 'time-' + index;
            
            const newRow = document.createElement('tr');
            newRow.id = newRowId;
            newRow.setAttribute('data-time', taskTime);
            newRow.innerHTML = `
                <td><input type="checkbox" style="transform: scale(1.3);" onclick="toggleTask(this, '${timeSpanId}')"></td>
                <td><span class="task-time">${taskTime}</span></td>
                <td><span class="badge badge-urgent">主任交辦</span></td>
                <td>${taskContent}</td>
                <td><span id="${timeSpanId}" class="timestamp">未完成</span></td>
            `;
            tbody.appendChild(newRow);
        }
    }
</script>

</body>
</html>
