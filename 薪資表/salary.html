<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薪資明細輸入與列印系統</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background-color: #555;
            margin: 0;
            padding: 20px;
        }
        .payslip-container {
            width: 700px;
            margin: 0 auto 30px auto;
            background: #ffffff;
            border: 2px solid #000;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .header-title {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            background-color: #ffff00;
            border: 1px solid #000;
            padding: 5px;
            margin-bottom: 5px;
        }
        .sub-header {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            border: 1px solid #000;
            border-top: none;
            font-size: 0.95em;
            align-items: center;
        }
        table.slip-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            font-size: 0.9em;
        }
        table.slip-table th, table.slip-table td {
            border: 1px solid #000;
            padding: 4px 6px;
            text-align: left;
        }
        .section-tag {
            background-color: #ffff00;
            text-align: center;
            font-weight: bold;
            width: 30px;
        }
        .text-right {
            text-align: right;
        }
        .text-center {
            text-align: center;
        }
        /* 讓輸入框融入表格外觀 */
        input[type="text"], input[type="number"] {
            width: 100%;
            border: 1px dashed #ccc;
            background-color: #fffdf0;
            padding: 2px 4px;
            font-family: inherit;
            font-size: inherit;
            box-sizing: border-box;
        }
        input[type="number"] {
            text-align: right;
        }
        input:focus {
            background-color: #fff;
            border: 1px solid #007BFF;
            outline: none;
        }
        .signature-section {
            border: 1px solid #000;
            border-top: none;
            padding: 20px 10px;
            text-align: center;
            font-weight: bold;
        }
        .print-btn-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .print-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 25px;
            font-size: 1.1em;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .print-btn:hover {
            background-color: #45a049;
        }
        @media print {
            body {
                background-color: #fff;
                padding: 0;
            }
            .payslip-container {
                border: 1px solid #000;
                box-shadow: none;
                margin: 0;
            }
            .print-btn-container {
                display: none;
            }
            /* 列印時隱藏輸入框邊框，看起來像純文字 */
            input {
                border: none !important;
                background: transparent !important;
                appearance: none;
            }
        }
    </style>
</head>
<body>

    <div class="payslip-container">
        <!-- 機構與日期 -->
        <div class="header-title">
            <input type="text" id="机构名称" value="顧德文教機構" style="text-align: center; font-weight: bold; font-size: 1.1em; width: 200px;">
        </div>
        <div class="sub-header">
            <span>姓名：<input type="text" id="教师姓名" value="陳怡芳" style="width: 90px;"></span>
            <span>日期：<input type="text" id="列印日期" value="112年5月10日" style="width: 110px;"></span>
        </div>
        <div class="sub-header" style="border-top: none;">
            <span>今年累計請假：<input type="text" id="累计请假" value="婚假: 事假:" style="width: 130px;"></span>
            <span><input type="text" id="薪资月份标题" value="112年4月份薪俸明細表" style="width: 160px; text-align: right;"></span>
        </div>

        <!-- 薪資明細表格 -->
        <table class="slip-table">
            <tr>
                <td colspan="2">遲到: <input type="text" value="" style="width: 40px;"> 分, 無打卡: <input type="text" value="" style="width: 40px;"></td>
                <td colspan="2">到職日：<input type="text" value="103/7/1" style="width: 90px;"></td>
            </tr>
            <tr>
                <td rowspan="12" class="section-tag">薪轉</td>
                <td>本薪</td>
                <td class="text-right" colspan="2"><input type="number" id="base-salary" value="26400" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>勞健保</td>
                <td colspan="2" class="text-center"><input type="text" value="5月(個人負擔)" style="text-align: center;"></td>
            </tr>
            <tr>
                <td>勞保(-)</td>
                <td class="text-right">公司 <input type="number" id="comp-labor" value="2218" style="width: 70px;" oninput="calculate()"></td>
                <td class="text-right"><input type="number" id="labor-fee" value="634" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>健保(-)</td>
                <td class="text-right">公司 <input type="number" id="comp-health" value="1286" style="width: 70px;" oninput="calculate()"></td>
                <td class="text-right"><input type="number" id="health-fee" value="409" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>福利金(-)</td>
                <td class="text-right" colspan="2"><input type="text" value="職保 53"></td>
            </tr>
            <tr>
                <td>勞退金</td>
                <td class="text-right" colspan="2">公司 <input type="number" value="1584" style="width: 80px;"></td>
            </tr>
            <tr>
                <td>其它(-)</td>
                <td class="text-right"><input type="text" value="眷屬(1位)"></td>
                <td class="text-right"><input type="number" id="other-deduct" value="205" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>應領金額 (扣除後)</td>
                <td class="text-right" id="deduct-subtotal" colspan="2">4548</td>
                <td class="text-right" id="net-salary" style="font-weight: bold;">25152</td>
            </tr>
            <tr>
                <td colspan="3" style="background-color: #f9f9f9; font-weight: bold;">加給金額</td>
            </tr>
            <tr>
                <td>年資津貼</td>
                <td class="text-right" colspan="2"><input type="number" id="allowance-seniority" value="0" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>其它加給</td>
                <td class="text-right" colspan="2"><input type="number" id="allowance-other" value="2600" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>特殊加給</td>
                <td class="text-right" colspan="2"><input type="number" id="allowance-special" value="1000" oninput="calculate()"></td>
            </tr>
            <!-- 授課細節 -->
            <tr>
                <td class="text-center">班級名稱</td>
                <td class="text-center">人數</td>
                <td class="text-center">授課/帶班</td>
                <td class="text-center">堂數</td>
            </tr>
            <tr>
                <td><input type="text" value="數學課"></td>
                <td><input type="text" value=""></td>
                <td class="text-right">看班 <input type="number" id="class-pay" value="2000" style="width: 80px;" oninput="calculate()"></td>
                <td><input type="text" value=""></td>
            </tr>
            <!-- 勞健保投保級距對照區 -->
            <tr>
                <td colspan="2" style="background-color: #ffff00;">勞健保 個人負擔</td>
                <td colspan="2" style="background-color: #ffff00;" class="text-right"><input type="number" value="973" style="width: 80px; background: transparent;"></td>
            </tr>
            <tr>
                <td colspan="2" style="background-color: #ffff00;">勞健保 公司負擔</td>
                <td colspan="2" style="background-color: #ffff00;" class="text-right"><input type="number" value="5141" style="width: 80px; background: transparent;"></td>
            </tr>
            <tr>
                <td>應領金額 (加給後)</td>
                <td colspan="3" class="text-right" id="subtotal-add" style="font-weight: bold;">30000</td>
            </tr>
            <tr>
                <td>總領金額</td>
                <td colspan="3" class="text-right" id="total-final" style="font-weight: bold; color: #d9534f; font-size: 1.1em;">35000</td>
            </tr>
        </table>

        <!-- 簽章區 -->
        <div class="signature-section">
            領款人簽章：
        </div>
    </div>

    <!-- 列印按鈕 -->
    <div class="print-btn-container">
        <button class="print-btn" onclick="window.print()">列印此薪資明細表</button>
    </div>

<script>
    function calculate() {
        // 取得各項數值
        let baseSalary = parseFloat(document.getElementById('base-salary').value) || 0;
        let laborFee = parseFloat(document.getElementById('labor-fee').value) || 0;
        let healthFee = parseFloat(document.getElementById('health-fee').value) || 0;
        let otherDeduct = parseFloat(document.getElementById('other-deduct').value) || 0;

        let seniority = parseFloat(document.getElementById('allowance-seniority').value) || 0;
        let otherAllow = parseFloat(document.getElementById('allowance-other').value) || 0;
        let specialAllow = parseFloat(document.getElementById('allowance-special').value) || 0;
        let classPay = parseFloat(document.getElementById('class-pay').value) || 0;

        // 計算扣除總計 (勞保 + 健保 + 其它)
        let totalDeduct = laborFee + healthFee + otherDeduct;
        
        // 本薪扣除後金額
        let netSalary = baseSalary - totalDeduct;

        // 加給總金額
        let totalAllowances = seniority + otherAllow + specialAllow + classPay;

        // 總領金額 (本薪淨額 + 各項加給)
        let finalTotal = netSalary + totalAllowances;

        // 寫回畫面上
        document.getElementById('deduct-subtotal').innerText = totalDeduct;
        document.getElementById('net-salary').innerText = netSalary;
        document.getElementById('subtotal-add').innerText = totalAllowances + baseSalary; // 對應原本表格邏輯
        document.getElementById('total-final').innerText = finalTotal;
    }

    // 畫面載入時先計算一次
    window.onload = calculate;
</script>

</body>
</html>
