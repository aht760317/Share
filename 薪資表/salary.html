<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多機構與多教師薪資管理系統</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background-color: #444;
            margin: 0;
            padding: 20px;
        }
        /* 管理控制面板樣式 */
        .control-panel {
            max-width: 700px;
            margin: 0 auto 20px auto;
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 150px;
        }
        .control-group label {
            font-weight: bold;
            font-size: 0.9em;
            color: #333;
        }
        .control-group select {
            padding: 6px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* 薪資條主體樣式 */
        .payslip-container {
            width: 700px;
            margin: 0 auto 30px auto;
            background: #ffffff;
            border: 2px solid #000;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .header-title {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            background-color: #ffff00;
            border: 1px solid #000;
            padding: 5px;
            margin-bottom: 5px;
        }
        .sub-header {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            border: 1px solid #000;
            border-top: none;
            font-size: 0.95em;
            align-items: center;
        }
        table.slip-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            font-size: 0.9em;
        }
        table.slip-table th, table.slip-table td {
            border: 1px solid #000;
            padding: 4px 6px;
            text-align: left;
        }
        .section-tag {
            background-color: #ffff00;
            text-align: center;
            font-weight: bold;
            width: 30px;
        }
        .text-right {
            text-align: right;
        }
        .text-center {
            text-align: center;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            border: 1px dashed #ccc;
            background-color: #fffdf0;
            padding: 2px 4px;
            font-family: inherit;
            font-size: inherit;
            box-sizing: border-box;
        }
        input[type="number"] {
            text-align: right;
        }
        input:focus {
            background-color: #fff;
            border: 1px solid #007BFF;
            outline: none;
        }
        .signature-section {
            border: 1px solid #000;
            border-top: none;
            padding: 20px 10px;
            text-align: center;
            font-weight: bold;
        }
        .print-btn-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .print-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 25px;
            font-size: 1.1em;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .print-btn:hover {
            background-color: #45a049;
        }
        @media print {
            body {
                background-color: #fff;
                padding: 0;
            }
            .control-panel, .print-btn-container {
                display: none;
            }
            .payslip-container {
                border: 1px solid #000;
                box-shadow: none;
                margin: 0;
            }
            input {
                border: none !important;
                background: transparent !important;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部切換控制台 -->
    <div class="control-panel">
        <div class="control-group">
            <label>選擇機構：</label>
            <select id="select-inst" onchange="loadTeacherData()">
                <option value="顧德文教機構">顧德文教機構</option>
                <option value="冠抑文教有限公司">冠抑文教有限公司</option>
            </select>
        </div>
        <div class="control-group">
            <label>選擇月份：</label>
            <select id="select-month" onchange="loadTeacherData()">
                <option value="112年4月">112年4月</option>
                <option value="112年5月">112年5月</option>
                <option value="112年6月">112年6月</option>
            </select>
        </div>
        <div class="control-group">
            <label>選擇老師：</label>
            <select id="select-teacher" onchange="loadTeacherData()">
                <option value="陳怡芳">陳怡芳</option>
                <option value="林孟柔">林孟柔</option>
                <option value="張雅婷">張雅婷</option>
            </select>
        </div>
    </div>

    <!-- 薪資條主體 -->
    <div class="payslip-container">
        <div class="header-title">
            <input type="text" id="field-inst" value="顧德文教機構" style="text-align: center; font-weight: bold; font-size: 1.1em; width: 200px;">
        </div>
        <div class="sub-header">
            <span>姓名：<input type="text" id="field-name" value="陳怡芳" style="width: 90px;"></span>
            <span>日期：<input type="text" id="field-date" value="112年5月10日" style="width: 110px;"></span>
        </div>
        <div class="sub-header" style="border-top: none;">
            <span>今年累計請假：<input type="text" id="field-leave" value="婚假: 事假:" style="width: 130px;"></span>
            <span><input type="text" id="field-title" value="112年4月份薪俸明細表" style="width: 160px; text-align: right;"></span>
        </div>

        <table class="slip-table">
            <tr>
                <td colspan="2">遲到: <input type="text" id="field-late" value="" style="width: 40px;"> 分, 無打卡: <input type="text" id="field-nocard" value="" style="width: 40px;"></td>
                <td colspan="2">到職日：<input type="text" id="field-hiredate" value="103/7/1" style="width: 90px;"></td>
            </tr>
            <tr>
                <td rowspan="12" class="section-tag">薪轉</td>
                <td>本薪</td>
                <td class="text-right" colspan="2"><input type="number" id="base-salary" value="26400" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>勞健保</td>
                <td colspan="2" class="text-center"><input type="text" id="field-ins-desc" value="5月(個人負擔)" style="text-align: center;"></td>
            </tr>
            <tr>
                <td>勞保(-)</td>
                <td class="text-right">公司 <input type="number" id="comp-labor" value="2218" style="width: 70px;" oninput="calculate()"></td>
                <td class="text-right"><input type="number" id="labor-fee" value="634" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>健保(-)</td>
                <td class="text-right">公司 <input type="number" id="comp-health" value="1286" style="width: 70px;" oninput="calculate()"></td>
                <td class="text-right"><input type="number" id="health-fee" value="409" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>福利金(-)</td>
                <td class="text-right" colspan="2"><input type="text" id="field-welfare" value="職保 53"></td>
            </tr>
            <tr>
                <td>勞退金</td>
                <td class="text-right" colspan="2">公司 <input type="number" id="comp-pension" value="1584" style="width: 80px;"></td>
            </tr>
            <tr>
                <td>其它(-)</td>
                <td class="text-right"><input type="text" id="field-other-desc" value="眷屬(1位)"></td>
                <td class="text-right"><input type="number" id="other-deduct" value="205" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>應領金額 (扣除後)</td>
                <td class="text-right" id="deduct-subtotal" colspan="2">4548</td>
                <td class="text-right" id="net-salary" style="font-weight: bold;">25152</td>
            </tr>
            <tr>
                <td colspan="3" style="background-color: #f9f9f9; font-weight: bold;">加給金額</td>
            </tr>
            <tr>
                <td>年資津貼</td>
                <td class="text-right" colspan="2"><input type="number" id="allowance-seniority" value="0" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>其它加給</td>
                <td class="text-right" colspan="2"><input type="number" id="allowance-other" value="2600" oninput="calculate()"></td>
            </tr>
            <tr>
                <td>特殊加給</td>
                <td class="text-right" colspan="2"><input type="number" id="allowance-special" value="1000" oninput="calculate()"></td>
            </tr>
            <tr>
                <td class="text-center">班級名稱</td>
                <td class="text-center">人數</td>
                <td class="text-center">授課/帶班</td>
                <td class="text-center">堂數</td>
            </tr>
            <tr>
                <td><input type="text" id="class-name" value="數學課"></td>
                <td><input type="text" id="class-people" value=""></td>
                <td class="text-right">看班 <input type="number" id="class-pay" value="2000" style="width: 80px;" oninput="calculate()"></td>
                <td><input type="text" id="class-hours" value=""></td>
            </tr>
            <tr>
                <td colspan="2" style="background-color: #ffff00;">勞健保 個人負擔</td>
                <td colspan="2" style="background-color: #ffff00;" class="text-right"><input type="number" id="sum-personal-ins" value="973" style="width: 80px; background: transparent;"></td>
            </tr>
            <tr>
                <td colspan="2" style="background-color: #ffff00;">勞健保 公司負擔</td>
                <td colspan="2" style="background-color: #ffff00;" class="text-right"><input type="number" id="sum-company-ins" value="5141" style="width: 80px; background: transparent;"></td>
            </tr>
            <tr>
                <td>應領金額 (加給後)</td>
                <td colspan="3" class="text-right" id="subtotal-add" style="font-weight: bold;">30000</td>
            </tr>
            <tr>
                <td>總領金額</td>
                <td colspan="3" class="text-right" id="total-final" style="font-weight: bold; color: #d9534f; font-size: 1.1em;">35000</td>
            </tr>
        </table>

        <div class="signature-section">
            領款人簽章：
        </div>
    </div>

    <div class="print-btn-container">
        <button class="print-btn" onclick="window.print()">列印此薪資明細表</button>
    </div>

<script>
    // 模擬內建資料庫（你可以隨時在這裡增加不同老師、不同月份的預設數值）
    const salaryDatabase = {
        "陳怡芳": {
            "112年4月": { base: 26400, labor: 634, health: 409, compLabor: 2218, compHealth: 1286, other: 205, otherDesc: "眷屬(1位)", otherAllow: 2600, specialAllow: 1000, classPay: 2000, hireDate: "103/7/1" },
            "112年5月": { base: 26400, labor: 634, health: 409, compLabor: 2218, compHealth: 1286, other: 0, otherDesc: "", otherAllow: 3000, specialAllow: 1000, classPay: 2200, hireDate: "103/7/1" },
            "112年6月": { base: 27000, labor: 650, health: 420, compLabor: 2300, compHealth: 1300, other: 0, otherDesc: "", otherAllow: 2600, specialAllow: 1200, classPay: 2000, hireDate: "103/7/1" }
        },
        "林孟柔": {
            "112年4月": { base: 26400, labor: 634, health: 409, compLabor: 2218, compHealth: 1286, other: 0, otherDesc: "", otherAllow: 1000, specialAllow: 2600, classPay: 5000, hireDate: "108/08/01" },
            "112年5月": { base: 26400, labor: 634, health: 409, compLabor: 2218, compHealth: 1286, other: 0, otherDesc: "", otherAllow: 1500, specialAllow: 2600, classPay: 4500, hireDate: "108/08/01" },
            "112年6月": { base: 26400, labor: 634, health: 409, compLabor: 2218, compHealth: 1286, other: 0, otherDesc: "", otherAllow: 1000, specialAllow: 2600, classPay: 5000, hireDate: "108/08/01" }
        },
        "張雅婷": {
            "112年4月": { base: 25000, labor: 600, health: 390, compLabor: 2100, compHealth: 1200, other: 0, otherDesc: "", otherAllow: 2000, specialAllow: 500, classPay: 1800, hireDate: "110/02/15" },
            "112年5月": { base: 25000, labor: 600, health: 390, compLabor: 2100, compHealth: 1200, other: 0, otherDesc: "", otherAllow: 2000, specialAllow: 500, classPay: 1800, hireDate: "110/02/15" },
            "112年6月": { base: 25000, labor: 600, health: 390, compLabor: 2100, compHealth: 1200, other: 0, otherDesc: "", otherAllow: 2200, specialAllow: 500, classPay: 2000, hireDate: "110/02/15" }
        }
    };

    function loadTeacherData() {
        let inst = document.getElementById('select-inst').value;
        let month = document.getElementById('select-month').value;
        let teacher = document.getElementById('select-teacher').value;

        // 填入上方標題
        document.getElementById('field-inst').value = inst;
        document.getElementById('field-name').value = teacher;
        document.getElementById('field-date').value = month + "10日";
        document.getElementById('field-title').value = month + "薪俸明細表";

        // 取得對應資料庫數值
        if (salaryDatabase[teacher] && salaryDatabase[teacher][month]) {
            let data = salaryDatabase[teacher][month];
            document.getElementById('base-salary').value = data.base;
            document.getElementById('labor-fee').value = data.labor;
            document.getElementById('health-fee').value = data.health;
            document.getElementById('comp-labor').value = data.compLabor;
            document.getElementById('comp-health').value = data.compHealth;
            document.getElementById('other-deduct').value = data.other;
            document.getElementById('field-other-desc').value = data.otherDesc;
            document.getElementById('allowance-other').value = data.otherAllow;
            document.getElementById('allowance-special').value = data.specialAllow;
            document.getElementById('class-pay').value = data.classPay;
            document.getElementById('field-hiredate').value = data.hireDate;

            // 連動勞健保個人/公司加總
            document.getElementById('sum-personal-ins').value = data.labor + data.health;
            document.getElementById('sum-company-ins').value = data.compLabor + data.compHealth;
        }

        calculate();
    }

    function calculate() {
        let baseSalary = parseFloat(document.getElementById('base-salary').value) || 0;
        let laborFee = parseFloat(document.getElementById('labor-fee').value) || 0;
        let healthFee = parseFloat(document.getElementById('health-fee').value) || 0;
        let otherDeduct = parseFloat(document.getElementById('other-deduct').value) || 0;

        let seniority = parseFloat(document.getElementById('allowance-seniority').value) || 0;
        let otherAllow = parseFloat(document.getElementById('allowance-other').value) || 0;
        let specialAllow = parseFloat(document.getElementById('allowance-special').value) || 0;
        let classPay = parseFloat(document.getElementById('class-pay').value) || 0;

        // 扣除總計
        let totalDeduct = laborFee + healthFee + otherDeduct;
        let netSalary = baseSalary - totalDeduct;

        // 加給總金額
        let totalAllowances = seniority + otherAllow + specialAllow + classPay;

        // 總領金額
        let finalTotal = netSalary + totalAllowances;

        document.getElementById('deduct-subtotal').innerText = totalDeduct;
        document.getElementById('net-salary').innerText = netSalary;
        document.getElementById('subtotal-add').innerText = totalAllowances + baseSalary;
        document.getElementById('total-final').innerText = finalTotal;
    }

    window.onload = loadTeacherData;
</script>

</body>
</html>
