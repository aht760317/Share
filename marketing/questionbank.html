<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>斗六顧德補習班 - 雲端題庫資料中心 (questionbank.html)</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --success: #059669;
            --warning: #d97706;
            --bg: #f8fafc;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; background: var(--bg); color: var(--primary); font-size: 15px; padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { 
            background: linear-gradient(135deg, #020617 0%, #1e293b 100%); color: white; padding: 20px; 
            border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }
        header h2 { margin: 0; font-size: 20px; }
        .card { background: white; padding: 25px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 20px; border: 1px solid var(--border); }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: var(--primary); font-size: 14px; }
        select, input[type="text"], textarea {
            width: 100%; padding: 12px; margin-bottom: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: #fff; outline: none;
        }
        select:focus, input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; width: 100%; transition: 0.2s; text-align: center; }
        .btn:active { transform: scale(0.98); }
        .btn-success { background: var(--success); box-shadow: 0 2px 5px rgba(5,150,105,0.2); }
        .bank-preview-box { background: #f1f5f9; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; max-height: 200px; overflow-y: auto; margin-top: 15px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>📚 斗六顧德補習班 ｜ 雲端題庫資料中心 (questionbank.html)</h2>
            <a href="teacher.html" style="color: #38bdf8; text-decoration: none; font-weight: bold; font-size: 14px;">⬅️ 返回學生測驗主系統 (teacher.html)</a>
        </header>

        <div class="card">
            <h3 style="margin-top:0; color:var(--primary); border-left: 4px solid var(--accent); padding-left: 10px;">
                ☁️ 一鍵同步題庫至 Firebase 雲端
            </h3>
            <p style="color: #64748b; font-size: 14px; line-height: 1.6;">
                這裡存放了所有學生測驗專用的題庫。當你在此頁面修改或點擊下方按鈕後，題庫會立刻同步上傳至雲端資料庫。作答系統（<code>teacher.html</code>）會自動抓取這裡的最新題目，完全不需重新編譯主程式！
            </p>

            <div style="margin: 20px 0;">
                <label>選擇要上傳的題庫檔案區段：</label>
                <select id="bank-target-select">
                    <option value="math_g1_a">【國小一年級】上學期核心學力鑑測 A卷 (40題)</option>
                    <option value="math_g1_b">【國小一年級】下學期進階學力鑑測 B卷 (40題)</option>
                </select>
            </div>

            <button class="btn btn-success" style="padding: 16px; font-size: 16px;" onclick="uploadSelectedBankToCloud()">
                🚀 立即將此題庫寫入 Firebase 雲端
            </button>

            <div class="bank-preview-box" id="preview-box">
                👉 點擊上方按鈕或切換選單即可預覽目前載入的題庫資料結構...
            </div>
        </div>
    </div>

    <!-- Firebase 邏輯與題庫資料模組 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9RSb0rQzuo0nELR6CvLE06jyktS8YI2s",
            authDomain: "my-project-9999-479215.firebaseapp.com",
            projectId: "my-project-9999-479215",
            storageBucket: "my-project-9999-479215.firebasestorage.app",
            messagingSenderId: "1020162825898",
            appId: "1:1020162825898:web:681a7825a197f34e713ad3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 📦 完整題庫資料庫 (你可以直接在這篇檔案裡面維護、新增、修改題目)
        const MASTER_QUESTION_BANKS = {
            "math_g1_a": {
                name: "一年級上學期核心學力鑑測 A卷",
                subject: "數學",
                questions: [
                    { q: "1. 盤子裡有 7 顆蘋果，再放進 0 顆，盤子裡現在有幾顆蘋果？", options: ["0 顆", "7 顆", "8 顆", "17 顆"], ans: 1, tag: "基礎數數與大小", advice: "任何數加上0，數量都不會改變喔！" },
                    { q: "2. 算式「3 + 5 = 8」中，數字「8」叫做什麼？", options: ["被加數", "加數", "和", "差"], ans: 2, tag: "加減法觀念", advice: "加法算出來的結果我們稱為「和」。" },
                    { q: "3. 從 1 數到 10，「6」後面的第一個數字是哪一個？", options: ["5", "7", "8", "9"], ans: 1, tag: "基礎數數與大小", advice: "數數的順序：5、6、7，6的後面是7。" },
                    { q: "4. 小華有 9 枝鉛筆，送給同學 4 枝後，還剩下幾枝？", options: ["5 枝", "13 枝", "4 枝", "6 枝"], ans: 0, tag: "文字情境題", advice: "「送給」代表變少，要使用減法 (9-4)。" },
                    { q: "5. 全新鉛筆、橡皮擦和長吸管相比，哪一個通常「最長」？", options: ["橡皮擦", "全新鉛筆", "吸管", "一樣長"], ans: 2, tag: "長度與測量", advice: "生活物品的長度比較，吸管通常比鉛筆長。" }
                    // 之後如果要加到 40 題，直接在這裡繼續往下寫即可！
                ],
                practicePool: {
                    "基礎數數與大小": [{ q: "【加強題】3 個十和 2 個一合起來是多少？", options: ["5", "23", "32", "302"], ans: 2, exp: "十位放3，個位放2，答案是32。" }]
                }
            },
            "math_g1_b": {
                name: "一年級下學期進階學力鑑測 B卷",
                subject: "數學",
                questions: [
                    { q: "1. 5 個十和 3 個一合起來是多少？", options: ["35", "53", "503", "8"], ans: 1, tag: "進階二位數", advice: "十位是5，個位是3，就是53。" },
                    { q: "2. 計算：20 + 30 = ？", options: ["40", "50", "60", "500"], ans: 1, tag: "二位數加減", advice: "2個十加3個十是5個十 (50)。" }
                ],
                practicePool: {
                    "進階二位數": [{ q: "【加強題】82 裡面有幾個十？", options: ["2", "8", "80", "10"], ans: 1, exp: "十位數字是8，代表有8個十。" }]
                }
            }
        };

        // 預覽功能
        function updatePreview() {
            const key = document.getElementById('bank-target-select').value;
            const data = MASTER_QUESTION_BANKS[key];
            document.getElementById('preview-box').innerText = JSON.stringify(data, null, 2);
        }
        document.getElementById('bank-target-select').onchange = updatePreview;

        // 🚀 一鍵上傳至雲端
        window.uploadSelectedBankToCloud = async function() {
            const key = document.getElementById('bank-target-select').value;
            const bankData = MASTER_QUESTION_BANKS[key];

            if (!confirm(`☁️ 確定要將【${bankData.name}】上傳同步至 Firebase 雲端嗎？`)) return;

            try {
                // 寫入 Firestore 的 question_banks 集合中
                await setDoc(doc(db, "question_banks", key), bankData);
                alert(`✅ 成功！【${bankData.name}】已同步至雲端，學生在 teacher.html 測驗時會直接抓取最新題目！`);
            } catch (e) {
                console.error(e);
                alert("❌ 上傳失敗，請檢查網路連線。");
            }
        };

        // 畫面載入時先預覽一次
        window.onload = function() {
            updatePreview();
        };
    </script>
</body>
</html>
