        .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px; }
        .btn:hover { opacity: 0.9; }
        .btn-warning { background: var(--warning); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-purple { background: var(--purple); color: #fff; }

        @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
        .bank-list { list-style: none; padding: 0; margin: 0; }

        window.state = { cloudBanks: {}, currentSelectedBankId: null };

        // 一鍵將預設考卷推播至 Firebase
        window.initializeCloudBanks = async function() {
            if(!confirm("⚠️ 確定要將 1~6 年級全學期預設題庫 (共 12 卷) 完整寫入雲端嗎？（這會覆蓋原有同名資料）")) return;
            
            try {
                for (const [key, data] of Object.entries(PRESET_BANKS)) {
                    await setDoc(doc(db, "question_banks", key), data);
                }
                alert("✅ 系統已成功初始化！國小 1~6 年級 (上下學期，共 12 卷，240題) 已寫入 Firebase。");
                loadBanksFromCloud();
            } catch (e) {
                console.error(e);
                alert("❌ 初始化失敗，請檢查網路狀態或 Firebase 權限設定。");
            }
        };

        // 從 Firebase 讀取現有考卷列表
        async function loadBanksFromCloud() {
            const listEl = document.getElementById('bank-list-container');
            listEl.innerHTML = '<li style="color:#94a3b8; text-align:center;">同步讀取中...</li>';
            try {
                const snapshot = await getDocs(collection(db, "question_banks"));
                window.state.cloudBanks = {};
                listEl.innerHTML = '';
                
                if(snapshot.empty) {
                    listEl.innerHTML = '<li style="color:#e11d48; text-align:center;">雲端目前無資料<br>請點擊上方黃色按鈕初始化</li>';
                    return;
                }

                // 照年級排序
                const sortedDocs = [];
                snapshot.forEach(docSnap => sortedDocs.push({ id: docSnap.id, data: docSnap.data() }));
                sortedDocs.sort((a,b) => a.id.localeCompare(b.id));

                sortedDocs.forEach(docObj => {
                    const data = docObj.data;
                    window.state.cloudBanks[docObj.id] = data;
                    
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${data.name}</span> <span style="background:#e2e8f0; padding:2px 8px; border-radius:12px; font-size:12px;">${data.questions?.length || 0}題</span>`;
                    li.onclick = () => selectBank(docObj.id, li);
                    listEl.appendChild(li);
                });
            } catch(e) {
                console.error(e);
                listEl.innerHTML = '<li style="color:#e11d48; text-align:center;">讀取失敗，請確認 Firebase 設定</li>';
            }
        }

        function selectBank(bankId, liElement) {
            document.querySelectorAll('.bank-list li').forEach(el => el.classList.remove('active'));
            liElement.classList.add('active');
            
            window.state.currentSelectedBankId = bankId;
            const bankData = window.state.cloudBanks[bankId];
            
            document.getElementById('editor-section').style.display = 'block';
            document.getElementById('current-bank-title').innerText = `✏️ 編輯：${bankData.name}`;
            renderQuestions(bankData.questions || []);
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questions-container');
            if (questions.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:30px;">本題庫目前沒有題目。</div>';
                return;
            }

            const alpha = ["(A)", "(B)", "(C)", "(D)"];
            container.innerHTML = questions.map((q, idx) => `
                <div class="question-item">
                    <button class="btn btn-danger" style="position:absolute; right:15px; top:15px; padding:5px 10px; font-size:12px;" onclick="deleteQuestion(${idx})">刪除</button>
                    <div class="q-tag">📌 ${q.tag}</div>
                    <div class="q-text">${idx + 1}. ${q.q}</div>
                    <div class="q-options">
                        ${q.options.map((opt, i) => `<div style="${i === q.ans ? 'font-weight:bold; color:var(--primary);' : ''}">${alpha[i]} ${opt}</div>`).join('')}
                    </div>
                    <div class="q-ans">✅ 正確答案：${alpha[q.ans]} ｜ 💡 建議：${q.advice || '無'}</div>
                </div>
            `).join('');
        }

        window.toggleAddForm = function() {
            const form = document.getElementById('add-question-form');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        };

        window.saveNewQuestion = async function() {
            const bankId = window.state.currentSelectedBankId;
            if(!bankId) { alert("請先選擇左側的題庫！"); return; }

            const tag = document.getElementById('new-tag').value.trim() || "綜合觀念";
            const q = document.getElementById('new-q').value.trim();
            const opt0 = document.getElementById('new-opt0').value.trim();
            const opt1 = document.getElementById('new-opt1').value.trim();
            const opt2 = document.getElementById('new-opt2').value.trim();
            const opt3 = document.getElementById('new-opt3').value.trim();
            const ans = Number(document.getElementById('new-ans').value);
            const advice = document.getElementById('new-advice').value.trim() || "請加強此單元觀念";

            if(!q || !opt0 || !opt1 || !opt2 || !opt3) { alert("請完整填寫題目與四個選項！"); return; }

            const newQ = { tag, q, options: [opt0, opt1, opt2, opt3], ans, advice };
            window.state.cloudBanks[bankId].questions.push(newQ);
            
            try {
                await updateDoc(doc(db, "question_banks", bankId), { questions: window.state.cloudBanks[bankId].questions });
                alert("✅ 題目新增成功並同步至雲端！");
                
                ['new-tag','new-q','new-opt0','new-opt1','new-opt2','new-opt3','new-advice'].forEach(id => document.getElementById(id).value = '');
                toggleAddForm();
                renderQuestions(window.state.cloudBanks[bankId].questions);
            } catch(e) { alert("❌ 新增失敗，請檢查連線。"); }
        };

        window.deleteQuestion = async function(idx) {
            if(!confirm("確定要刪除這題嗎？刪除後前端將不會再出現此題。")) return;
            const bankId = window.state.currentSelectedBankId;
            window.state.cloudBanks[bankId].questions.splice(idx, 1);
            
            try {
                await updateDoc(doc(db, "question_banks", bankId), { questions: window.state.cloudBanks[bankId].questions });
                renderQuestions(window.state.cloudBanks[bankId].questions);
            } catch(e) { alert("❌ 刪除失敗。"); }
        };

        window.onload = loadBanksFromCloud;
    </script>
