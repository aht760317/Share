<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗六顧德補習班 - 雲端題庫管理中心 (Question Bank)</title>
    <style>
        :root {
            --primary: #0f172a; --secondary: #1e293b; --accent: #2563eb; 
            --danger: #e11d48; --success: #059669; --warning: #d97706; --purple: #7c3aed;
            --bg: #f1f5f9; --border: #cbd5e1; --card: #ffffff;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background: var(--bg); color: #334155; padding-bottom: 50px; }
        
        header { 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; padding: 15px 25px; 
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 100;
        }
        header h2 { margin: 0; font-size: 18px; }
        .back-btn { background: rgba(255,255,255,0.15); color: #fff; padding: 6px 14px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); transition: 0.2s; }
        .back-btn:hover { background: rgba(255,255,255,0.25); }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; border: 1px solid var(--border); }
        
        h3 { margin-top: 0; color: var(--primary); border-left: 4px solid var(--accent); padding-left: 10px; font-size: 17px; }
        
        .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px; }
        .btn:hover { opacity: 0.9; }
        .btn-warning { background: var(--warning); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        
        .grid-layout { display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
        @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
        
        .bank-list { list-style: none; padding: 0; margin: 0; }
        .bank-list li { background: #f8fafc; border: 1px solid var(--border); padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .bank-list li:hover { border-color: var(--accent); background: #eff6ff; }
        .bank-list li.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        .question-item { background: #fff; border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid var(--accent); position: relative; }
        .q-tag { display: inline-block; background: #e2e8f0; font-size: 12px; padding: 3px 8px; border-radius: 12px; margin-bottom: 8px; font-weight: bold; }
        .q-text { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: var(--primary); }
        .q-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; color: #475569; }
        .q-ans { margin-top: 10px; font-size: 13px; color: var(--success); font-weight: bold; background: #dcfce7; padding: 5px 10px; border-radius: 4px; display: inline-block; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #475569; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        
        .sys-alert { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header>
        <h2>⚙️ 顧德雲端題庫管理後台</h2>
        <a href="index.html" class="back-btn">🔙 返回前端測驗中心</a>
    </header>

    <div class="container">
        
        <div class="sys-alert">
            <div>
                <strong>⚠️ 系統初始化準備</strong><br>
                <span style="font-size:13px;">若 Firebase 雲端尚無資料，請點擊右側按鈕，將國小 1~6 年級的「標準鑑測卷與加強題庫」一鍵寫入資料庫。</span>
            </div>
            <button class="btn btn-warning" onclick="initializeCloudBanks()">🚀 一鍵寫入/覆蓋 1~6 年級預設題庫</button>
        </div>

        <div class="grid-layout">
            <!-- 左側：題庫列表 -->
            <div class="card" style="align-self: start;">
                <h3>📂 已建立的題庫卷</h3>
                <ul class="bank-list" id="bank-list-container">
                    <li style="color:#94a3b8; text-align:center; display:block;">載入中...</li>
                </ul>
                <button class="btn btn-success" style="width:100%; margin-top:15px;" onclick="alert('新增自訂考卷功能即將開放！請先使用預設年級卷進行編輯。')">➕ 新增空白考卷</button>
            </div>

            <!-- 右側：題目編輯區 -->
            <div class="card" id="editor-section" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom:15px;">
                    <h3 style="margin:0; border:none; padding:0; font-size: 20px;" id="current-bank-title">選擇題庫以進行編輯</h3>
                    <button class="btn btn-purple" onclick="toggleAddForm()">📝 新增題目</button>
                </div>

                <!-- 新增題目的表單 (隱藏) -->
                <div id="add-question-form" style="display:none; background:#f8fafc; padding:15px; border-radius:8px; border:1px dashed var(--accent); margin-bottom:20px;">
                    <h4 style="margin-top:0; color:var(--accent);">新增實戰題目</h4>
                    <div class="form-group"><label>指標/單元標籤 (Tag)：</label><input type="text" id="new-tag" placeholder="例如：100以內的加減法"></div>
                    <div class="form-group"><label>題目內容：</label><input type="text" id="new-q" placeholder="請輸入題目"></div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div class="form-group"><label>選項 (A)：</label><input type="text" id="new-opt0"></div>
                        <div class="form-group"><label>選項 (B)：</label><input type="text" id="new-opt1"></div>
                        <div class="form-group"><label>選項 (C)：</label><input type="text" id="new-opt2"></div>
                        <div class="form-group"><label>選項 (D)：</label><input type="text" id="new-opt3"></div>
                    </div>
                    <div class="form-group">
                        <label>正確解答：</label>
                        <select id="new-ans">
                            <option value="0">(A)</option><option value="1">(B)</option><option value="2">(C)</option><option value="3">(D)</option>
                        </select>
                    </div>
                    <div class="form-group"><label>主任專屬建議 (Advice)：</label><input type="text" id="new-advice" placeholder="若學生答錯，系統要提示什麼？"></div>
                    <div style="text-align:right;">
                        <button class="btn" style="background:#64748b;" onclick="toggleAddForm()">取消</button>
                        <button class="btn btn-success" onclick="saveNewQuestion()">💾 儲存題目至雲端</button>
                    </div>
                </div>

                <div id="questions-container">
                    <!-- 題目列表渲染區 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase 邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9RSb0rQzuo0nELR6CvLE06jyktS8YI2s",
            authDomain: "my-project-9999-479215.firebaseapp.com",
            projectId: "my-project-9999-479215"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 這是你剛剛確認過的 1~6 年級實戰資料庫結構
        const PRESET_BANKS = {
            "grade_1": {
                name: "小一數學全單元綜合鑑測卷", subject: "數學", grade: "小一",
                questions: [
                    { tag: "10以內的數與加減法", q: "桌上有 5 顆蘋果，媽媽又買了 3 顆，一共有幾顆？", options: ["7", "8", "9", "10"], ans: 1, advice: "需透過實物操作，加強數字的合成與分解。" },
                    { tag: "比長短、高矮與輕重", q: "鉛筆比橡皮擦長，尺比鉛筆長，誰最長？", options: ["鉛筆", "橡皮擦", "尺", "一樣長"], ans: 2, advice: "加強三物比較的邏輯推理訓練。" },
                    { tag: "順序、多少與分與合", q: "排隊時小明排第 4 個，小華在小明後面 2 個，小華排第幾個？", options: ["第5", "第6", "第7", "第8"], ans: 1, advice: "釐清「基數」與「序數」的概念差異。" },
                    { tag: "認識基本形狀", q: "下列哪一個物品的形狀最像圓柱體？", options: ["籃球", "鉛筆盒", "易開罐飲料", "課本"], ans: 2, advice: "多觀察生活周遭物品，建立立體圖形的直覺。" },
                    { tag: "20以內的數與加減法", q: "15 減去 7 等於多少？", options: ["6", "7", "8", "9"], ans: 2, advice: "加強退位減法計算，可利用「借10」的方法練習。" }
                ],
                practicePool: {
                    "10以內的數與加減法": [{ q: "水缸裡有 6 條魚，再放進 4 條，現在有幾條？", options: ["8", "9", "10", "11"], exp: "6+4=10，答案選 (C) 10。" }],
                    "20以內的數與加減法": [{ q: "13 減去 5 等於多少？", options: ["7", "8", "9", "6"], exp: "13-5=8，可想成10-5=5，5+3=8。答案選 (B) 8。" }]
                }
            },
            "grade_2": {
                name: "小二數學全單元綜合鑑測卷", subject: "數學", grade: "小二",
                questions: [
                    { tag: "100以內的數與直式加減法", q: "45 + 28 = ?", options: ["63", "73", "83", "62"], ans: 1, advice: "注意直式計算時的「進位」動作。" },
                    { tag: "長度單位與量測", q: "1 公尺等於幾公分？", options: ["10", "100", "1000", "50"], ans: 1, advice: "背誦公尺與公分的換算口訣。" },
                    { tag: "乘法意義與九九乘法表", q: "一盒餅乾有 8 塊，買 7 盒共有幾塊餅乾？", options: ["15", "56", "49", "64"], ans: 1, advice: "需熟練九九乘法表，建立乘法為連加的概念。" },
                    { tag: "分類與統計圖表", q: "紅筆有 5 枝，藍筆有 7 枝，總共有幾枝筆？", options: ["10", "12", "14", "2"], ans: 1, advice: "加強讀題與統計數據統整能力。" },
                    { tag: "認識錢幣與時間", q: "小美有 3 個十元和 5 個一元，買了 22 元的原子筆，還剩多少錢？", options: ["13元", "15元", "17元", "18元"], ans: 0, advice: "加強錢幣換算與兩步驟減法應用題。" }
                ],
                practicePool: {
                    "100以內的數與直式加減法": [{ q: "52 - 17 = ?", options: ["35", "45", "34", "44"], exp: "直式退位減法，2不夠減7，向十位借位，12-7=5，4-1=3。答案是 35。" }],
                    "乘法意義與九九乘法表": [{ q: "一包糖果有 9 顆，買 6 包共有幾顆？", options: ["45", "54", "63", "36"], exp: "9×6=54。答案選 (B) 54。" }]
                }
            },
            "grade_3": {
                name: "小三數學全單元綜合鑑測卷", subject: "數學", grade: "小三",
                questions: [
                    { tag: "萬以內的數與加減計算", q: "3050 + 1200 = ?", options: ["4050", "4250", "4150", "4350"], ans: 1, advice: "留意千位與百位的對齊計算。" },
                    { tag: "乘除直式與餘數", q: "45 ÷ 6 的商和餘數分別是多少？", options: ["商7餘3", "商6餘9", "商7餘2", "商8餘1"], ans: 0, advice: "釐清除法直式中「餘數必須小於除數」的規則。" },
                    { tag: "分數的初步認識", q: "一個披薩平分成 8 份，吃了 3 份，還剩下幾分之幾？", options: ["3/8", "5/8", "1/8", "4/8"], ans: 1, advice: "加強部分與全體的概念，分子分母的意義。" },
                    { tag: "重量與容量", q: "2 公斤 50 公克等於多少公克？", options: ["250", "2050", "2500", "20050"], ans: 1, advice: "注意公斤換公克要補零（1公斤=1000公克）。" },
                    { tag: "周長面積與平面的形體", q: "邊長 5 公分的正方形，周長是多少？", options: ["10公分", "15公分", "20公分", "25公分"], ans: 2, advice: "釐清「周長」與「面積」公式的差異。" }
                ],
                practicePool: {
                    "乘除直式與餘數": [{ q: "38 ÷ 5 的商和餘數？", options: ["商6餘8", "商7餘3", "商7餘4", "商8餘2"], exp: "38 ÷ 5 = 7...3。答案選 (B)。" }]
                }
            },
            "grade_4": {
                name: "小四數學全單元綜合鑑測卷", subject: "數學", grade: "小四",
                questions: [
                    { tag: "一億以內的數與大數加減", q: "一千萬減去一百萬等於多少？", options: ["九十萬", "九百萬", "九千萬", "九十"], ans: 1, advice: "熟練位值表，注意大數相減時的位數對齊。" },
                    { tag: "整數乘除與四則運算", q: "25 × 4 ÷ 2 + 10 = ?", options: ["60", "50", "40", "30"], ans: 0, advice: "遵守「先乘除後加減、由左至右」的運算規則。" },
                    { tag: "小數的認識與加減法", q: "3.5 + 2.75 = ?", options: ["5.25", "6.25", "5.8", "6.8"], ans: 1, advice: "小數加減務必「小數點對齊」。" },
                    { tag: "三角形與四邊形分類", q: "三角形三個內角分別為 90度、45度、45度，這是什麼三角形？", options: ["銳角三角形", "鈍角三角形", "等腰直角三角形", "正三角形"], ans: 2, advice: "背誦並理解三角形內角和與邊角關係。" },
                    { tag: "面積計算", q: "長方形長 12 公分，寬 8 公分，面積是多少平方公分？", options: ["40", "20", "96", "84"], ans: 2, advice: "熟記矩形面積公式 (長×寬)。" }
                ],
                practicePool: {
                    "整數乘除與四則運算": [{ q: "100 - 20 × 3 = ?", options: ["240", "40", "60", "80"], exp: "先乘除後加減，100-60=40。答案選 (B)。" }]
                }
            },
            "grade_5": {
                name: "小五數學全單元綜合鑑測卷", subject: "數學", grade: "小五",
                questions: [
                    { tag: "因數與倍數", q: "12 和 18 的最大公因數是多少？", options: ["2", "3", "6", "36"], ans: 2, advice: "加強短除法找最大公因數的技巧。" },
                    { tag: "分數的乘法與除法", q: "3/4 × 2/3 = ?", options: ["1/2", "5/12", "9/8", "1/4"], ans: 0, advice: "練習分數乘法時「先約分再計算」的習慣。" },
                    { tag: "小數的乘法與除法", q: "1.2 × 0.5 = ?", options: ["6", "0.6", "0.06", "60"], ans: 1, advice: "小數乘法要數對小數點後面的總位數。" },
                    { tag: "多邊形面積與圓面積", q: "半徑 10 公分的圓，面積大約是多少平方公分？（圓周率3.14）", options: ["31.4", "62.8", "314", "3140"], ans: 2, advice: "牢記圓面積公式：半徑 × 半徑 × 3.14。" },
                    { tag: "立體形體與平均數", q: "五次考試分數分別為 80, 85, 90, 95, 100，平均分數是多少？", options: ["88", "90", "92", "95"], ans: 1, advice: "理解平均數定義：總和 ÷ 個數。" }
                ],
                practicePool: {
                    "因數與倍數": [{ q: "8 和 12 的最小公倍數是多少？", options: ["4", "16", "24", "48"], exp: "8的倍數: 8, 16, 24...; 12的倍數: 12, 24...。最小公倍數為 24。" }]
                }
            },
            "grade_6": {
                name: "小六數學全單元綜合鑑測卷", subject: "數學", grade: "小六",
                questions: [
                    { tag: "質因數分解與公倍數", q: "下列哪一個數字是質數？", options: ["1", "2", "9", "15"], ans: 1, advice: "釐清質數定義，特別注意 1 不是質數。" },
                    { tag: "分數與小數的除法運算", q: "2.5 ÷ (1/2) = ?", options: ["1.25", "5", "12.5", "0.5"], ans: 1, advice: "練習小數轉分數，或理解除以二分之一等於乘以 2。" },
                    { tag: "比、比值與比例問題", q: "爸爸和哥哥身高比為 6:5，爸爸身高 180 公分，哥哥幾公分？", options: ["150", "160", "170", "175"], ans: 0, advice: "利用比例式求值 (6份=180, 1份=30, 5份=150)。" },
                    { tag: "圓周長與圓面積綜合", q: "圓的直徑變成原來的 2 倍，面積會變成原來的幾倍？", options: ["2倍", "4倍", "8倍", "不變"], ans: 1, advice: "面積比等於邊長(半徑)比的平方。" },
                    { tag: "扇形面積與代數基礎", q: "解方程式 3x + 5 = 20，x 等於多少？", options: ["3", "4", "5", "6"], ans: 2, advice: "熟練等量公理與移項法則。" }
                ],
                practicePool: {
                    "比、比值與比例問題": [{ q: "甲乙兩數比為 3:4，甲數是 15，乙數是多少？", options: ["12", "16", "20", "24"], exp: "3等份是15，1等份是5，4等份是20。答案選 (C)。" }]
                }
            }
        };

        window.state = { cloudBanks: {}, currentSelectedBankId: null };

        // 一鍵將預設考卷推播至 Firebase
        window.initializeCloudBanks = async function() {
            if(!confirm("⚠️ 確定要將 1~6 年級預設題庫完整寫入雲端嗎？（這會覆蓋原有同名資料）")) return;
            
            try {
                for (const [key, data] of Object.entries(PRESET_BANKS)) {
                    await setDoc(doc(db, "question_banks", key), data);
                }
                alert("✅ 系統已成功初始化！國小 1~6 年級實戰題庫已寫入 Firebase。");
                loadBanksFromCloud();
            } catch (e) {
                console.error(e);
                alert("❌ 初始化失敗，請檢查網路狀態或 Firebase 權限設定。");
            }
        };

        // 從 Firebase 讀取現有考卷列表
        async function loadBanksFromCloud() {
            const listEl = document.getElementById('bank-list-container');
            listEl.innerHTML = '<li style="color:#94a3b8; text-align:center; display:block;">同步讀取中...</li>';
            
            try {
                const snapshot = await getDocs(collection(db, "question_banks"));
                window.state.cloudBanks = {};
                listEl.innerHTML = '';
                
                if(snapshot.empty) {
                    listEl.innerHTML = '<li style="color:#e11d48; text-align:center; display:block;">雲端目前無資料<br>請點擊上方黃色按鈕初始化</li>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    window.state.cloudBanks[docSnap.id] = data;
                    
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${data.name}</span> <span style="background:#e2e8f0; padding:2px 8px; border-radius:12px; font-size:12px;">${data.questions?.length || 0}題</span>`;
                    li.onclick = () => selectBank(docSnap.id, li);
                    listEl.appendChild(li);
                });
            } catch(e) {
                console.error(e);
                listEl.innerHTML = '<li style="color:#e11d48; text-align:center; display:block;">讀取失敗，請確認 Firebase 設定</li>';
            }
        }

        function selectBank(bankId, liElement) {
            document.querySelectorAll('.bank-list li').forEach(el => el.classList.remove('active'));
            liElement.classList.add('active');
            
            window.state.currentSelectedBankId = bankId;
            const bankData = window.state.cloudBanks[bankId];
            
            document.getElementById('editor-section').style.display = 'block';
            document.getElementById('current-bank-title').innerText = `✏️ 編輯：${bankData.name}`;
            
            renderQuestions(bankData.questions || []);
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questions-container');
            if (questions.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:30px;">本題庫目前沒有題目。</div>';
                return;
            }

            const alpha = ["(A)", "(B)", "(C)", "(D)"];
            container.innerHTML = questions.map((q, idx) => `
                <div class="question-item">
                    <button class="btn btn-danger" style="position:absolute; right:15px; top:15px; padding:5px 10px; font-size:12px;" onclick="deleteQuestion(${idx})">刪除</button>
                    <div class="q-tag">📌 ${q.tag}</div>
                    <div class="q-text">${idx + 1}. ${q.q}</div>
                    <div class="q-options">
                        ${q.options.map((opt, i) => `<div style="${i === q.ans ? 'font-weight:bold; color:var(--primary);' : ''}">${alpha[i]} ${opt}</div>`).join('')}
                    </div>
                    <div class="q-ans">✅ 正確答案：${alpha[q.ans]} ｜ 💡 建議：${q.advice || '無'}</div>
                </div>
            `).join('');
        }

        window.toggleAddForm = function() {
            const form = document.getElementById('add-question-form');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        };

        window.saveNewQuestion = async function() {
            const bankId = window.state.currentSelectedBankId;
            if(!bankId) { alert("請先選擇左側的題庫！"); return; }

            const tag = document.getElementById('new-tag').value.trim();
            const q = document.getElementById('new-q').value.trim();
            const opt0 = document.getElementById('new-opt0').value.trim();
            const opt1 = document.getElementById('new-opt1').value.trim();
            const opt2 = document.getElementById('new-opt2').value.trim();
            const opt3 = document.getElementById('new-opt3').value.trim();
            const ans = Number(document.getElementById('new-ans').value);
            const advice = document.getElementById('new-advice').value.trim();

            if(!q || !opt0 || !opt1 || !opt2 || !opt3) { alert("請完整填寫題目與四個選項！"); return; }

            const newQ = { tag: tag || "綜合觀念", q, options: [opt0, opt1, opt2, opt3], ans, advice: advice || "請加強此單元觀念" };
            
            // 更新本地 State
            window.state.cloudBanks[bankId].questions.push(newQ);
            
            // 更新 Firebase
            try {
                await updateDoc(doc(db, "question_banks", bankId), {
                    questions: window.state.cloudBanks[bankId].questions
                });
                alert("✅ 題目新增成功並同步至雲端！");
                
                // 清空表單
                document.getElementById('new-tag').value = '';
                document.getElementById('new-q').value = '';
                document.getElementById('new-opt0').value = '';
                document.getElementById('new-opt1').value = '';
                document.getElementById('new-opt2').value = '';
                document.getElementById('new-opt3').value = '';
                document.getElementById('new-advice').value = '';
                
                toggleAddForm();
                renderQuestions(window.state.cloudBanks[bankId].questions);
            } catch(e) {
                console.error(e);
                alert("❌ 新增失敗，請檢查連線。");
            }
        };

        window.deleteQuestion = async function(idx) {
            if(!confirm("確定要刪除這題嗎？刪除後前端將不會再出現此題。")) return;
            
            const bankId = window.state.currentSelectedBankId;
            window.state.cloudBanks[bankId].questions.splice(idx, 1);
            
            try {
                await updateDoc(doc(db, "question_banks", bankId), {
                    questions: window.state.cloudBanks[bankId].questions
                });
                renderQuestions(window.state.cloudBanks[bankId].questions);
            } catch(e) {
                console.error(e);
                alert("❌ 刪除失敗。");
            }
        };

        // 啟動時自動載入 Firebase 資料
        window.onload = loadBanksFromCloud;
    </script>
</body>
</html>
