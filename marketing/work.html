<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧德補習班｜行銷自動化工廠</title>
    <style>
        /* 日系極簡風設計 */
        :root {
            --bg-color: #f9f9fa;
            --text-main: #333333;
            --text-light: #777777;
            --border-color: #e0e0e0;
            --accent-color: #4a5568;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        p.subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fafafa;
            transition: border-color 0.3s ease;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #ffffff;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2d3748;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #2b6cb0;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>行銷文案產生器</h1>
        <p class="subtitle">AI 多平台文案發布工作流</p>

        <form id="marketingForm">
            <div class="form-group">
                <label for="theme">宣傳主題 (例：寒假營隊、小一正音班)</label>
                <input type="text" id="theme" required placeholder="請輸入本次推廣的核心主題">
            </div>
            
            <div class="form-group">
                <label for="audience">目標受眾 (例：國中雙薪家長)</label>
                <input type="text" id="audience" required placeholder="這篇文案主要寫給誰看？">
            </div>

            <div class="form-group">
                <label for="sellingPoints">核心賣點 (請列出 1-3 點)</label>
                <textarea id="sellingPoints" required placeholder="例：小班制教學、獨家自製教材、戶外教學行程..."></textarea>
            </div>

            <div class="form-group">
                <label for="cta">行動呼籲 CTA (希望他們做什麼)</label>
                <input type="text" id="cta" required placeholder="例：點擊下方 Line 連結預約試聽">
            </div>

            <button type="submit" id="submitBtn">送出並生成多平台文案</button>
            <div id="status">資料傳送中，請稍候...</div>
        </form>
    </div>

    <script>
        document.getElementById('marketingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusText = document.getElementById('status');
            
            // 這裡替換成你未來在 Make.com 或 n8n 建立的 Webhook 網址
            const webhookUrl = "YOUR_MAKE_WEBHOOK_URL_HERE"; 

            // 收集表單資料
            const data = {
                theme: document.getElementById('theme').value,
                audience: document.getElementById('audience').value,
                sellingPoints: document.getElementById('sellingPoints').value,
                cta: document.getElementById('cta').value,
                timestamp: new Date().toISOString()
            };

            // 改變按鈕狀態
            submitBtn.disabled = true;
            submitBtn.style.backgroundColor = '#a0aec0';
            statusText.style.display = 'block';
            statusText.innerText = '正在傳送資料至自動化中樞...';

            try {
                // 發送 POST 請求至 Webhook
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if(response.ok) {
                    statusText.style.color = '#38a169';
                    statusText.innerText = '✅ 發送成功！請至 Line 測試群組或後台查看生成的文案。';
                    document.getElementById('marketingForm').reset();
                } else {
                    throw new Error('網路回應錯誤');
                }
            } catch (error) {
                statusText.style.color = '#e53e3e';
                statusText.innerText = '❌ 傳送失敗，請檢查 Webhook 網址或網路狀態。';
                console.error('Error:', error);
            } finally {
                // 恢復按鈕狀態
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.style.backgroundColor = 'var(--accent-color)';
                    statusText.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
