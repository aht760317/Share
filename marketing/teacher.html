<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>斗六顧德補習班 - 老師端：學生成長與多科能力追蹤系統 (紀錄維護版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --purple: #8e44ad;
            --bg: #f4f6f9;
            --border: #ccd1d9;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, "Microsoft JhengHei", sans-serif; 
            margin: 0; background: var(--bg); color: #222; font-size: 16px; padding-bottom: 80px;
        }
        header { 
            background: var(--primary); color: white; padding: 16px 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        header h2 { margin: 0; font-size: 22px; letter-spacing: 1px; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .sync-quick-btn {
            background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4);
            padding: 7px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .sync-quick-btn:hover { background: rgba(255,255,255,0.35); }

        .container { max-width: 1300px; margin: 25px auto; padding: 0 15px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); margin-bottom: 25px; }
        
        label { display: block; font-weight: bold; margin-bottom: 6px; color: var(--primary); font-size: 14.5px; }
        select, input[type="text"], input[type="number"], textarea, input[type="date"] {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; background: #fff;
        }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; width: 100%; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-purple { background: var(--purple); color: #fff; }

        .grid-2 { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { 
            .grid-2 { grid-template-columns: 1fr 1fr; } 
        }

        .tags-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .tag-label {
            background: #edf2f7; padding: 6px 14px; border-radius: 20px; font-size: 13.5px; cursor: pointer; border: 1px solid transparent; transition: 0.2s;
        }
        .tag-label input { display: none; }
        .tag-label:has(input:checked) {
            background: #e6fffa; border-color: #319795; color: #234e52; font-weight: bold;
        }

        .history-item {
            background: #f8fafc; border: 1px solid #e2e8f0; border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 6px; margin-bottom: 10px; font-size: 14px;
            cursor: pointer; transition: 0.2s;
        }
        .history-item:hover {
            background: #e2e8f0; border-color: var(--accent); transform: translateX(2px);
        }

        .preview-box {
            background: #ebf8ff; border: 1px solid #b6d4fe; padding: 15px; border-radius: 8px; margin-top: 15px; display: none;
        }
        .preview-box textarea { background: #fff; font-size: 13.5px; line-height: 1.5; margin-bottom: 10px; }

        .settings-panel {
            background: #fdf8f6; border: 2px dashed #f6ad55; padding: 20px; border-radius: 10px; margin-bottom: 25px; display: none;
        }

        .badge-score {
            display: inline-block; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 13px;
        }
        .score-high { background: #def7ec; color: #03543f; }
        .score-mid { background: #fef08a; color: #854d0e; }
        .score-low { background: #fde8e8; color: #9b1c1c; }

        /* 彈窗樣式 (Modal) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 15px; backdrop-filter: blur(2px); }
        .modal-box { background: white; width: 100%; max-width: 600px; padding: 25px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <header>
        <h2>📊 顧德補習班 - 學生成長與多科能力追蹤系統</h2>
        <div class="header-btns">
            <button class="sync-quick-btn" onclick="toggleSettingsPanel()">⚙️ 系統設定區</button>
            <button class="sync-quick-btn" onclick="initCloudData(true)">🔄 同步雲端總庫</button>
        </div>
    </header>

    <div class="container">
        
        <!-- ⚙️ 系統設定區 -->
        <div class="settings-panel" id="settings-panel">
            <h3 style="margin-top:0; color:#c05621;">⚙️ 系統設定區 (擴充科目與單元)</h3>
            <p style="font-size:14px; color:#666;">未來若要擴充國文、英文或其他科目，可在此直接定義。</p>
            <div class="grid-2">
                <div>
                    <label>新增科目名稱：</label>
                    <input type="text" id="new-subject-input" placeholder="例如：國文、英文">
                </div>
                <div>
                    <label>預設單元清單 (用逗號分隔)：</label>
                    <input type="text" id="new-units-input" placeholder="例如：第一課, 第二課">
                </div>
            </div>
            <button class="btn btn-purple" style="width: auto; padding: 8px 20px;" onclick="addNewSubjectConfig()">➕ 儲存新科目設定</button>
        </div>

        <!-- 🎯 核心檢測登錄面板 -->
        <div class="card">
            <h3 style="margin-top:0; color:var(--primary); border-left: 4px solid var(--accent); padding-left: 10px;">學員能力診斷與檢測登錄</h3>
            
            <div class="grid-2">
                <div>
                    <label>1. 選擇精準年級：</label>
                    <select id="filter-grade" onchange="onGradeChange()">
                        <option value="">-- 請先選擇年級 --</option>
                        <option value="小一">國小一年級</option>
                        <option value="小二">國小二年級</option>
                        <option value="小三">國小三年級</option>
                        <option value="小四">國小四年級</option>
                        <option value="小五">國小五年級</option>
                        <option value="小六">國小六年級</option>
                        <option value="國一">國中一年級</option>
                        <option value="國二">國中二年級</option>
                        <option value="國三">國中三年級</option>
                    </select>
                </div>
                <div>
                    <label>2. 選擇學生姓名：</label>
                    <select id="student-select" disabled onchange="loadStudentGrowthProfile()">
                        <option value="">-- 請先選擇年級 --</option>
                    </select>
                </div>
            </div>

            <div id="evaluation-form-wrapper" style="display:none; margin-top:15px; border-top:1px dashed #cbd5e1; padding-top:20px;">
                <div class="grid-2">
                    <div>
                        <label>3. 選擇檢測科目：</label>
                        <select id="subject-select" onchange="updateUnitDropdown()">
                            <option value="數學">數學</option>
                        </select>
                    </div>
                    <div>
                        <label>4. 選擇精準測驗單元：</label>
                        <select id="unit-select">
                            <option value="">-- 請先選擇單元 --</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>本次評量分數：</label>
                        <input type="number" id="eval-score" min="0" max="100" placeholder="例如：85" oninput="autoGenerateComment()">
                    </div>
                    <div>
                        <label>細項說明 / 補充：</label>
                        <input type="text" id="eval-sub-note" placeholder="例如：第一章綜合小考">
                    </div>
                </div>

                <label>核心能力弱點標籤 (可複選 ➔ 自動生成因材施教方案)：</label>
                <div class="tags-container" id="weakness-tags">
                    <label class="tag-label"><input type="checkbox" name="tags" value="計算過程粗心與符號誤判" onchange="autoGenerateComment()">計算過程粗心與符號誤判</label>
                    <label class="tag-label"><input type="checkbox" name="tags" value="基本觀念與定義不夠扎實" onchange="autoGenerateComment()">基本觀念與定義不夠扎實</label>
                    <label class="tag-label"><input type="checkbox" name="tags" value="文字敘述題意理解困難" onchange="autoGenerateComment()">文字敘述題意理解困難</label>
                    <label class="tag-label"><input type="checkbox" name="tags" value="應用題列式與邏輯打結" onchange="autoGenerateComment()">應用題列式與邏輯打結</label>
                    <label class="tag-label"><input type="checkbox" name="tags" value="公式套用錯誤或不熟練" onchange="autoGenerateComment()">公式套用錯誤或不熟練</label>
                    <label class="tag-label"><input type="checkbox" name="tags" value="解題速度與熟練度不足" onchange="autoGenerateComment()">解題速度與熟練度不足</label>
                </div>

                <label>導師綜合評語與因材施教輔導方案：</label>
                <textarea id="eval-comment" rows="4" placeholder="勾選上方弱點後，系統將自動產生專業因材施教方案..."></textarea>

                <div class="grid-2">
                    <button class="btn" onclick="saveGrowthRecord()">💾 儲存該學員成長紀錄至雲端</button>
                    <button class="btn btn-warning" onclick="generateParentReport()">📋 產生家長 LINE 專屬日誌報表</button>
                </div>

                <!-- 產出貼至 LINE 的預覽框 -->
                <div class="preview-box" id="line-preview-box">
                    <label style="color:#0369a1;">📱 可直接複製貼到 LINE 給家長的報表內容：</label>
                    <textarea id="line-report-text" rows="7" readonly></textarea>
                    <button class="btn" style="background:#38a169; padding:8px;" onclick="copyLineReport()">📋 一鍵複製文字內容</button>
                </div>
            </div>
        </div>

        <!-- 📊 視覺化分析儀表板 -->
        <div class="card" id="dashboard-card" style="display:none;">
            <h3 id="dashboard-title" style="color:var(--primary); margin-top:0;">學員多維度成長儀表板</h3>
            
            <div class="grid-2" style="align-items: center; margin-bottom: 25px;">
                <div>
                    <h4 style="text-align:center; color:#555;">核心能力雷達分析</h4>
                    <canvas id="growthRadarChart" style="max-height: 270px;"></canvas>
                </div>
                <div>
                    <h4 style="text-align:center; color:#555;">歷次小考成績趨勢</h4>
                    <canvas id="growthLineChart" style="max-height: 270px;"></canvas>
                </div>
            </div>

            <div>
                <h4 style="color:#555; border-top:1px solid #e2e8f0; padding-top:15px;">歷史檢測與輔導紀錄 (點擊項目可進行修改或刪除)</h4>
                <div id="history-logs-container" style="max-height: 250px; overflow-y: auto; padding-right: 5px;"></div>
            </div>
        </div>

    </div>

    <!-- ✏️ 歷史紀錄編輯彈窗 (Modal) -->
    <div class="modal-overlay" id="edit-record-modal">
        <div class="modal-box">
            <h3 style="margin-top:0; color:var(--primary);">✏️ 編輯或刪除檢測紀錄</h3>
            <input type="hidden" id="edit-record-index">

            <div class="grid-2">
                <div>
                    <label>檢測日期：</label>
                    <input type="date" id="edit-record-date">
                </div>
                <div>
                    <label>評量分數：</label>
                    <input type="number" id="edit-record-score" min="0" max="100">
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label>檢測科目：</label>
                    <input type="text" id="edit-record-subject" readonly style="background:#edf2f7;">
                </div>
                <div>
                    <label>測驗單元：</label>
                    <input type="text" id="edit-record-unit">
                </div>
            </div>

            <label>導師評語與因材施教方案：</label>
            <textarea id="edit-record-comment" rows="4"></textarea>

            <div style="display: flex; justify-content: space-between; margin-top: 20px; gap: 10px;">
                <button class="btn btn-danger" style="width: auto; padding: 10px 20px;" onclick="deleteGrowthRecord()">🗑️ 刪除此紀錄</button>
                <div style="display: flex; gap: 10px; width: 100%; justify-content: flex-end;">
                    <button class="btn" style="width: auto; padding: 10px 20px;" onclick="updateGrowthRecord()">💾 儲存修改</button>
                    <button class="btn" style="width: auto; padding: 10px 20px; background:#999;" onclick="document.getElementById('edit-record-modal').style.display='none'">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase 邏輯核心 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9RSb0rQzuo0nELR6CvLE06jyktS8YI2s",
            authDomain: "my-project-9999-479215.firebaseapp.com",
            projectId: "my-project-9999-479215",
            storageBucket: "my-project-9999-479215.firebasestorage.app",
            messagingSenderId: "1020162825898",
            appId: "1:1020162825898:web:681a7825a197f34e713ad3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.state = { students: [] };
        let radarInstance = null;
        let lineInstance = null;

        window.subjectSyllabus = {
            "數學": [
                "【小一】10以內的加減法", "【小一】形狀與空間", "【小一】分與合",
                "【小二】公分與公尺", "【小二】乘法表與直式計算", "【小二】認識錢幣與時間",
                "【小三】兩步驟應用題", "【小三】分數的認識", "【小三】周長與面積",
                "【小四】整數四則運算", "【小四】角度與三角形", "【小四】小數的加減",
                "【小五】因數與倍數", "【小五】三角形與多邊形面積", "【小五】分數的乘除法",
                "【小六】最大公因數與最小公倍數", "【小六】分數與小數的除法", "【小六】比與比值", "【小六】圓周長與扇形", "【小六】放大縮小與比例尺",
                "【國一】正負數與數線", "【國一】一元一次方程式", "【國一】二元一次聯立方程式", "【國一】直角坐標與函數",
                "【國二】乘法公式與多項式", "【國二】根式運算與商高定理", "【國二】平行與邊角關係", "【國二】梯形與鳶形性質",
                "【國三】相似形與比例線段", "【國三】圓形性質與弦切角", "【國三】二次函數最大最小值", "【國三】統計與機率"
            ]
        };

        async function initCloudData(showToast = false) {
            try {
                const snapshot = await getDocs(collection(db, "classLogStudents"));
                window.state.students = [];
                snapshot.forEach(docSnap => {
                    window.state.students.push({ firestoreId: docSnap.id, ...docSnap.data() });
                });
                
                const settingsSnap = await getDocs(collection(db, "systemSettings"));
                settingsSnap.forEach(sDoc => {
                    if (sDoc.id === "syllabusConfig" && sDoc.data().syllabus) {
                        window.subjectSyllabus = sDoc.data().syllabus;
                    }
                });

                updateSubjectDropdown();
                if (showToast) alert(`✅ 成功同步！目前雲端共有 ${window.state.students.length} 位學生。`);
            } catch (e) {
                console.error(e);
                if (showToast) alert('❌ 同步失敗，請檢查網路連線。');
            }
        }
        window.initCloudData = initCloudData;

        window.toggleSettingsPanel = function() {
            const panel = document.getElementById('settings-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        };

        window.onGradeChange = function() {
            const grade = document.getElementById('filter-grade').value;
            const studentSelect = document.getElementById('student-select');
            
            if (!grade) {
                studentSelect.innerHTML = '<option value="">-- 請先選擇年級 --</option>';
                studentSelect.disabled = true;
                document.getElementById('evaluation-form-wrapper').style.display = 'none';
                document.getElementById('dashboard-card').style.display = 'none';
                return;
            }

            studentSelect.disabled = false;
            studentSelect.innerHTML = '<option value="">-- 請選擇該年級學生 --</option>';

            window.state.students.forEach(s => {
                const studentClass = s.studentClass || s.course || '';
                if (studentClass.includes(grade) || studentClass.includes(grade.replace('小','').replace('國',''))) {
                    studentSelect.innerHTML += `<option value="${s.firestoreId}">${s.name} (${studentClass})</option>`;
                }
            });

            if (studentSelect.options.length <= 1) {
                window.state.students.forEach(s => {
                    const studentClass = s.studentClass || s.course || '未分類';
                    studentSelect.innerHTML += `<option value="${s.firestoreId}">${s.name} (${studentClass})</option>`;
                });
            }
        };

        window.loadStudentGrowthProfile = function() {
            const id = document.getElementById('student-select').value;
            const formWrapper = document.getElementById('evaluation-form-wrapper');
            const dashboard = document.getElementById('dashboard-card');

            if (!id) {
                formWrapper.style.display = 'none';
                dashboard.style.display = 'none';
                return;
            }

            formWrapper.style.display = 'block';
            dashboard.style.display = 'block';

            const student = window.state.students.find(s => s.firestoreId === id);
            if (!student) return;

            document.getElementById('dashboard-title').innerText = `📊 【${student.name}】學員成長與能力追蹤儀表板`;

            const records = student.growthRecords || [];
            renderHistoryLogs(records);
            renderCharts(records);
        };

        function updateSubjectDropdown() {
            const subjectSelect = document.getElementById('subject-select');
            subjectSelect.innerHTML = '';
            for (let sub in window.subjectSyllabus) {
                subjectSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
            }
            updateUnitDropdown();
        }

        window.updateUnitDropdown = function() {
            const sub = document.getElementById('subject-select').value;
            const unitSelect = document.getElementById('unit-select');
            unitSelect.innerHTML = '<option value="">-- 請選擇測驗單元 --</option>';
            
            if (window.subjectSyllabus[sub]) {
                window.subjectSyllabus[sub].forEach(u => {
                    unitSelect.innerHTML += `<option value="${u}">${u}</option>`;
                });
            }
        };

        window.autoGenerateComment = function() {
            const checkedTags = Array.from(document.querySelectorAll('input[name="tags"]:checked')).map(el => el.value);
            const commentBox = document.getElementById('eval-comment');
            const score = document.getElementById('eval-score').value || '80';

            let solutions = [];
            checkedTags.forEach(tag => {
                if (tag.includes('粗心')) solutions.push("啟動「驗算步驟雙軌制」，每次計算要求強制回算一次。");
                if (tag.includes('觀念')) solutions.push("安排於晚自習進行「觀念重組與定義釐清」，透過圖解重建邏輯。");
                if (tag.includes('文字')) solutions.push("進行「關鍵字圈選與題意拆解訓練」，培養將國語文意轉化為算式的能力。");
                if (tag.includes('應用題')) solutions.push("採用「逐步引導式提問」，陪同孩子拆解題目的已知與未知。");
                if (tag.includes('公式')) solutions.push("發放「公式推導手冊」，加強公式背後的由來與變形運用。");
                if (tag.includes('速度')) solutions.push("實施「計時限時小考演練」，提升考場專注度與答題節奏。");
            });

            if (checkedTags.length === 0) {
                commentBox.value = `本次測驗表現得分 ${score} 分。學習狀態穩定，觀念掌握度高，請繼續保持！`;
            } else {
                commentBox.value = `本次測驗得分 ${score} 分。針對目前盲點（${checkedTags.join('、')}），導師已擬定因材施教方案：${solutions.join(' ')} 老師會持續陪同孩子穩步前進！`;
            }
        };

        window.addNewSubjectConfig = async function() {
            const subName = document.getElementById('new-subject-input').value.trim();
            const unitsStr = document.getElementById('new-units-input').value.trim();

            if (!subName || !unitsStr) {
                alert('請完整填寫科目名稱與預設單元！');
                return;
            }

            const unitsArr = unitsStr.split(/[,，]/).map(u => u.trim()).filter(u => u);
            window.subjectSyllabus[subName] = unitsArr;

            try {
                await setDoc(doc(db, "systemSettings", "syllabusConfig"), {
                    syllabus: window.subjectSyllabus
                });
                alert(`✅ 成功新增科目【${subName}】與對應單元！`);
                document.getElementById('new-subject-input').value = '';
                document.getElementById('new-units-input').value = '';
                updateSubjectDropdown();
                toggleSettingsPanel();
            } catch (e) {
                console.error(e);
                alert('儲存設定失敗');
            }
        };

        function renderHistoryLogs(records) {
            const container = document.getElementById('history-logs-container');
            if (records.length === 0) {
                container.innerHTML = `<p style="color:#777; text-align:center;">尚無歷史檢測紀錄。</p>`;
                return;
            }

            container.innerHTML = records.map((r, index) => {
                const sc = Number(r.score) || 0;
                const badgeCls = sc >= 85 ? 'score-high' : (sc >= 70 ? 'score-mid' : 'score-low');
                const badgeText = sc >= 85 ? '🌟 卓越' : (sc >= 70 ? '👍 穩定' : '⚠️ 需加強');
                const tagsStr = (r.tags && Array.isArray(r.tags)) ? r.tags.join('、') : (r.tags || '無');

                return `
                    <div class="history-item" onclick="openEditRecordModal(${index})">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                            <b>📅 ${r.date || '未記錄日期'} ｜ 📚 [${r.subject || '數學'}] ${r.unit || '未指定單元'}</b>
                            <span class="badge-score ${badgeCls}">${r.score} 分 (${badgeText})</span>
                        </div>
                        <span>⚠️ 弱點：${tagsStr}</span><br>
                        <span style="color:#4a5568;">💬 方案：${r.comment || '無'}</span>
                    </div>
                `;
            }).join('');
        }

        // 開啟編輯紀錄彈窗
        window.openEditRecordModal = function(index) {
            const id = document.getElementById('student-select').value;
            const student = window.state.students.find(s => s.firestoreId === id);
            if (!student || !student.growthRecords || !student.growthRecords[index]) return;

            const record = student.growthRecords[index];
            document.getElementById('edit-record-index').value = index;
            document.getElementById('edit-record-date').value = record.date || '';
            document.getElementById('edit-record-score').value = record.score || '';
            document.getElementById('edit-record-subject').value = record.subject || '數學';
            document.getElementById('edit-record-unit').value = record.unit || '';
            document.getElementById('edit-record-comment').value = record.comment || '';

            document.getElementById('edit-record-modal').style.display = 'flex';
        };

        // 儲存修改後的紀錄
        window.updateGrowthRecord = async function() {
            const id = document.getElementById('student-select').value;
            const index = Number(document.getElementById('edit-record-index').value);
            const student = window.state.students.find(s => s.firestoreId === id);
            if (!student || !student.growthRecords[index]) return;

            student.growthRecords[index].date = document.getElementById('edit-record-date').value;
            student.growthRecords[index].score = Number(document.getElementById('edit-record-score').value);
            student.growthRecords[index].unit = document.getElementById('edit-record-unit').value;
            student.growthRecords[index].comment = document.getElementById('edit-record-comment').value;

            try {
                await setDoc(doc(db, "classLogStudents", id), {
                    ...student,
                    growthRecords: student.growthRecords
                });
                document.getElementById('edit-record-modal').style.display = 'none';
                alert('✅ 紀錄已成功更新！');
                loadStudentGrowthProfile();
            } catch (e) {
                console.error(e);
                alert('更新失敗，請檢查網路連線。');
            }
        };

        // 刪除特定紀錄
        window.deleteGrowthRecord = async function() {
            if (!confirm('⚠️ 確定要刪除這筆檢測紀錄嗎？此動作無法復原。')) return;

            const id = document.getElementById('student-select').value;
            const index = Number(document.getElementById('edit-record-index').value);
            const student = window.state.students.find(s => s.firestoreId === id);
            if (!student || !student.growthRecords[index]) return;

            student.growthRecords.splice(index, 1);

            try {
                await setDoc(doc(db, "classLogStudents", id), {
                    ...student,
                    growthRecords: student.growthRecords
                });
                document.getElementById('edit-record-modal').style.display = 'none';
                alert('✅ 該筆檢測紀錄已刪除！');
                loadStudentGrowthProfile();
            } catch (e) {
                console.error(e);
                alert('刪除失敗，請檢查網路連線。');
            }
        };

        function renderCharts(records) {
            let dims = [75, 75, 75, 75, 75];
            if (records.length > 0) {
                const latest = records[0];
                const sc = Number(latest.score) || 75;
                dims = [sc, Math.max(50, sc - 5), Math.min(100, sc + 5), Math.max(60, sc - 10), sc];
            }

            const ctxRadar = document.getElementById('growthRadarChart').getContext('2d');
            if (radarInstance) radarInstance.destroy();

            radarInstance = new Chart(ctxRadar, {
                type: 'radar',
                data: {
                    labels: ['基礎觀念扎實', '計算精準度', '文字題邏輯', '應用靈活性', '學習穩定度'],
                    datasets: [{
                        label: '能力掌握度',
                        data: dims,
                        backgroundColor: 'rgba(52, 152, 219, 0.25)',
                        borderColor: '#3498db',
                        borderWidth: 2,
                        pointBackgroundColor: '#3498db'
                    }]
                },
                options: { scales: { r: { min: 0, max: 100, ticks: { display: false } } } }
            });

            const sortedRecords = [...records].reverse();
            const labels = sortedRecords.map(r => r.date ? r.date.slice(5) : '未知日期');
            const scores = sortedRecords.map(r => r.score);

            const ctxLine = document.getElementById('growthLineChart').getContext('2d');
            if (lineInstance) lineInstance.destroy();

            lineInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: labels.length > 0 ? labels : ['初始評量'],
                    datasets: [{
                        label: '小考成績走勢',
                        data: scores.length > 0 ? scores : [75],
                        borderColor: '#2ecc71',
                        backgroundColor: 'rgba(46, 204, 113, 0.1)',
                        tension: 0.3,
                        fill: true,
                        pointRadius: 5
                    }]
                },
                options: {
                    scales: { y: { min: 0, max: 100 } }
                }
            });
        }

        window.saveGrowthRecord = async function() {
            const id = document.getElementById('student-select').value;
            const subject = document.getElementById('subject-select').value;
            const unit = document.getElementById('unit-select').value;
            const score = document.getElementById('eval-score').value;
            const subNote = document.getElementById('eval-sub-note').value.trim();
            const comment = document.getElementById('eval-comment').value.trim();
            const tags = Array.from(document.querySelectorAll('input[name="tags"]:checked')).map(el => el.value);

            if (!id || !unit || !score) {
                alert('請完整選擇學生、測驗單元與評量分數！');
                return;
            }

            const student = window.state.students.find(s => s.firestoreId === id);
            if (!student) return;

            if (!student.growthRecords) student.growthRecords = [];

            const newRecord = {
                date: new Date().toISOString().slice(0, 10),
                subject,
                unit: subNote ? `${unit} (${subNote})` : unit,
                score: Number(score),
                tags,
                comment
            };

            student.growthRecords.unshift(newRecord);

            try {
                await setDoc(doc(db, "classLogStudents", id), {
                    ...student,
                    growthRecords: student.growthRecords
                });
                alert('✅ 成長紀錄已成功同步至 Firebase 雲端！');
                loadStudentGrowthProfile();
            } catch (e) {
                console.error(e);
                alert('儲存失敗，請確認網路連線。');
            }
        };

        window.generateParentReport = function() {
            const id = document.getElementById('student-select').value;
            const subject = document.getElementById('subject-select').value;
            const unit = document.getElementById('unit-select').value;
            const score = document.getElementById('eval-score').value;
            const comment = document.getElementById('eval-comment').value.trim();
            const tags = Array.from(document.querySelectorAll('input[name="tags"]:checked')).map(el => el.value);

            if (!id || !unit || !score) {
                alert('請先填寫單元與分數，才能產生報表！');
                return;
            }

            const student = window.state.students.find(s => s.firestoreId === id);
            if (!student) return;

            const today = new Date().toISOString().slice(0, 10);
            
            const reportText = 
`【斗六顧德補習班】學員學習與能力診斷報告
------------------------
📅 檢測日期：${today}
👨‍🎓 學生姓名：${student.name} 同學
📚 檢測科目：${subject}
🎯 評量單元：${unit}
📈 本次得分：${score} 分
⚠️ 需加強單元/弱點：${tags.join('、') || '表現穩健，無特別盲點'}
💬 導師評語與因材施教方案：${comment || '學習態度良好，持續保持！'}
------------------------
感謝您的支持與配合，顧德補習班關心孩子的每一步成長！`;

            document.getElementById('line-report-text').value = reportText;
            document.getElementById('line-preview-box').style.display = 'block';
            document.getElementById('line-preview-box').scrollIntoView({ behavior: 'smooth' });
        };

        window.copyLineReport = function() {
            const textarea = document.getElementById('line-report-text');
            textarea.select();
            document.execCommand('copy');
            alert('✅ 已成功複製報表內容！可直接貼至 LINE 給家長。');
        };

        window.onload = function() {
            initCloudData();
        };
    </script>
</body>
</html>
