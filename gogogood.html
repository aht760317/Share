<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗六顧德系統 - 私人內部導航</title>
    <style>
        :root {
            --primary: #1e3c72;
            --secondary: #2a5298;
            --light: #f8f9fa;
            --dark: #333333;
            --card-bg: #ffffff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.85;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 22px;
            text-decoration: none;
            color: var(--dark);
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 6px solid var(--secondary);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        /* 項目顏色識別 */
        .card.official { border-left-color: #3498db; }
        .card.log { border-left-color: #2ecc71; }
        .card.attendance { border-left-color: #e74c3c; }
        .card.schedule { border-left-color: #f39c12; }
        .card.money { border-left-color: #9b59b6; }
        .card.bonus { border-left-color: #1abc9c; }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-icon {
            font-size: 1.6rem;
            margin-right: 12px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary);
        }

        .card-desc {
            font-size: 0.88rem;
            color: #666;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .card-action {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--secondary);
            display: flex;
            align-items: center;
        }

        .card-action::after {
            content: " →";
            transition: transform 0.2s;
        }

        .card:hover .card-action::after {
            transform: translateX(4px);
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>斗六顧德系統</h1>
            <p>內部專用管理與資訊入口導航</p>
        </header>

        <div class="grid-menu">
            <a href="https://aht760317.github.io/good-school/" target="_blank" class="card official">
                <div>
                    <div class="card-header">
                        <span class="card-icon">🌐</span>
                        <div class="card-title">A. 官方網站</div>
                    </div>
                    <div class="card-desc">對外招生網頁、課程介紹、班系說明與最新消息展示。</div>
                </div>
                <div class="card-action">進入官方網站</div>
            </a>

            <a href="https://aht760317.github.io/Share/ClassLog.html" target="_blank" class="card log">
                <div>
                    <div class="card-header">
                        <span class="card-icon">📖</span>
                        <div class="card-title">B. 教學日誌</div>
                    </div>
                    <div class="card-desc">老師雲端即時上課日誌、進度填寫與課堂狀況回報。</div>
                </div>
                <div class="card-action">開啟教學日誌</div>
            </a>

            <a href="https://aht760317.github.io/Share/rollbook.html" target="_blank" class="card attendance">
                <div>
                    <div class="card-header">
                        <span class="card-icon">📱</span>
                        <div class="card-title">C. 線上點名</div>
                    </div>
                    <div class="card-desc">今日課程即時點名、出缺勤狀態紀錄與點名管理。</div>
                </div>
                <div class="card-action">進行線上點名</div>
            </a>

            <a href="https://aht760317.github.io/good-school/class.html" target="_blank" class="card schedule">
                <div>
                    <div class="card-header">
                        <span class="card-icon">🗓️</span>
                        <div class="card-title">D. 線上課表</div>
                    </div>
                    <div class="card-desc">各班級排課總覽、時間對照與課程安排檢視。</div>
                </div>
                <div class="card-action">檢視線上課表</div>
            </a>

            <a href="https://aht760317.github.io/Share/indexmoney.html" target="_blank" class="card money">
                <div>
                    <div class="card-header">
                        <span class="card-icon">💳</span>
                        <div class="card-title">E. 繳費管理</div>
                    </div>
                    <div class="card-desc">學費繳交紀錄、帳務核對與未繳名單追蹤管理。</div>
                </div>
                <div class="card-action">進入繳費管理</div>
            </a>

            <a href="https://aht760317.github.io/Share/" target="_blank" class="card bonus">
                <div>
                    <div class="card-header">
                        <span class="card-icon">🤝</span>
                        <div class="card-title">F. 家長分潤</div>
                    </div>
                    <div class="card-desc">家長介紹獎金、推薦分潤計算與相關明細管理。</div>
                </div>
                <div class="card-action">查看家長分潤</div>
            </a>
        </div>

        <footer>
            &copy; 斗六顧德文教機構 Private Management System
        </footer>
    </div>

</body>
</html>
