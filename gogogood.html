<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗六顧德系統 - 核心管理門戶</title>
    <!-- Google Fonts 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-title: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-title);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景氛圍光暈 */
        .bg-glow-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            position: relative;
            z-index: 1;
        }

        /* 頂部標題 */
        header {
            text-align: center;
            margin-bottom: 45px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 999px;
            color: #60a5fa;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 10px #3b82f6;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1rem;
        }

        /* 網格系統 */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        /* 玻璃擬態卡片 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 20px 40px -15px var(--glow-color, rgba(0,0,0,0.5));
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* 項目專屬色彩主題 */
        .card-a { --theme: #38bdf8; --glow-color: rgba(56, 189, 248, 0.3); }
        .card-b { --theme: #34d399; --glow-color: rgba(52, 211, 153, 0.3); }
        .card-c { --theme: #f87171; --glow-color: rgba(248, 113, 113, 0.3); }
        .card-d { --theme: #fbbf24; --glow-color: rgba(251, 191, 36, 0.3); }
        .card-e { --theme: #c084fc; --glow-color: rgba(192, 132, 252, 0.3); }
        .card-f { --theme: #2dd4bf; --glow-color: rgba(45, 212, 191, 0.3); }

        /* 卡片頂部 */
        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .icon-wrapper {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--theme);
            transition: all 0.35s ease;
        }

        .card:hover .icon-wrapper {
            background: var(--theme);
            color: #0b0f19;
            box-shadow: 0 0 20px var(--theme);
            transform: scale(1.05);
        }

        .code-tag {
            font-size: 1.1rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.2);
            transition: color 0.3s;
        }

        .card:hover .code-tag {
            color: var(--theme);
        }

        /* 卡片文字 */
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* 卡片底部連結 */
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 16px;
        }

        .action-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .action-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .card:hover .action-label {
            opacity: 1;
            color: var(--theme);
        }

        .card:hover .action-arrow {
            background: var(--theme);
            color: #0b0f19;
            transform: translateX(4px);
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #475569;
            margin-top: 50px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 640px) {
            body { padding: 30px 16px; }
            header h1 { font-size: 2rem; }
            .grid-menu { grid-template-columns: 1fr; gap: 16px; }
            .card { padding: 22px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

        <div class="grid-menu">

            <a href="https://aht760317.github.io/good-school/" target="_blank" class="card card-a">

            <!-- E. 繳費管理 -->
            <a href="https://aht760317.github.io/Share/indexmoney.html" target="_blank" class="card card-e">
                <div>
                    <div class="card-top">

                    </div>

                </div>
                <div class="card-footer">
                    <span class="action-label">管理帳務</span>
                    <div class="action-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                </div>
            </a>

            <!-- F. 家長分潤 -->
            <a href="https://aht760317.github.io/Share/" target="_blank" class="card card-f">
                <div>
                    <div class="card-top">
                        <div class="icon-wrapper"><i class="fa-solid fa-handshake-angle"></i></div>
                        <span class="code-tag">F</span>

                </div>
                <div class="card-footer">

        </div>

        <footer>
            &copy; 斗六顧德補習班內部專用門戶 · Confidential System
        </footer>
    </div>

</body>
</html>
