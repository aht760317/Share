<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗六顧德補習班 - 教室教學日誌與管理系統</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --bg: #f8f9fa;
            --border: #ddd;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); color: #333; }
        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { background: none; border: none; color: white; font-size: 16px; padding: 8px 15px; cursor: pointer; border-radius: 4px; }
        .nav-btn.active, .nav-btn:hover { background: rgba(255,255,255,0.2); }
        .container { max-width: 1250px; margin: 20px auto; padding: 0 15px; }
        
        .section-content { display: none; }
        .section-content.active { display: block; }
        
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        input[type="text"], input[type="date"], input[type="number"], select, textarea {
            width: 100%; padding: 8px; margin: 5px 0 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box;
        }
        .btn { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-small { padding: 4px 8px; font-size: 13px; margin: 2px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { padding: 8px 15px; border: 1px solid var(--primary); background: white; color: var(--primary); cursor: pointer; border-radius: 4px; }
        .tab-btn.active { background: var(--primary); color: white; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: left; vertical-align: top; }
        th { background: #f1f1f1; }
        
        .alert-text { color: var(--danger); font-weight: bold; font-size: 0.9em; display: block; margin: 3px 0; }
        .success-text { color: var(--success); font-weight: bold; font-size: 0.9em; }
        .box-section { background: #fff8e1; padding: 8px; border-left: 4px solid var(--warning); margin-top: 5px; border-radius: 4px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .course-item { display: flex; align-items: center; justify-content: space-between; background: #fdfdfd; border: 1px solid var(--border); padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; }

        @media print {
            header, .no-print { display: none !important; }
            .card { box-shadow: none; border: 1px solid #000; }
        }
    </style>
</head>
<body>

    <header>
        <h2>斗六顧德補習班 管理系統</h2>
        <nav>
            <button class="nav-btn active" onclick="switchSection('teaching-logs', this)">教學日誌</button>
            <button class="nav-btn" onclick="switchSection('student-profiles', this)">學生通訊與檔案</button>
            <button class="nav-btn" onclick="switchSection('system-settings', this)">系統設定</button>
        </nav>
    </header>

    <div class="container">
        <!-- ================= 教學日誌區塊 ================= -->
        <section id="teaching-logs" class="section-content active">
            <div class="card no-print">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchDept('elementary', 'log')">國小部</button>
                    <button class="tab-btn" onclick="switchDept('junior', 'log')">國中部</button>
                </div>
                
                <div class="grid-2">
                    <div>
                        <label>選擇課程：</label>
                        <select id="log-course-select" onchange="renderLogStudents()"></select>
                    </div>
                    <div>
                        <label>日期：</label>
                        <input type="date" id="log-date">
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>教學日誌 (課程進度)：</label>
                        <textarea id="log-content" rows="3"></textarea>
                    </div>
                    <div>
                        <label>今日注意事項：</label>
                        <textarea id="log-notes" rows="3" placeholder="例如：下次要帶圓規..."></textarea>
                    </div>
                </div>

                <h3>今日學生狀況填寫</h3>
                <table>
                    <thead>
                        <tr>
                            <th width="12%">姓名</th>
                            <th width="12%">出席狀況</th>
                            <th width="12%">考試分數</th>
                            <th width="15%">作業狀態</th>
                            <th width="49%">狀態提醒與補課安排 / 當日建議</th>
                        </tr>
                    </thead>
                    <tbody id="log-students-tbody"></tbody>
                </table>
                <button class="btn" style="width: 100%; font-size: 16px; padding: 12px;" onclick="saveLog()">儲存今日日誌並同步至學生檔案</button>
            </div>

            <div class="card" id="history-logs">
                <h3>歷史教學日誌 <button class="btn no-print" onclick="window.print()" style="float: right;">列印日誌</button></h3>
                <div id="logs-container"></div>
            </div>
        </section>

        <!-- ================= 學生通訊與檔案區塊 ================= -->
        <section id="student-profiles" class="section-content">
            <div class="card grid-2">
                <div>
                    <h3>查詢班級學生</h3>
                    <select id="profile-course-select" onchange="renderProfileStudents()"></select>
                </div>
                <div style="text-align: right; padding-top: 20px;">
                    <button class="btn btn-success" onclick="openAddStudentModal()">+ 新增學生資料</button>
                </div>
            </div>

            <div class="card">
                <table id="profile-table">
                    <thead>
                        <tr>
                            <th width="10%">操作</th>
                            <th width="12%">姓名 / 電話</th>
                            <th width="15%">出席與請假狀況</th>
                            <th width="23%">補課與補考紀錄 (含內容與時間)</th>
                            <th width="40%">備註 / 老師建議 / 主任批示</th>
                        </tr>
                    </thead>
                    <tbody id="profile-students-tbody"></tbody>
                </table>
            </div>
        </section>

        <!-- ================= 系統基本設定區塊 ================= -->
        <section id="system-settings" class="section-content">
            <div class="card">
                <h3>新增班級課程</h3>
                <div class="grid-2">
                    <div>
                        <label>所屬部門</label>
                        <select id="new-course-dept">
                            <option value="elementary">國小部</option>
                            <option value="junior">國中部</option>
                        </select>
                    </div>
                    <div>
                        <label>課程名稱</label>
                        <input type="text" id="new-course-name" placeholder="例如：小五自然實驗班">
                    </div>
                </div>
                <button class="btn" onclick="addCourse()">加入系統</button>

                <h4 style="margin-top: 30px;">目前系統已有課程清單 (可修改名稱)：</h4>
                <div class="grid-2">
                    <div>
                        <h5 style="color: var(--primary);">國小部</h5>
                        <div id="elementary-courses-list"></div>
                    </div>
                    <div>
                        <h5 style="color: var(--primary);">國中部</h5>
                        <div id="junior-courses-list"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- 學生資料編輯/新增彈窗 (簡化以內嵌卡片呈現) -->
    <div class="card" id="student-modal" style="display:none; position:fixed; top:20%; left:30%; width:40%; z-index:999; background:white; border:2px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <h3 id="modal-title">新增/修改學生資料</h3>
        <input type="hidden" id="edit-student-id">
        <label>姓名：</label>
        <input type="text" id="modal-name">
        <label>聯絡電話：</label>
        <input type="text" id="modal-phone">
        <label>修習課程：</label>
        <select id="modal-course"></select>
        <div style="margin-top: 15px; text-align: right;">
            <button class="btn" onclick="saveStudentModal()">儲存</button>
            <button class="btn" style="background:#999;" onclick="document.getElementById('student-modal').style.display='none'">取消</button>
        </div>
    </div>

    <script>
        // ================= 模擬資料庫 =================
        const state = {
            courses: {
                elementary: ['小三數學課', '小四英文課', '小四數學課'],
                junior: ['國一數學課', '國二理化課']
            },
            students: [
                { 
                    id: 1, name: '王小明', phone: '0912-345-678', course: '小三數學課', 
                    attendance: '出席', score: 75, homework: '完成', 
                    makeupInfo: '考試低於80分 (75分)，需補考。已約定 8/30 14:00 補考', makeupPassed: false,
                    notes: [
                        { author: '老師', text: '數學邏輯佳，但計算粗心。' },
                        { author: '主任', text: '已關心過狀況，請繼續保持。 (主任已確認)' }
                    ]
                },
                { 
                    id: 2, name: '李大華', phone: '0933-222-111', course: '國一數學課', 
                    attendance: '請假', score: '', homework: '未完成', 
                    makeupInfo: '請假未到，需補課。補課內容：第一章代數運算', makeupPassed: true,
                    notes: [
                        { author: '老師', text: '基礎較弱，需多鼓勵。' }
                    ]
                }
            ]
        };

        document.getElementById('log-date').valueAsDate = new Date();

        function init() {
            updateCourseDropdowns();
            renderLogStudents();
            renderProfileStudents();
            renderSettingsCourseList();
        }

        function switchSection(sectionId, btn) {
            document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
        }

        // ================= 系統設定 =================
        function addCourse() {
            const dept = document.getElementById('new-course-dept').value;
            const name = document.getElementById('new-course-name').value.trim();
            if(!name) return alert('請輸入課程名稱！');
            state.courses[dept].push(name);
            document.getElementById('new-course-name').value = '';
            init();
        }

        function renameCourse(dept, index) {
            const oldName = state.courses[dept][index];
            const newName = prompt(`修改「${oldName}」新名稱：`, oldName);
            if(!newName || !newName.trim()) return;
            state.courses[dept][index] = newName.trim();
            state.students.forEach(s => { if(s.course === oldName) s.course = newName.trim(); });
            init();
        }

        function renderSettingsCourseList() {
            document.getElementById('elementary-courses-list').innerHTML = state.courses.elementary.map((c, idx) => `
                <div class="course-item"><span>${c}</span><button class="btn btn-warning btn-small" onclick="renameCourse('elementary', ${idx})">修改</button></div>`).join('');
            document.getElementById('junior-courses-list').innerHTML = state.courses.junior.map((c, idx) => `
                <div class="course-item"><span>${c}</span><button class="btn btn-warning btn-small" onclick="renameCourse('junior', ${idx})">修改</button></div>`).join('');
        }

        function updateCourseDropdowns() {
            const allCourses = [...state.courses.elementary, ...state.courses.junior];
            document.getElementById('profile-course-select').innerHTML = allCourses.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('modal-course').innerHTML = allCourses.map(c => `<option value="${c}">${c}</option>`).join('');
            const currentDept = document.querySelector('#teaching-logs .tab-btn.active')?.textContent.includes('國小') ? 'elementary' : 'junior';
            loadLogCourses(currentDept);
        }

        function loadLogCourses(dept) {
            document.getElementById('log-course-select').innerHTML = state.courses[dept].map(c => `<option value="${c}">${c}</option>`).join('');
            renderLogStudents();
        }

        function switchDept(dept) {
            document.querySelectorAll('#teaching-logs .tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadLogCourses(dept);
        }

        // ================= 學生檔案與管理 =================
        function openAddStudentModal() {
            document.getElementById('modal-title').innerText = '新增學生資料';
            document.getElementById('edit-student-id').value = '';
            document.getElementById('modal-name').value = '';
            document.getElementById('modal-phone').value = '';
            document.getElementById('student-modal').style.display = 'block';
        }

        function openEditStudentModal(id) {
            const s = state.students.find(item => item.id === id);
            if(!s) return;
            document.getElementById('modal-title').innerText = '修改學生資料';
            document.getElementById('edit-student-id').value = s.id;
            document.getElementById('modal-name').value = s.name;
            document.getElementById('modal-phone').value = s.phone;
            document.getElementById('modal-course').value = s.course;
            document.getElementById('student-modal').style.display = 'block';
        }

        function saveStudentModal() {
            const id = document.getElementById('edit-student-id').value;
            const name = document.getElementById('modal-name').value.trim();
            const phone = document.getElementById('modal-phone').value.trim();
            const course = document.getElementById('modal-course').value;
            if(!name) return alert('請填寫姓名！');

            if(id) {
                const s = state.students.find(item => item.id == id);
                s.name = name; s.phone = phone; s.course = course;
            } else {
                state.students.push({
                    id: Date.now(), name, phone, course, attendance: '出席', score: '', homework: '完成',
                    makeupInfo: '無須補課', makeupPassed: true, notes: [{ author: '老師', text: '新建立學生檔案。' }]
                });
            }
            document.getElementById('student-modal').style.display = 'none';
            renderProfileStudents();
            renderLogStudents();
        }

        function renderProfileStudents() {
            const selectedCourse = document.getElementById('profile-course-select').value;
            const tbody = document.getElementById('profile-students-tbody');
            const list = state.students.filter(s => s.course === selectedCourse);

            if(list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#777;">目前此班級尚無學生</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(s => `
                <tr>
                    <td><button class="btn btn-warning btn-small" onclick="openEditStudentModal(${s.id})">修改資料</button></td>
                    <td><strong>${s.name}</strong><br><span style="font-size:12px; color:#666">${s.phone}</span></td>
                    <td>
                        狀態：<b>${s.attendance}</b><br>
                        分數：${s.score !== '' ? s.score : '未登錄'}<br>
                        作業：${s.homework}
                    </td>
                    <td>
                        <div style="font-size:13px; color: ${s.makeupPassed ? 'green' : 'red'};">
                            ${s.makeupInfo}
                        </div>
                        <div style="margin-top:5px;">
                            補課結果：<b>${s.makeupPassed ? '✅ 已通過' : '⏳ 尚未通過/未補' }</b>
                            <button class="btn btn-small btn-success" onclick="toggleMakeupPass(${s.id})">切換通過狀態</button>
                        </div>
                    </td>
                    <td>
                        <div style="max-height: 100px; overflow-y:auto; border:1px solid #eee; padding:5px; margin-bottom:5px; font-size:13px;">
                            ${s.notes.map((n, idx) => `<div><b>[${n.author}]</b> ${n.text} <button onclick="deleteNote(${s.id}, ${idx})" style="border:none; background:none; color:red; cursor:pointer;">刪除</button></div>`).join('')}
                        </div>
                        <input type="text" id="new-note-${s.id}" placeholder="輸入老師建議或主任批示..." style="font-size:12px; margin-bottom:3px;">
                        <button class="btn btn-small" onclick="addNote(${s.id}, '老師建議')">+ 新增老師建議</button>
                        <button class="btn btn-small btn-warning" onclick="addNote(${s.id}, '主任批示 (已確認)')">+ 主任確認批示</button>
                    </td>
                </tr>
            `).join('');
        }

        function toggleMakeupPass(id) {
            const s = state.students.find(item => item.id === id);
            s.makeupPassed = !s.makeupPassed;
            renderProfileStudents();
        }

        function addNote(id, type) {
            const input = document.getElementById(`new-note-${id}`);
            const text = input.value.trim();
            if(!text) return alert('請輸入內容！');
            const s = state.students.find(item => item.id === id);
            s.notes.push({ author: type, text: text });
            input.value = '';
            renderProfileStudents();
        }

        function deleteNote(studentId, noteIdx) {
            const s = state.students.find(item => item.id === studentId);
            s.notes.splice(noteIdx, 1);
            renderProfileStudents();
        }

        // ================= 教學日誌填寫 =================
        function renderLogStudents() {
            const selectedCourse = document.getElementById('log-course-select').value;
            const tbody = document.getElementById('log-students-tbody');
            const list = state.students.filter(s => s.course === selectedCourse);

            if(list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#777;">此課程尚無學生，請至「學生通訊與檔案」新增。</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map((s, index) => `
                <tr>
                    <td><strong>${s.name}</strong></td>
                    <td>
                        <select id="log-att-${s.id}" onchange="checkTriggers(${s.id})">
                            <option value="出席" ${s.attendance==='出席'?'selected':''}>出席</option>
                            <option value="請假">請假</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" id="log-score-${s.id}" value="${s.score}" placeholder="分數" oninput="checkTriggers(${s.id})" style="width:70px;">
                    </td>
                    <td>
                        <select id="log-hw-${s.id}" onchange="checkTriggers(${s.id})">
                            <option value="完成" ${s.homework==='完成'?'selected':''}>完成</option>
                            <option value="未完成">未完成</option>
                        </select>
                    </td>
                    <td>
                        <div id="dynamic-alerts-${s.id}"></div>
                        <div class="box-section">
                            <label style="font-size:12px; font-weight:bold;">手動新增當日建議：</label>
                            <input type="text" id="log-suggest-${s.id}" placeholder="例如：上課精神不濟，回家需多休息" style="font-size:12px; margin-bottom:0;">
                        </div>
                    </td>
                </tr>
            `).join('');
            
            // 初始化計算一次提醒
            list.forEach(s => checkTriggers(s.id));
        }

        // 偵測分數低於 80、請假、未完成作業
        function checkTriggers(id) {
            const att = document.getElementById(`log-att-${id}`).value;
            const scoreVal = document.getElementById(`log-score-${id}`).value;
            const hw = document.getElementById(`log-hw-${id}`).value;
            const alertBox = document.getElementById(`dynamic-alerts-${id}`);

            let html = '';
            
            if(att === '请假' || att === '請假') {
                html += `<span class="alert-text">⚠️ 學生請假，需安排補課！</span>
                         <input type="text" id="makeup-desc-${id}" placeholder="請輸入補課內容與約定時間" style="font-size:12px; margin-bottom:5px;">`;
            }

            if(scoreVal !== '' && Number(scoreVal) < 80) {
                html += `<span class="alert-text">⚠️ 考試分數低於 80 分 (${scoreVal}分)，需安排補考與複習！</span>
                         <input type="text" id="retest-desc-${id}" placeholder="請輸入補考約定時間" style="font-size:12px; margin-bottom:5px;">`;
            }

            if(hw === '未完成') {
                html += `<span class="alert-text">❌ 作業未完成，請老師關注！</span>`;
            }

            alertBox.innerHTML = html;
        }

        function saveLog() {
            const date = document.getElementById('log-date').value;
            const course = document.getElementById('log-course-select').value;
            const content = document.getElementById('log-content').value;
            const notes = document.getElementById('log-notes').value;

            if(!content) return alert('請填寫教學進度日誌！');

            // 同步資料至學生檔案中
            const list = state.students.filter(s => s.course === course);
            list.forEach(s => {
                s.attendance = document.getElementById(`log-att-${s.id}`).value;
                s.score = document.getElementById(`log-score-${s.id}`).value;
                s.homework = document.getElementById(`log-hw-${s.id}`).value;

                let makeupText = '無須補課';
                let needsPassReset = false;

                if(s.attendance === '請假') {
                    const descInput = document.getElementById(`makeup-desc-${s.id}`);
                    makeupText = `請假需補課：${descInput ? descInput.value : '未填寫內容'}`;
                    needsPassReset = true;
                } else if(s.score !== '' && Number(s.score) < 80) {
                    const retestInput = document.getElementById(`retest-desc-${s.id}`);
                    makeupText = `考試低於80分(${s.score}分)需補考：${retestInput ? retestInput.value : '未填寫時間'}`;
                    needsPassReset = true;
                }

                if(needsPassReset) {
                    s.makeupInfo = makeupText;
                    s.makeupPassed = false; // 重新轉為未通過，等待主任確認
                } else {
                    s.makeupInfo = '正常出席，無補課需求';
                    s.makeupPassed = true;
                }

                // 收集當日建議並寫入學生備註
                const suggestInput = document.getElementById(`log-suggest-${s.id}`);
                if(suggestInput && suggestInput.value.trim()) {
                    s.notes.push({ author: '當日建議(' + date + ')', text: suggestInput.value.trim() });
                }
            });

            // 產生歷史日誌區塊
            const container = document.getElementById('logs-container');
            const newLog = document.createElement('div');
            newLog.style.cssText = 'border-left: 4px solid var(--accent); background: #f9f9f9; padding: 15px; margin-bottom: 15px;';
            newLog.innerHTML = `
                <h4 style="margin:0 0 10px 0;">[${course}] 日期：${date}</h4>
                <p><strong>教學進度：</strong><br>${content.replace(/\n/g, '<br>')}</p>
                <p><strong>注意事項：</strong><br>${notes ? notes.replace(/\n/g, '<br>') : '無'}</p>
                <p style="color:var(--success); font-size:13px;">✅ 今日日誌與出缺勤、補課提醒已同步更新至學生檔案！</p>
            `;
            container.insertBefore(newLog, container.firstChild);

            document.getElementById('log-content').value = '';
            document.getElementById('log-notes').value = '';
            alert('日誌儲存成功！學生檔案與補課狀態已連動更新。');
            renderProfileStudents();
        }

        init();
    </script>
</body>
</html>
