<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOYCAR - 斗六市國小學童專車管理系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Leaflet CSS (地圖樣式) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 400px; width: 100%; border-radius: 1rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <div class="max-w-7xl mx-auto p-4 sm:p-6">
        <!-- 頂部導覽與狀態 -->
        <header class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white rounded-2xl p-6 shadow-xl mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 mb-2">
                    <span class="bg-blue-500 text-white text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">JOYCAR Dispatch</span>
                    <span class="text-xs text-blue-200">斗六市國小專車內部管理系統</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">🚗 顧德搭車與地圖調度系統</h1>
                <p class="text-blue-100 text-sm mt-1">整合斗六市國小學區與車號對應、即時地圖標記及乘車名單管理</p>
            </div>
            <!-- 快速統計數據 -->
            <div class="flex gap-3">
                <div class="bg-white/10 backdrop-blur-md border border-white/20 px-4 py-2.5 rounded-xl text-center">
                    <p class="text-xs text-blue-200">總搭車人數</p>
                    <p id="totalCount" class="text-xl font-bold text-white">0</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md border border-white/20 px-4 py-2.5 rounded-xl text-center">
                    <p class="text-xs text-blue-200">營運車次</p>
                    <p id="busCount" class="text-xl font-bold text-emerald-400">0</p>
                </div>
            </div>
        </header>

        <!-- 主體網格佈局：左側列表與操作，右側地圖視覺化 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            
            <!-- 左側操作與學生清單 (佔 2 欄) -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- 篩選與工具列 -->
                <div class="bg-white rounded-2xl p-5 shadow-md">
                    <h2 class="font-bold text-slate-700 mb-3 text-sm uppercase tracking-wider">篩選與車號指派查詢</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">學校篩選</label>
                            <select id="filterSchool" onchange="filterData()" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="">全部國小</option>
                                <option value="斗六國小">斗六國小</option>
                                <option value="雲林國小">雲林國小</option>
                                <option value="鎮南國小">鎮南國小</option>
                                <option value="鎮東國小">鎮東國小</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">車號篩選</label>
                            <select id="filterBus" onchange="filterData()" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="">全部車號</option>
                                <option value="KAA-1234">KAA-1234 (01車)</option>
                                <option value="KAB-5678">KAB-5678 (02車)</option>
                                <option value="KAC-9999">KAC-9999 (03車)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">關鍵字搜尋</label>
                            <input type="text" id="searchKeyword" oninput="filterData()" placeholder="學生姓名或住址..." class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- 學生表格清單 -->
                <div class="bg-white rounded-2xl shadow-md overflow-hidden">
                    <div class="p-5 border-b border-slate-100 flex justify-between items-center">
                        <h2 class="font-bold text-slate-700">乘車學生明細與車號指派</h2>
                        <span class="text-xs text-slate-400">點擊「修改車號」可即時變更配載路線</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                    <th class="p-4">學校 / 班級</th>
                                    <th class="p-4">學生姓名</th>
                                    <th class="p-4">住家地址</th>
                                    <th class="p-4">車號 / 路線</th>
                                    <th class="p-4 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody" class="divide-y divide-slate-100 text-sm">
                                <!-- 動態生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- 右側地圖區域 (佔 1 欄) -->
            <div class="space-y-6">
                <div class="bg-white rounded-2xl p-5 shadow-md">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wider">🗺️ 斗六市地理與學校分佈</h2>
                        <span class="text-xs text-emerald-600 font-semibold bg-emerald-50 px-2 py-0.5 rounded">GPS 定位運作中</span>
                    </div>
                    <!-- Leaflet 地圖容器 -->
                    <div id="map"></div>
                    <p class="text-xs text-slate-400 mt-3 text-center">地圖標記包含斗六市各國小與學生相對位置</p>
                </div>
            </div>

        </div>
    </div>

    <!-- 編輯車號互動視窗 (Modal) -->
    <div id="editModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">修改學生車號與路線</h3>
            <input type="hidden" id="editStudentId">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-500 mb-1">學生姓名</label>
                <input type="text" id="editStudentName" disabled class="w-full bg-slate-100 border border-slate-300 rounded-xl p-2.5 text-sm text-slate-500">
            </div>
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-500 mb-1">指派車號</label>
                <select id="editBusNumber" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500">
                    <option value="KAA-1234">KAA-1234 (斗六線 01 車)</option>
                    <option value="KAB-5678">KAB-5678 (大學路專車 02 車)</option>
                    <option value="KAC-9999">KAC-9999 (東區接送專車 03 車)</option>
                </select>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-medium transition">取消</button>
                <button onclick="saveStudentBus()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition shadow">儲存變更</button>
            </div>
        </div>
    </div>

    <!-- 引入 Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 模擬內部資料庫 (包含斗六市經緯度)
        let studentDatabase = [
            { id: 1, school: "斗六國小", grade: "三年1班", name: "王小明", address: "斗六市鎮南路100號", busNumber: "KAA-1234", route: "斗六線 01 車", lat: 23.7078, lng: 120.5433 },
            { id: 2, school: "雲林國小", grade: "二年2班", name: "李小華", address: "斗六市大學路三段120號", busNumber: "KAB-5678", route: "大學路專車 02 車", lat: 23.6950, lng: 120.5460 },
            { id: 3, school: "鎮南國小", grade: "五年1班", name: "張大為", address: "斗六市中正路50號", busNumber: "KAA-1234", route: "斗六線 01 車", lat: 23.7100, lng: 120.5400 },
            { id: 4, school: "鎮東國小", grade: "一年3班", name: "陳美玲", address: "斗六市文化路180號", busNumber: "KAC-9999", route: "東區接送專車 03 車", lat: 23.7050, lng: 120.5520 },
            { id: 5, school: "斗六國小", grade: "四年2班", name: "林志豪", address: "斗六市庄頭路12號", busNumber: "KAC-9999", route: "東區接送專車 03 車", lat: 23.7150, lng: 120.5350 }
        ];

        // 初始化 Leaflet 地圖 (以斗六市中心為中心點)
        const map = L.map('map').setView([23.7078, 120.5433], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        // 渲染地圖標記
        function updateMapMarkers(data) {
            markersLayer.clearLayers();
            data.forEach(item => {
                const marker = L.marker([item.lat, item.lng]).bindPopup(`
                    <b>${item.name}</b><br>
                    學校：${item.school} (${item.grade})<br>
                    車號：<b style="color:blue;">${item.busNumber}</b><br>
                    地址：${item.address}
                `);
                markersLayer.addLayer(marker);
            });
        }

        // 渲染表格
        function renderTable(data) {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">沒有符合條件的學生資料</td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-4">
                        <span class="font-bold text-slate-700">${item.school}</span>
                        <p class="text-xs text-slate-400">${item.grade}</p>
                    </td>
                    <td class="p-4 font-medium text-slate-800">${item.name}</td>
                    <td class="p-4 text-slate-600 text-xs sm:text-sm">${item.address}</td>
                    <td class="p-4">
                        <span class="bg-blue-50 text-blue-700 font-semibold text-xs px-2.5 py-1 rounded-full border border-blue-100">
                            ${item.busNumber}
                        </span>
                        <p class="text-xs text-slate-400 mt-1">${item.route}</p>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="openEditModal(${item.id})" class="bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-slate-600 p-2 rounded-xl text-xs font-medium transition border border-slate-200">
                            ✏️ 修改車號
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 更新統計數據
            document.getElementById('totalCount').innerText = studentDatabase.length;
            const uniqueBuses = [...new Set(studentDatabase.map(s => s.busNumber))];
            document.getElementById('busCount').innerText = uniqueBuses.length;

            // 同步更新地圖標記
            updateMapMarkers(data);
        }

        // 篩選功能
        function filterData() {
            const schoolVal = document.getElementById('filterSchool').value;
            const busVal = document.getElementById('filterBus').value;
            const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();

            const filtered = studentDatabase.filter(item => {
                const matchSchool = schoolVal === "" || item.school === schoolVal;
                const matchBus = busVal === "" || item.busNumber === busVal;
                const matchKeyword = keyword === "" || 
                    item.name.toLowerCase().includes(keyword) || 
                    item.address.toLowerCase().includes(keyword);
                return matchSchool && matchBus && matchKeyword;
            });

            renderTable(filtered);
        }

        // 互動視窗控制
        function openEditModal(id) {
            const student = studentDatabase.find(s => s.id === id);
            if (!student) return;

            document.getElementById('editStudentId').value = student.id;
            document.getElementById('editStudentName').value = student.name;
            document.getElementById('editBusNumber').value = student.busNumber;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveStudentBus() {
            const id = parseInt(document.getElementById('editStudentId').value);
            const newBus = document.getElementById('editBusNumber').value;
            
            let newRoute = "斗六線 01 車";
            if (newBus === "KAB-5678") newRoute = "大學路專車 02 車";
            if (newBus === "KAC-9999") newRoute = "東區接送專車 03 車";

            const student = studentDatabase.find(s => s.id === id);
            if (student) {
                student.busNumber = newBus;
                student.route = newRoute;
            }

            closeModal();
            filterData();
        }

        // 頁面載入初始化
        window.onload = function() {
            renderTable(studentDatabase);
        };
    </script>
</body>
</html>
