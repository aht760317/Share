<!-- 國定假日與停課放假卡片 (支援今年顯示與歷年年份切換) -->
<div class="card" style="border-top: 4px solid var(--warning);">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div>
            <h3 style="color:var(--primary-dark); font-size:17px;">📢 國定假日與停課放假設定</h3>
            <p style="font-size:12.5px; color:#64748b; margin-top:2px;">設定之放假日將於點名表上自動標記為放假，不計入缺席。</p>
        </div>
        <!-- 歷年年份切換區 -->
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span style="font-size:13px; font-weight:bold; color:var(--primary-dark);">歷年檢視：</span>
            <div id="holidayYearPills" class="filter-btn-group" style="margin-top:0;"></div>
            <span id="holidayCountBadge" style="font-size:12.5px; font-weight:bold; color:var(--primary); background:#ffe4e6; padding:3px 8px; border-radius:6px;">共 0 天</span>
        </div>
    </div>

    <!-- 新增放假輸入列 -->
    <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
        <input type="date" id="newHolidayDate" style="padding:8px; border-radius:6px; width:auto; margin:0;">
        <input type="text" id="newHolidayName" placeholder="放假名稱 (例：中秋節放假、國慶連假停課)" style="padding:8px; border-radius:6px; flex:1; min-width:180px; margin:0;">
        <button class="btn btn-warning" onclick="verifyAndAddHoliday()">➕ 新增放假日</button>
    </div>

    <!-- 放假清單容器 -->
    <div id="holidayListDiv" style="margin-top:14px; overflow-x:auto;"></div>
</div>
