<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>斗六分校 - 收支帳務管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-lg text-white">
          <i class="fa-solid fa-school text-lg"></i>
        </div>
        <div>
          <span class="font-bold text-lg tracking-wide block">斗六分校 財務系統</span>
          <span class="text-xs text-slate-400 block -mt-1">Accounting & Finance</span>
        </div>
      </div>

      <nav class="flex space-x-1">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition bg-slate-800 text-white">
          <i class="fa-solid fa-chart-pie mr-1"></i> 收支總覽
        </button>
        <button onclick="switchTab('income')" id="nav-income" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800">
          <i class="fa-solid fa-arrow-trend-up text-emerald-400 mr-1"></i> 收入管理
        </button>
        <button onclick="switchTab('expense')" id="nav-expense" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800">
          <i class="fa-solid fa-arrow-trend-down text-rose-400 mr-1"></i> 支出管理
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800">
          <i class="fa-solid fa-sliders text-sky-400 mr-1"></i> 功能設定
        </button>
        <button onclick="switchTab('adv-settings')" id="nav-adv-settings" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800">
          <i class="fa-solid fa-gear text-amber-400 mr-1"></i> 系統設定
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

    <section id="sec-dashboard" class="tab-content space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">當月總收入</div>
          <div id="stat-total-income" class="text-2xl font-bold text-emerald-600">NT$ 0</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">當月總支出</div>
          <div id="stat-total-expense" class="text-2xl font-bold text-rose-600">NT$ 0</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">當月營業淨利</div>
          <div id="stat-net-profit" class="text-2xl font-bold text-indigo-600">NT$ 0</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">淨利率</div>
          <div id="stat-profit-rate" class="text-2xl font-bold text-slate-700">0%</div>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-800 flex items-center">
            <i class="fa-solid fa-clock-rotate-left mr-2 text-indigo-600"></i> 近期收支流水帳
          </h2>
          <button onclick="exportCSV()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition flex items-center">
            <i class="fa-solid fa-file-csv mr-1.5 text-emerald-600"></i> 匯出報表 (CSV)
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
              <tr>
                <th class="py-3 px-4">日期</th>
                <th class="py-3 px-4">類別</th>
                <th class="py-3 px-4">項目</th>
                <th class="py-3 px-4">摘要/備註</th>
                <th class="py-3 px-4">收款/支付方式</th>
                <th class="py-3 px-4 text-right">金額 (NTD)</th>
                <th class="py-3 px-4 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="transaction-list" class="divide-y divide-slate-100">
              </tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="sec-income" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-xl border border-emerald-100 shadow-sm">
        <h2 class="text-lg font-bold text-emerald-800 mb-4 flex items-center">
          <i class="fa-solid fa-circle-plus mr-2 text-emerald-600"></i> 新增收入項目
        </h2>
        <form id="income-form" onsubmit="handleAddTransaction(event, 'income')" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">日期</label>
            <input type="date" id="inc-date" required class="w-full border rounded-lg p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">收入分類</label>
            <select id="inc-category" class="w-full border rounded-lg p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">金額 (NTD)</label>
            <input type="number" id="inc-amount" min="1" placeholder="例如：12000" required class="w-full border rounded-lg p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">收款管道</label>
            <select id="inc-method" class="w-full border rounded-lg p-2 text-sm">
              <option value="現金">現金</option>
              <option value="銀行轉帳">銀行轉帳</option>
              <option value="信用卡">信用卡</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">摘要／備註說明</label>
            <input type="text" id="inc-desc" placeholder="例如：王小明 英文班 9-11月學費" required class="w-full border rounded-lg p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500">
          </div>
          <div class="md:col-span-3 flex justify-end">
            <button type="submit" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg text-sm transition">
              儲存此筆收入
            </button>
          </div>
        </form>
      </div>
    </section>

    <section id="sec-expense" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-xl border border-rose-100 shadow-sm">
        <h2 class="text-lg font-bold text-rose-800 mb-4 flex items-center">
          <i class="fa-solid fa-circle-minus mr-2 text-rose-600"></i> 新增支出項目
        </h2>
        <form id="expense-form" onsubmit="handleAddTransaction(event, 'expense')" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">日期</label>
            <input type="date" id="exp-date" required class="w-full border rounded-lg p-2 text-sm focus:ring-rose-500 focus:border-rose-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">支出分類</label>
            <select id="exp-category" class="w-full border rounded-lg p-2 text-sm focus:ring-rose-500 focus:border-rose-500"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">金額 (NTD)</label>
            <input type="number" id="exp-amount" min="1" placeholder="例如：45000" required class="w-full border rounded-lg p-2 text-sm focus:ring-rose-500 focus:border-rose-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">支付管道</label>
            <select id="exp-method" class="w-full border rounded-lg p-2 text-sm">
              <option value="銀行匯款">銀行匯款</option>
              <option value="現金支付">現金支付</option>
              <option value="自動扣繳">自動扣繳</option>
              <option value="信用卡">信用卡</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">摘要／備註說明</label>
            <input type="text" id="exp-desc" placeholder="例如：9月份斗六分校房租" required class="w-full border rounded-lg p-2 text-sm focus:ring-rose-500 focus:border-rose-500">
          </div>
          <div class="md:col-span-3 flex justify-end">
            <button type="submit" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-medium rounded-lg text-sm transition">
              儲存此筆支出
            </button>
          </div>
        </form>
      </div>
    </section>

    <section id="sec-settings" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
          <i class="fa-solid fa-list-check mr-2 text-sky-600"></i> 收支科目類別自訂
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <h3 class="text-sm font-semibold text-emerald-700 mb-2">收入類別清單</h3>
            <ul id="setting-income-list" class="space-y-1 mb-3 text-sm"></ul>
            <div class="flex space-x-2">
              <input type="text" id="new-inc-cat" placeholder="新增收入項目..." class="border rounded-lg p-1.5 text-xs flex-1">
              <button onclick="addCategory('income')" class="px-3 py-1.5 bg-emerald-600 text-white text-xs rounded-lg hover:bg-emerald-700">新增</button>
            </div>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-rose-700 mb-2">支出類別清單</h3>
            <ul id="setting-expense-list" class="space-y-1 mb-3 text-sm"></ul>
            <div class="flex space-x-2">
              <input type="text" id="new-exp-cat" placeholder="新增支出項目..." class="border rounded-lg p-1.5 text-xs flex-1">
              <button onclick="addCategory('expense')" class="px-3 py-1.5 bg-rose-600 text-white text-xs rounded-lg hover:bg-rose-700">新增</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="sec-adv-settings" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
          <i class="fa-solid fa-sliders mr-2 text-amber-500"></i> 分校與系統進階設定
        </h2>
        <div class="space-y-4 max-w-lg">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">當前營運分校</label>
            <input type="text" value="斗六分校" disabled class="w-full bg-slate-100 border rounded-lg p-2 text-sm text-slate-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">資料備份與清除</label>
            <div class="flex space-x-3 mt-2">
              <button onclick="clearAllData()" class="px-4 py-2 border border-rose-300 text-rose-600 hover:bg-rose-50 rounded-lg text-xs font-semibold transition">
                <i class="fa-solid fa-trash-can mr-1"></i> 清空所有記帳資料
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    // 預設資料
    const defaultIncomeCategories = ["學費", "餐費", "教材費", "其他收入"];
    const defaultExpenseCategories = [
      "電費", "水費", "老師薪水", "房租", "網路", "電話費", 
      "勞健保", "獎金", "廣告費", "文具費", "雜項與維護"
    ];

    // 初始化狀態
    let state = {
      transactions: JSON.parse(localStorage.getItem('dl_records')) || [],
      incomeCategories: JSON.parse(localStorage.getItem('dl_inc_cat')) || defaultIncomeCategories,
      expenseCategories: JSON.parse(localStorage.getItem('dl_exp_cat')) || defaultExpenseCategories
    };

    // 初始化頁面
    document.addEventListener('DOMContentLoaded', () => {
      // 預設填入今日日期
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('inc-date').value = today;
      document.getElementById('exp-date').value = today;

      renderCategories();
      renderDashboard();
    });

    // 切換分頁
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-slate-800', 'text-white');
        btn.classList.add('text-slate-300');
      });

      document.getElementById(`sec-${tabId}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${tabId}`);
      activeNav.classList.add('bg-slate-800', 'text-white');
      activeNav.classList.remove('text-slate-300');
    }

    // 渲染分類下拉選單與設定列表
    function renderCategories() {
      // 下拉選單
      const incSelect = document.getElementById('inc-category');
      const expSelect = document.getElementById('exp-category');
      incSelect.innerHTML = state.incomeCategories.map(c => `<option value="${c}">${c}</option>`).join('');
      expSelect.innerHTML = state.expenseCategories.map(c => `<option value="${c}">${c}</option>`).join('');

      // 設定列表
      const incList = document.getElementById('setting-income-list');
      const expList = document.getElementById('setting-expense-list');
      incList.innerHTML = state.incomeCategories.map((c, i) => `
        <li class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100">
          <span>${c}</span>
          <button onclick="removeCategory('income', ${i})" class="text-rose-500 hover:text-rose-700 text-xs"><i class="fa-solid fa-xmark"></i></button>
        </li>
      `).join('');

      expList.innerHTML = state.expenseCategories.map((c, i) => `
        <li class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100">
          <span>${c}</span>
          <button onclick="removeCategory('expense', ${i})" class="text-rose-500 hover:text-rose-700 text-xs"><i class="fa-solid fa-xmark"></i></button>
        </li>
      `).join('');
    }

    // 新增類別
    function addCategory(type) {
      const input = document.getElementById(type === 'income' ? 'new-inc-cat' : 'new-exp-cat');
      const val = input.value.trim();
      if (!val) return;

      if (type === 'income') {
        state.incomeCategories.push(val);
        localStorage.setItem('dl_inc_cat', JSON.stringify(state.incomeCategories));
      } else {
        state.expenseCategories.push(val);
        localStorage.setItem('dl_exp_cat', JSON.stringify(state.expenseCategories));
      }
      input.value = '';
      renderCategories();
    }

    // 刪除類別
    function removeCategory(type, index) {
      if (type === 'income') {
        state.incomeCategories.splice(index, 1);
        localStorage.setItem('dl_inc_cat', JSON.stringify(state.incomeCategories));
      } else {
        state.expenseCategories.splice(index, 1);
        localStorage.setItem('dl_exp_cat', JSON.stringify(state.expenseCategories));
      }
      renderCategories();
    }

    // 新增收支紀錄
    function handleAddTransaction(event, type) {
      event.preventDefault();
      const prefix = type === 'income' ? 'inc' : 'exp';
      const date = document.getElementById(`${prefix}-date`).value;
      const category = document.getElementById(`${prefix}-category`).value;
      const amount = parseFloat(document.getElementById(`${prefix}-amount`).value);
      const method = document.getElementById(`${prefix}-method`).value;
      const desc = document.getElementById(`${prefix}-desc`).value;

      const record = {
        id: Date.now(),
        type,
        date,
        category,
        amount,
        method,
        desc
      };

      state.transactions.unshift(record);
      localStorage.setItem('dl_records', JSON.stringify(state.transactions));
      
      // 清空描述與金額
      document.getElementById(`${prefix}-amount`).value = '';
      document.getElementById(`${prefix}-desc`).value = '';

      renderDashboard();
      switchTab('dashboard');
    }

    // 刪除紀錄
    function deleteTransaction(id) {
      if (!confirm("確定要刪除此筆記錄？")) return;
      state.transactions = state.transactions.filter(t => t.id !== id);
      localStorage.setItem('dl_records', JSON.stringify(state.transactions));
      renderDashboard();
    }

    // 渲染總覽數據與列表
    function renderDashboard() {
      let totalInc = 0;
      let totalExp = 0;

      const tbody = document.getElementById('transaction-list');
      tbody.innerHTML = '';

      if (state.transactions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400">目前尚無收支明細</td></tr>`;
      } else {
        state.transactions.forEach(t => {
          if (t.type === 'income') totalInc += t.amount;
          if (t.type === 'expense') totalExp += t.amount;

          const isIncome = t.type === 'income';
          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
          tr.innerHTML = `
            <td class="py-3 px-4 text-slate-600 font-medium">${t.date}</td>
            <td class="py-3 px-4">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold ${isIncome ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                ${isIncome ? '收入' : '支出'}
              </span>
            </td>
            <td class="py-3 px-4 font-semibold text-slate-700">${t.category}</td>
            <td class="py-3 px-4 text-slate-600">${t.desc}</td>
            <td class="py-3 px-4 text-slate-500 text-xs">${t.method}</td>
            <td class="py-3 px-4 text-right font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
              ${isIncome ? '+' : '-'} NT$ ${t.amount.toLocaleString()}
            </td>
            <td class="py-3 px-4 text-center">
              <button onclick="deleteTransaction(${t.id})" class="text-slate-400 hover:text-rose-600 transition text-xs">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      const netProfit = totalInc - totalExp;
      const profitRate = totalInc > 0 ? ((netProfit / totalInc) * 100).toFixed(1) : 0;

      document.getElementById('stat-total-income').innerText = `NT$ ${totalInc.toLocaleString()}`;
      document.getElementById('stat-total-expense').innerText = `NT$ ${totalExp.toLocaleString()}`;
      document.getElementById('stat-net-profit').innerText = `NT$ ${netProfit.toLocaleString()}`;
      document.getElementById('stat-profit-rate').innerText = `${profitRate}%`;
    }

    // 匯出 CSV 報表
    function exportCSV() {
      if (state.transactions.length === 0) return alert("目前無資料可匯出！");
      let csvContent = "\uFEFF日期,收支類別,科目項目,摘要說明,收付款管道,金額\n";
      state.transactions.forEach(t => {
        csvContent += `"${t.date}","${t.type === 'income' ? '收入' : '支出'}","${t.category}","${t.desc}","${t.method}",${t.amount}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", `斗六分校_收支帳務表_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 清空資料
    function clearAllData() {
      if (confirm("⚠️ 確定要清除所有收支資料嗎？此動作無法復原！")) {
        state.transactions = [];
        localStorage.removeItem('dl_records');
        renderDashboard();
      }
    }
  </script>
</body>
</html>
