<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>斗六分校 - 收支帳務管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-lg text-white">
          <i class="fa-solid fa-school text-lg"></i>
        </div>
        <div>
          <span class="font-bold text-lg tracking-wide block">斗六分校 財務系統</span>
          <span class="text-xs text-slate-400 block -mt-1">Accounting & Finance</span>
        </div>
      </div>

      <nav class="flex space-x-2">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition bg-slate-800 text-white">
          <i class="fa-solid fa-chart-pie mr-1"></i> 收支總覽
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800">
          <i class="fa-solid fa-sliders text-sky-400 mr-1"></i> 功能設定
        </button>
        <button onclick="switchTab('adv-settings')" id="nav-adv-settings" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800">
          <i class="fa-solid fa-gear text-amber-400 mr-1"></i> 系統設定
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

    <section id="sec-dashboard" class="tab-content space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">當月總收入</div>
          <div id="stat-total-income" class="text-2xl font-bold text-emerald-600">NT$ 0</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">當月總支出</div>
          <div id="stat-total-expense" class="text-2xl font-bold text-rose-600">NT$ 0</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">當月營業淨利</div>
          <div id="stat-net-profit" class="text-2xl font-bold text-indigo-600">NT$ 0</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">淨利率</div>
          <div id="stat-profit-rate" class="text-2xl font-bold text-slate-700">0%</div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <button onclick="openModal('income')" class="flex items-center justify-between p-5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl shadow-md hover:shadow-lg hover:from-emerald-600 hover:to-teal-700 transition transform active:scale-[0.99]">
          <div class="text-left">
            <div class="text-lg font-bold flex items-center">
              <i class="fa-solid fa-circle-arrow-down mr-2 text-xl"></i> 收入管理
            </div>
            <div class="text-xs text-emerald-100 mt-1">點擊新增學費、餐費、教材費等收入項目</div>
          </div>
          <span class="bg-white/20 px-3 py-1.5 rounded-lg text-xs font-semibold backdrop-blur-sm">
            <i class="fa-solid fa-plus mr-1"></i> 新增收入
          </span>
        </button>

        <button onclick="openModal('expense')" class="flex items-center justify-between p-5 bg-gradient-to-r from-rose-500 to-red-600 text-white rounded-xl shadow-md hover:shadow-lg hover:from-rose-600 hover:to-red-700 transition transform active:scale-[0.99]">
          <div class="text-left">
            <div class="text-lg font-bold flex items-center">
              <i class="fa-solid fa-circle-arrow-up mr-2 text-xl"></i> 支出管理
            </div>
            <div class="text-xs text-rose-100 mt-1">點擊新增薪資、房租、水電、廣告、文具等支出項目</div>
          </div>
          <span class="bg-white/20 px-3 py-1.5 rounded-lg text-xs font-semibold backdrop-blur-sm">
            <i class="fa-solid fa-plus mr-1"></i> 新增支出
          </span>
        </button>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-800 flex items-center">
            <i class="fa-solid fa-clock-rotate-left mr-2 text-indigo-600"></i> 近期收支明細表
          </h2>
          <button onclick="exportCSV()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition flex items-center">
            <i class="fa-solid fa-file-csv mr-1.5 text-emerald-600"></i> 匯出報表 (CSV)
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
              <tr>
                <th class="py-3 px-4">建立時間</th>
                <th class="py-3 px-4">類別</th>
                <th class="py-3 px-4">摘要</th>
                <th class="py-3 px-4">說明</th>
                <th class="py-3 px-4 text-right">金額 (NTD)</th>
                <th class="py-3 px-4">備註</th>
                <th class="py-3 px-4 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="transaction-list" class="divide-y divide-slate-100">
              </tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="sec-settings" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
          <i class="fa-solid fa-list-check mr-2 text-sky-600"></i> 收支摘要分類常用清單
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <h3 class="text-sm font-semibold text-emerald-700 mb-2">收入常見摘要</h3>
            <ul id="setting-income-list" class="space-y-1 mb-3 text-sm"></ul>
            <div class="flex space-x-2">
              <input type="text" id="new-inc-cat" placeholder="新增收入摘要 (如: 寒假營隊費)..." class="border rounded-lg p-1.5 text-xs flex-1">
              <button onclick="addCategory('income')" class="px-3 py-1.5 bg-emerald-600 text-white text-xs rounded-lg hover:bg-emerald-700">新增</button>
            </div>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-rose-700 mb-2">支出常見摘要</h3>
            <ul id="setting-expense-list" class="space-y-1 mb-3 text-sm"></ul>
            <div class="flex space-x-2">
              <input type="text" id="new-exp-cat" placeholder="新增支出摘要 (如: 冷氣清洗)..." class="border rounded-lg p-1.5 text-xs flex-1">
              <button onclick="addCategory('expense')" class="px-3 py-1.5 bg-rose-600 text-white text-xs rounded-lg hover:bg-rose-700">新增</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="sec-adv-settings" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
          <i class="fa-solid fa-sliders mr-2 text-amber-500"></i> 分校與系統進階設定
        </h2>
        <div class="space-y-4 max-w-lg">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">當前營運分校</label>
            <input type="text" value="斗六分校" disabled class="w-full bg-slate-100 border rounded-lg p-2 text-sm text-slate-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">資料重置</label>
            <button onclick="clearAllData()" class="px-4 py-2 border border-rose-300 text-rose-600 hover:bg-rose-50 rounded-lg text-xs font-semibold transition">
              <i class="fa-solid fa-trash-can mr-1"></i> 清空所有記帳明細
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="record-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden transform transition-all">
      <div id="modal-header" class="px-6 py-4 flex justify-between items-center text-white bg-emerald-600">
        <h3 id="modal-title" class="font-bold text-base flex items-center">
          <i class="fa-solid fa-pen-to-square mr-2"></i> 填寫收入明細
        </h3>
        <button onclick="closeModal()" class="text-white/80 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="record-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="entry-type" value="income">

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">
            建立時間 <span class="text-rose-500 font-bold">*</span>
          </label>
          <input type="datetime-local" id="entry-time" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">
            摘要 <span class="text-rose-500 font-bold">*</span>
          </label>
          <div class="flex space-x-2">
            <select id="entry-summary-select" onchange="onSummarySelectChange()" class="border border-slate-300 rounded-lg px-2 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none w-1/3 bg-slate-50"></select>
            <input type="text" id="entry-summary" placeholder="或自行輸入摘要..." required class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">
            金額 <span class="text-rose-500 font-bold">*</span>
          </label>
          <div class="relative">
            <span class="absolute left-3 top-2 text-slate-400 text-sm">NT$</span>
            <input type="number" id="entry-amount" min="1" step="any" placeholder="例如：15000" required class="w-full border border-slate-300 rounded-lg pl-12 pr-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-semibold">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">說明</label>
          <input type="text" id="entry-desc" placeholder="例如：王小明 國小英文班 9-11月學費 或 7-8月夏季電費" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">備註</label>
          <textarea id="entry-note" rows="2" placeholder="例如：收據編號 #1001、匯款帳號後五碼 12345" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-medium rounded-lg transition">
            取消
          </button>
          <button type="submit" id="modal-submit-btn" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg shadow transition">
            儲存紀錄
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 預設分類
    const defaultIncomeSummaries = ["學費", "餐費", "教材費", "其他收入"];
    const defaultExpenseSummaries = [
      "電費", "水費", "老師薪水", "房租", "網路", "電話費", 
      "勞健保", "獎金", "廣告費", "文具費", "雜項與維護"
    ];

    // 初始化狀態
    let state = {
      transactions: JSON.parse(localStorage.getItem('dl_records_v2')) || [],
      incomeCategories: JSON.parse(localStorage.getItem('dl_inc_cat_v2')) || defaultIncomeSummaries,
      expenseCategories: JSON.parse(localStorage.getItem('dl_exp_cat_v2')) || defaultExpenseSummaries
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderCategories();
      renderDashboard();
    });

    // 取得當前時間字串 (YYYY-MM-DDTHH:mm)
    function getCurrentDateTimeLocal() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      return now.toISOString().slice(0, 16);
    }

    // 打開填寫框框 (Modal)
    function openModal(type) {
      const modal = document.getElementById('record-modal');
      const header = document.getElementById('modal-header');
      const title = document.getElementById('modal-title');
      const submitBtn = document.getElementById('modal-submit-btn');
      const typeInput = document.getElementById('entry-type');
      const summarySelect = document.getElementById('entry-summary-select');
      
      typeInput.value = type;
      document.getElementById('entry-time').value = getCurrentDateTimeLocal();
      document.getElementById('entry-amount').value = '';
      document.getElementById('entry-desc').value = '';
      document.getElementById('entry-note').value = '';

      if (type === 'income') {
        header.className = "px-6 py-4 flex justify-between items-center text-white bg-emerald-600";
        title.innerHTML = `<i class="fa-solid fa-circle-plus mr-2"></i> 填寫收入明細`;
        submitBtn.className = "px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg shadow transition";
        summarySelect.innerHTML = `<option value="">--快速選擇--</option>` + state.incomeCategories.map(c => `<option value="${c}">${c}</option>`).join('');
      } else {
        header.className = "px-6 py-4 flex justify-between items-center text-white bg-rose-600";
        title.innerHTML = `<i class="fa-solid fa-circle-minus mr-2"></i> 填寫支出明細`;
        submitBtn.className = "px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white text-sm font-medium rounded-lg shadow transition";
        summarySelect.innerHTML = `<option value="">--快速選擇--</option>` + state.expenseCategories.map(c => `<option value="${c}">${c}</option>`).join('');
      }

      document.getElementById('entry-summary').value = '';
      modal.classList.remove('hidden');
    }

    // 關閉 Modal
    function closeModal() {
      document.getElementById('record-modal').classList.add('hidden');
    }

    // 快速選擇摘要連動
    function onSummarySelectChange() {
      const selectVal = document.getElementById('entry-summary-select').value;
      if (selectVal) {
        document.getElementById('entry-summary').value = selectVal;
      }
    }

    // 提交儲存表單
    function handleFormSubmit(event) {
      event.preventDefault();
      const type = document.getElementById('entry-type').value;
      const createdAt = document.getElementById('entry-time').value;
      const summary = document.getElementById('entry-summary').value.trim();
      const amount = parseFloat(document.getElementById('entry-amount').value);
      const desc = document.getElementById('entry-desc').value.trim();
      const note = document.getElementById('entry-note').value.trim();

      const record = {
        id: Date.now(),
        type,
        createdAt,
        summary,
        amount,
        desc: desc || "-",
        note: note || "-"
      };

      state.transactions.unshift(record);
      localStorage.setItem('dl_records_v2', JSON.stringify(state.transactions));

      closeModal();
      renderDashboard();
    }

    // 刪除紀錄
    function deleteTransaction(id) {
      if (!confirm("確定要刪除這筆收支紀錄嗎？")) return;
      state.transactions = state.transactions.filter(t => t.id !== id);
      localStorage.setItem('dl_records_v2', JSON.stringify(state.transactions));
      renderDashboard();
    }

    // 渲染總覽與流水帳
    function renderDashboard() {
      let totalInc = 0;
      let totalExp = 0;

      const tbody = document.getElementById('transaction-list');
      tbody.innerHTML = '';

      if (state.transactions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400">目前尚無收支明細，請點擊上方按鈕開始記帳</td></tr>`;
      } else {
        state.transactions.forEach(t => {
          if (t.type === 'income') totalInc += t.amount;
          if (t.type === 'expense') totalExp += t.amount;

          const isIncome = t.type === 'income';
          const formattedDate = t.createdAt.replace('T', ' ');
          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
          tr.innerHTML = `
            <td class="py-3 px-4 text-slate-500 text-xs">${formattedDate}</td>
            <td class="py-3 px-4">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold ${isIncome ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                ${isIncome ? '收入' : '支出'}
              </span>
            </td>
            <td class="py-3 px-4 font-semibold text-slate-800">${t.summary}</td>
            <td class="py-3 px-4 text-slate-600">${t.desc}</td>
            <td class="py-3 px-4 text-right font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
              ${isIncome ? '+' : '-'} NT$ ${t.amount.toLocaleString()}
            </td>
            <td class="py-3 px-4 text-slate-400 text-xs">${t.note}</td>
            <td class="py-3 px-4 text-center">
              <button onclick="deleteTransaction(${t.id})" class="text-slate-300 hover:text-rose-600 transition text-xs">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      const netProfit = totalInc - totalExp;
      const profitRate = totalInc > 0 ? ((netProfit / totalInc) * 100).toFixed(1) : 0;

      document.getElementById('stat-total-income').innerText = `NT$ ${totalInc.toLocaleString()}`;
      document.getElementById('stat-total-expense').innerText = `NT$ ${totalExp.toLocaleString()}`;
      document.getElementById('stat-net-profit').innerText = `NT$ ${netProfit.toLocaleString()}`;
      document.getElementById('stat-profit-rate').innerText = `${profitRate}%`;
    }

    // 切換分頁
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-slate-800', 'text-white');
        btn.classList.add('text-slate-300');
      });

      document.getElementById(`sec-${tabId}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${tabId}`);
      activeNav.classList.add('bg-slate-800', 'text-white');
      activeNav.classList.remove('text-slate-300');
    }

    // 渲染分類設定
    function renderCategories() {
      const incList = document.getElementById('setting-income-list');
      const expList = document.getElementById('setting-expense-list');

      incList.innerHTML = state.incomeCategories.map((c, i) => `
        <li class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100">
          <span>${c}</span>
          <button onclick="removeCategory('income', ${i})" class="text-rose-500 hover:text-rose-700 text-xs"><i class="fa-solid fa-xmark"></i></button>
        </li>
      `).join('');

      expList.innerHTML = state.expenseCategories.map((c, i) => `
        <li class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100">
          <span>${c}</span>
          <button onclick="removeCategory('expense', ${i})" class="text-rose-500 hover:text-rose-700 text-xs"><i class="fa-solid fa-xmark"></i></button>
        </li>
      `).join('');
    }

    function addCategory(type) {
      const input = document.getElementById(type === 'income' ? 'new-inc-cat' : 'new-exp-cat');
      const val = input.value.trim();
      if (!val) return;

      if (type === 'income') {
        state.incomeCategories.push(val);
        localStorage.setItem('dl_inc_cat_v2', JSON.stringify(state.incomeCategories));
      } else {
        state.expenseCategories.push(val);
        localStorage.setItem('dl_exp_cat_v2', JSON.stringify(state.expenseCategories));
      }
      input.value = '';
      renderCategories();
    }

    function removeCategory(type, index) {
      if (type === 'income') {
        state.incomeCategories.splice(index, 1);
        localStorage.setItem('dl_inc_cat_v2', JSON.stringify(state.incomeCategories));
      } else {
        state.expenseCategories.splice(index, 1);
        localStorage.setItem('dl_exp_cat_v2', JSON.stringify(state.expenseCategories));
      }
      renderCategories();
    }

    // 匯出 CSV
    function exportCSV() {
      if (state.transactions.length === 0) return alert("目前無明細可匯出！");
      let csvContent = "\uFEFF建立時間,收支類別,摘要,說明,金額,備註\n";
      state.transactions.forEach(t => {
        csvContent += `"${t.createdAt.replace('T', ' ')}","${t.type === 'income' ? '收入' : '支出'}","${t.summary}","${t.desc}",${t.amount},"${t.note}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `斗六分校_收支帳務明細_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }

    // 清空資料
    function clearAllData() {
      if (confirm("⚠️ 確定要清除所有記帳資料嗎？此動作無法復原！")) {
        state.transactions = [];
        localStorage.removeItem('dl_records_v2');
        renderDashboard();
      }
    }
  </script>
</body>
