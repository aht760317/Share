<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy English Douliu - Staff Portal | 斗六佳音英語 行政整合工作台</title>
    <!-- Google Fonts: Poppins (美式圓潤無襯線字體) + Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --joy-blue: #0b5ed7;
            --joy-navy: #08285c;
            --joy-yellow: #ffc107;
            --joy-coral: #ff6b4a;
            --bg-light: #f7f9fc;
            --card-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 頂部美式學院風 Header */
        .portal-header {
            background: linear-gradient(135deg, var(--joy-navy) 0%, var(--joy-blue) 100%);
            color: #ffffff;
            padding: 50px 20px 45px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(8, 40, 92, 0.15);
            border-bottom: 5px solid var(--joy-yellow);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--joy-yellow);
            margin-bottom: 14px;
        }

        .portal-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .portal-subtitle {
            font-size: 1.05rem;
            opacity: 0.9;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* 主容器 */
        .portal-container {
            max-width: 680px;
            width: 100%;
            margin: -25px auto 40px;
            padding: 0 20px;
            flex-grow: 1;
        }

        /* 美式 Dashboard 卡片容器 */
        .system-hub {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--card-border);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 2px dashed #edf2f7;
        }

        .section-header i {
            color: var(--joy-blue);
            font-size: 1.4rem;
        }

        .section-header .section-text h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--joy-navy);
        }

        .section-header .section-text span {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* 整合按鈕：美式扁平直覺風格 */
        .app-action-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: #ffffff;
            border: 2px solid #edf2f7;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .app-action-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: var(--joy-yellow);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .app-action-card:hover {
            border-color: var(--joy-blue);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(11, 94, 215, 0.12);
        }

        .app-action-card:hover::before {
            opacity: 1;
        }

        .app-meta {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .app-icon {
            width: 52px;
            height: 52px;
            background: #eef2ff;
            color: var(--joy-blue);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: background 0.2s ease;
        }

        .app-action-card:hover .app-icon {
            background: var(--joy-blue);
            color: #ffffff;
        }

        .app-info h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .app-info p {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
        }

        .app-arrow {
            color: #cbd5e1;
            font-size: 1.1rem;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .app-action-card:hover .app-arrow {
            color: var(--joy-blue);
            transform: translateX(4px);
        }

        /* 頁尾 */
        .portal-footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .portal-footer strong {
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- 頂部學院風橫幅 -->
    <header class="portal-header">
        <div class="brand-badge">
            <i class="fa-solid fa-graduation-cap"></i> Joy English • Douliu Campus
        </div>
        <h1 class="portal-title">STAFF & ACADEMIC HUB</h1>
        <p class="portal-subtitle">斗六佳音英語 內部行政與教學工作台</p>
    </header>

    <!-- 主區塊 -->
    <main class="portal-container">
        <section class="system-hub">
            <div class="section-header">
                <i class="fa-solid fa-shapes"></i>
                <div class="section-text">
                    <h2>教務與出缺勤管理</h2>
                    <span>Academic & Attendance System</span>
                </div>
            </div>

            <!-- 單一入口：智慧教務點名系統 -->
            <a href="https://aht760317.github.io/Share/joyrollbook.html" target="_blank" class="app-action-card">
                <div class="app-meta">
                    <div class="app-icon">
                        <i class="fa-solid fa-clipboard-user"></i>
                    </div>
                    <div class="app-info">
                        <h3>智慧教務點名系統</h3>
                        <p>Smart Roll-Call & Class Register</p>
                    </div>
                </div>
                <div class="app-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </a>
        </section>
    </main>

    <!-- 頁尾宣告 -->
    <footer class="portal-footer">
        <p><strong>Joy English Douliu Branch</strong> © 2026 Internal Academic Portal.</p>
        <p style="margin-top: 4px; font-size: 0.78rem;">For Staff & Teachers Only</p>
    </footer>

</body>
</html>
